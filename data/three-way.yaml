# 北歐對照：同一個問題，三方各怎麼回答。只比較「想法」，不主張任何一方影響了另一方。
# 中華、希臘羅馬兩欄只寫本站現有卡片真的寫了的內容；卡片沒寫的，就直說沒寫，不補。
- theme: 世界怎麼開始
  chinese: {text: 盤古在一顆蛋裡長大，把天地撐開；他死後身體變成山川日月。, cards: [primordial-pangu]}
  greek: {text: 最初是卡厄斯（一道張開的裂縫），接著出現大地蓋亞。, cards: [primordial-chaos, primordial-gaia]}
  norse: {text: 最初只有一道張開的裂口；霜融成巨人尤彌爾，他被包爾的兒子們殺死後，身體變成大地、海和天空。, cards: [primordial-ymir]}
  diff: 盤古和尤彌爾都是「一個巨人的身體變成世界」：盤古是自己撐開天地，尤彌爾是被殺死、被拆開。希臘則是從張開的裂縫一代代長出來；北歐也是從一道張開的裂口開始，但接著出現的是巨人。
- theme: 世界會不會結束
  chinese: {text: 本站現有的中華神話卡片，沒有寫世界會怎麼結束。這一格先留空，不替它補故事。, cards: []}
  greek: {text: 本站現有的希臘羅馬卡片，沒有寫世界會怎麼結束。這一格先留空，不替它補故事。, cards: []}
  norse: {text: 會。諸神黃昏是神、巨人與怪物的最後一戰，世界被火燒毀；之後大地從海裡再度升起，一片翠綠。重生的段落，可能受到基督教影響。, cards: [story-ragnarok]}
  diff: 三方裡只有北歐這邊，本站有「世界終結、再重生」的完整故事。另外兩邊本站還沒寫，所以這一列不比較誰有、誰沒有，只說本站的卡片寫到哪裡。
- theme: 誰是主神
  chinese: {text: 天帝。本站有卡片的是黃帝，他後來被《史記》寫成第一位人間君主。, cards: [god-huangdi]}
  greek: {text: 宙斯。他推翻了父親克羅諾斯，拿雷電坐天下。, cards: [god-zeus]}
  norse: {text: 奧丁，阿薩神族裡最高、最年長的神，叫「眾神之父」；故事最後，他在諸神黃昏被狼殺死。, cards: [god-odin]}
  diff: 宙斯靠推翻父親坐上王位；黃帝是天帝，後來被寫成人間的君主；奧丁是「眾神之父」，但故事裡早就寫好，他最後會被狼殺死。
- theme: 愛搗蛋的角色
  chinese: {text: 本站現有的中華神話卡片裡，沒有以搗蛋為主角的神，這一格先留空。, cards: []}
  greek: {text: 荷米斯出生當天就偷走哥哥阿波羅的牛，後來成為眾神的信使；普羅米修斯用詭計騙宙斯，又把火偷給人類。, cards: [god-hermes, titan-prometheus]}
  norse: {text: 洛基：會變身、出主意，也陪索爾扮侍女去拿回錘子；他引導霍德爾射死巴德爾，被眾神綁起來；諸神黃昏時掌舵駛來敵船。, cards: [god-loki]}
  diff: 荷米斯的惡作劇最後變成他的差事；洛基既陪索爾去拿回錘子，也害死了巴德爾，最後被眾神綁起來。
