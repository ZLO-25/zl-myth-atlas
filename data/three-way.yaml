# 三套神話對照（希臘羅馬、北歐、中華）：同一個問題，三方各怎麼回答。只比較「想法」，不主張任何一方影響了另一方。
# 三欄都只寫本站現有卡片真的寫了的內容；卡片沒寫的，就直說沒寫，不補。
# （id 與欄位名稱 chinese／greek／norse 不變；畫面上的欄位順序是 希臘羅馬、北歐、中華。）
- theme: 世界怎麼開始
  chinese: {text: 盤古在一顆蛋裡長大，把天地撐開；他死後身體變成山川日月。另有「混沌」：《莊子》裡是沒有七竅的中央之帝，被朋友鑿了七天，就死了。, cards: [primordial-pangu, primordial-hundun]}
  greek: {text: 最初是卡厄斯（一道張開的裂縫），接著出現大地蓋亞。, cards: [primordial-chaos, primordial-gaia]}
  norse: {text: 最初只有一道張開的裂口；霜融成巨人尤彌爾，他被包爾的兒子們殺死後，身體變成大地、海和天空。, cards: [primordial-ymir, story-norse-creation]}
  diff: 盤古和尤彌爾都是「一個巨人的身體變成世界」：盤古是自己撐開天地，尤彌爾是被殺死、被拆開。希臘則是從張開的裂縫一代代長出來；北歐也是從一道張開的裂口開始，但接著出現的是巨人。
- theme: 世界會不會結束
  chinese: {text: 本站的中華神話卡片裡，沒有世界末日的故事。, cards: []}
  greek: {text: 希臘羅馬卡片裡沒有世界末日的故事。, cards: []}
  norse: {text: 會。諸神黃昏是神、巨人與怪物的最後一戰，世界被火燒毀；之後大地從海裡再度升起，一片翠綠。重生的段落，可能受到基督教影響。, cards: [story-ragnarok]}
  diff: 北歐神話最特別的地方，是連眾神的結局都先寫好了：世界會毀掉，再重新開始。本站另外兩邊的卡片沒有這樣的末日故事。
- theme: 誰是主神
  chinese: {text: 天帝。本站有卡片的是黃帝，他後來被《史記》寫成第一位人間君主；道教與民間信仰裡的天庭之主是玉皇大帝，台灣人叫他「天公」，宋真宗時朝廷正式上他的聖號。, cards: [god-huangdi, god-jade-emperor]}
  greek: {text: 宙斯。他推翻了父親克羅諾斯，拿雷電坐天下。, cards: [god-zeus, titan-cronus]}
  norse: {text: 奧丁，阿薩神族裡最高、最年長的神，叫「眾神之父」；故事最後，他在諸神黃昏被狼殺死。, cards: [god-odin]}
  diff: 宙斯靠推翻父親坐上王位；黃帝是天帝，後來被寫成人間的君主；奧丁是「眾神之父」，但故事裡早就寫好，他最後會被狼殺死。
- theme: 愛搗蛋的角色
  chinese: {text: 孫悟空：從花果山仙石裡迸出來的石猴，學會七十二變和觔斗雲，大鬧天宮，被如來壓在五行山下五百年，後來保護唐僧取經。, cards: [hero-sun-wukong, story-journey-west]}
  greek: {text: 荷米斯出生當天就偷走哥哥阿波羅的牛，後來成為眾神的信使；普羅米修斯用詭計騙宙斯，又把火偷給人類。, cards: [god-hermes, titan-prometheus]}
  norse: {text: 洛基：會變身、出主意，也陪索爾扮侍女去拿回錘子；他引導霍德爾射死巴德爾，被眾神綁起來；諸神黃昏時掌舵駛來敵船。, cards: [god-loki, story-thor-bride, story-baldr-death, story-loki-punishment]}
  diff: 荷米斯的惡作劇最後變成他的差事；洛基既陪索爾去拿回錘子，也害死了巴德爾，最後被眾神綁起來。孫悟空是明代小說《西遊記》裡的角色，他的「搗蛋」是大鬧天宮，最後被如來壓在山下，後來變成取經的保護者。
- theme: 大洪水
  chinese: {text: 大禹不再築堤堵水，而是挖河道讓水流走，《史記》說他居外十三年，過家門不敢入。, cards: [story-yu-flood, hero-yu]}
  greek: {text: 宙斯決定用大水淹死人類，普羅米修斯的兒子丟卡利翁造了船（箱子），和妻子皮拉活了下來；水退後，兩人丟出去的石頭變成了人。, cards: [story-deucalion-flood, titan-prometheus]}
  norse: {text: 包爾的兒子殺了尤彌爾，他的血多到淹死了霜巨人，只有貝格爾米爾一家搭「船」逃走（那個字的字面意思是「磨坊箱」）。, cards: [primordial-ymir, story-norse-creation]}
  diff: 中華的洪水故事主角是「治水的人」，後來成為夏朝的起點；北歐的大水是尤彌爾的血，發生在世界造好的時候，只有一家人逃出來。希臘的洪水是宙斯為了毀滅人類而降下的，倖存的夫妻靠丟石頭重新生出人類。
- theme: 龍
  chinese: {text: 龍是帶來雨水的祥獸，黃帝靠會蓄水的應龍去打蚩尤；「龍王」一詞來自佛經的八大龍王，後來變成住在水底龍宮、管下雨的水神。, cards: [beast-dragon, god-dragon-kings]}
  greek: {text: 伊阿宋要拿金羊毛，得先讓看守它、從不睡覺的巨龍睡著；米蒂亞用藥幫了他。, cards: [hero-jason]}
  norse: {text: 毒龍尼德霍格在世界樹的一條根下面，一直啃著這條根；另一條龍是法夫尼爾，他殺了父親、獨占黃金，變成龍躺在上面，被英雄齊格魯德刺穿心臟。, cards: [place-yggdrasil, story-sigurd]}
  diff: 中華的龍掌管雨水，是吉祥的象徵；本站希臘羅馬卡片裡的巨龍是看守寶物、擋在英雄前面的怪物；北歐的龍則是啃世界樹根的毒龍。三套神話的「龍」身分不一樣。
- theme: 人死了去哪裡
  chinese: {text: 古書沒有統一的說法：《左傳》說「黃泉」，《楚辭·招魂》說地下有幽都，由九曲的土伯守門，漢魏說泰山管死人的魂魄；後來佛教的閻羅王傳進來，變成十位審判亡魂的冥王（十殿閻君）。, cards: [place-youdu, god-yanluo]}
  greek: {text: 冥界在地底，由黑帝斯統治；亡魂搭船渡過冥河，經過三頭犬看守的大門；壞人被關進塔爾塔羅斯，英雄去極樂淨土。, cards: [place-underworld, god-hades, story-underworld-punishments]}
  norse: {text: 赫爾（洛基的女兒）掌管尼福爾海姆，替死於疾病與老死的人各分一個住處；戰死的人，一部分去奧丁的英靈殿，一部分去芙蕾雅的弗爾克范格。, cards: [god-hel, place-valhalla]}
  diff: 北歐照「怎麼死的」分地方（戰死、病死老死）；希臘照「生前做了什麼」分地方（罪人、英雄）；中華早期說法很零散，後來才長成像官府一樣的十殿，閻羅王也不是本土的神，名字來自印度佛教的 Yama。
- theme: 誰決定人的命運
  chinese: {text: 古書裡沒有對應的三位命運女神。卡片裡最近的概念有兩個：唐代《定婚店》的老人掌管「天下之婚牘」，說婚事「命苟未合」勉強也沒用；晉代《抱朴子》說灶神每月最後一晚上天報告人的罪狀，罪大的被扣去「紀」（三百天）。, cards: [god-yuelao, god-zaoshen]}
  greek: {text: 命運三女神：克洛托紡線、拉刻西斯量線、阿特洛波斯剪斷線。梅勒阿格羅斯出生第七天，她們說火爐裡那根木柴燒完，他就會死。, cards: [god-fates]}
  norse: {text: 諾恩住在世界樹下的烏爾德之泉邊，〈女先知的預言〉說有三位：烏爾德、薇兒丹蒂、詩寇蒂，替人類的孩子分配生命；斯諾里說諾恩其實有很多位，每天還要澆水讓世界樹不枯萎。, cards: [god-norns]}
  diff: 希臘與北歐都有一組掌管命運的女性；中華卡片裡沒有對應的三女神，只有「婚姻早已註定」和「神記錄人的過失、扣壽命」這兩種近似概念。希臘三女神是紡線、量線、剪線，北歐諾恩則是在泉邊替人訂下一生。
- theme: 冥界的渡口與守門者
  chinese: {text: 《玉曆寶鈔》說第十殿有金、銀、玉、石、木板、奈何六座橋；《西遊記》寫唐太宗過「奈河惡水」；敦煌變文寫阿鼻地獄的獄卒「總是牛頭馬面」。, cards: [god-yanluo]}
  greek: {text: 亡魂擠在冥河岸邊，擺渡人卡戎划船載他們過河；大門由三頭犬刻耳柏洛斯看守，只讓人進、不讓人出。, cards: [place-underworld, monster-cerberus]}
  norse: {text: 赫爾莫德穿過深谷，過了蓋約爾河上鋪著金的橋，橋邊少女莫德古德指點他走赫爾之路；〈巴德爾的夢〉說奧丁遇見一隻從赫爾那裡出來、胸前沾血的狗。, cards: [god-hel]}
  diff: 三邊都有「河或橋」和「守門的人或獸」，但卡片寫的做法不同：希臘是擺渡人與三頭犬，北歐是橋、守橋少女與狗，中華則是橋（奈何橋）加上押解亡魂的獄卒牛頭馬面。
- theme: 活人下冥界救人
  chinese: {text: 目連看見亡母墮入餓鬼道，後來唐五代敦煌變文寫他到各個地獄尋找母親；《盂蘭盆經》說要靠七月十五日供養眾僧，母親才能脫離苦。, cards: [story-mulian]}
  greek: {text: 奧菲斯為了救回死去的妻子尤麗狄絲下到冥界，冥王答應了，條件是出去前不准回頭。, cards: [hero-orpheus]}
  norse: {text: 巴德爾死後，赫莫德騎馬九夜到赫爾那裡請她放人；赫爾說，只要世上所有東西都為他哭就能回來，結果一位女巨人不肯哭。, cards: [god-hel, story-baldr-death]}
  diff: 三個故事都是為了救死去的親人，而且都附帶條件：奧菲斯的條件是出去前不能回頭，赫爾莫德的條件是全世界都要為巴德爾哭，目連則要靠眾僧的力量和七月十五日的供養。
