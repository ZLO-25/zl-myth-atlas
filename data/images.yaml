# 圖片清單。kind: work＝真實作品（博物館、Commons）；kind: ai＝AI 插畫（一定要 ai: true）
# commons: 的圖由 GitHub Actions（scripts/commons.ts）自動抓授權資料並轉成 WebP；授權與署名以 API 為準，不要自己猜。
# look: TODO 表示還沒寫「看這張圖」解說（下載後看過圖再寫）

- id: img-chaos-watts
  kind: work
  commons: "File:Assistants and George Frederic Watts - Chaos - Google Art Project.jpg"
  title: 〈混沌〉
  period: modern
  look: 一幅細長的橫幅：左邊是翻騰的火與煙，右邊一排巨人慢慢站起來、排成隊伍。畫家想畫的是世界從混亂走向秩序的過程。
  artist: 喬治．弗雷德里克．瓦茨工作室
  date: 約 1875 年
  museum: 英國倫敦泰特美術館

- id: img-gaia-pergamon
  kind: work
  commons: "File:Gigantomaquia - Altar de Pérgamo.jpg"
  title: 帕加馬祭壇浮雕：蓋亞求情
  period: ancient
  look: 雅典娜抓住一個巨人的頭髮把他拖走，下方只露出上半身的女性就是大地之母蓋亞，她從地面伸出來，哀求雅典娜放過自己的孩子。
  artist: 帕加馬祭壇的希臘雕刻師
  date: 約前 180–160 年
  museum: 德國柏林帕加馬博物館

- id: img-gaia-erichthonius
  kind: work
  commons: "File:Birth Erikhthonios Staatliche Antikensammlungen 2413.jpg"
  title: 蓋亞把嬰兒交給雅典娜
  period: ancient
  look: 這張照片只拍到瓶身一角。完整畫面是從地面升起的大地女神蓋亞，把嬰兒厄里克托尼俄斯交到雅典娜手中，雅典人自認是這個孩子的後代。
  artist: 赫爾莫納克斯（陶瓶畫家）
  date: 約前 470–460 年
  museum: 德國慕尼黑國立古代藝術博物館

- id: img-uranus-vasari
  kind: work
  commons: "File:The Mutilation of Uranus by Saturn.jpg"
  title: 〈克羅諾斯閹割烏拉諾斯〉
  period: modern
  look: 天花板上的圓形畫：克羅諾斯（左）舉起鐮刀砍向父親烏拉諾斯，背後是一個金色的天球。畫在佛羅倫斯的宮殿裡，象徵權力的交替。
  artist: 喬治．瓦薩里與克里斯托法諾．蓋拉爾迪
  date: 16 世紀中葉
  museum: 義大利佛羅倫斯舊宮

- id: img-cronus-goya
  kind: work
  commons: "File:Francisco de Goya, Saturno devorando a su hijo (1819-1823).jpg"
  title: 〈農神吞噬其子〉
  period: modern
  look: 哥雅原本把它直接畫在自家牆上，從沒打算展出。瞪大雙眼的巨人正在啃咬一具已經沒有頭的身體，看起來不像神話，更像一場惡夢。
  artist: 法蘭西斯科．哥雅
  date: 1820–1823 年
  museum: 西班牙馬德里普拉多美術館

- id: img-cronus-rubens
  kind: work
  commons: "File:Rubens saturn.jpg"
  title: 〈農神〉
  period: modern
  look: 拄著鐮刀的白髮老人咬住嬰兒的胸口，嬰兒痛苦地仰著頭。畫面上方的三顆星是土星的標誌，因為克羅諾斯的羅馬名字就是土星（薩圖恩）。
  artist: 彼得．保羅．魯本斯
  date: 1636–1638 年
  museum: 西班牙馬德里普拉多美術館

- id: img-cronus-stone
  kind: work
  commons: "File:Rhéa présentant une pierre emmaillotée à Cronos dessin du bas-relief d'un autel romain.jpg"
  title: 瑞亞把包著襁褓的石頭交給克羅諾斯
  period: ancient
  look: 瑞亞（左）把一個用布包好的「嬰兒」遞給坐著的克羅諾斯，布裡其實是一顆石頭。這是宙斯得以活下來的關鍵一刻。
  artist: 米蘭（A. L. Millin）《神話畫廊》中的線描，依據一座羅馬祭壇浮雕
  date: 版畫 1811 年；原浮雕為羅馬時期
  museum: 原浮雕在羅馬卡比托利歐博物館

- id: img-prometheus-rubens
  kind: work
  commons: "File:Rubens - Prometheus Bound.jpg"
  title: 〈被縛的普羅米修斯〉
  period: modern
  look: 普羅米修斯頭下腳上地被釘在岩石上，一隻巨鷹的爪子抓住他的臉，正在啄食他的肝。左下角還有他偷來的火把。
  artist: 彼得．保羅．魯本斯（老鷹由法蘭斯．史奈德斯所畫）
  date: 約 1611–1612 年
  museum: 美國費城藝術博物館

- id: img-atlas-farnese
  kind: work
  commons: "File:Farnese Atlas.jpg"
  title: 法爾內塞的阿特拉斯
  period: ancient
  look: 跪著的亞特拉斯用肩膀扛著的不是地球，而是「天球」：球上刻著星座，是現存最古老的星座圖像之一。
  artist: 佚名（羅馬時期大理石像，仿希臘化時期原作）
  date: 約公元 2 世紀
  museum: 義大利拿坡里國家考古博物館

- id: img-titans-haarlem
  kind: work
  commons: "File:Cornelis Cornelisz. van Haarlem - The Fall of the Titans - Google Art Project.jpg"
  title: 〈泰坦的墜落〉
  period: modern
  look: 一堆肌肉誇張的裸體巨人從天上摔落、疊在一起。畫家故意擠滿畫面，讓人感受到泰坦被推翻時的混亂。
  artist: 科內利斯．凡．哈勒姆
  date: 1588–1590 年
  museum: 丹麥哥本哈根國立美術館

- id: img-zeus-otricoli
  kind: work
  commons: "File:Zeus Otricoli Pio-Clementino Inv257.jpg"
  title: 奧特里科利的宙斯
  period: ancient
  look: 捲曲濃密的頭髮與鬍子、寬闊的額頭，是後世心目中「宙斯長相」的標準樣本。
  artist: 佚名（羅馬時期複製品，仿前 4 世紀希臘原作）
  date: 原作約前 4 世紀
  museum: 梵蒂岡博物館

- id: img-zeus-artemision
  kind: work
  commons: "File:Bronze Zeus or Poseidon NAMA X 15161 Athens Greece.jpg"
  title: 阿特米西翁青銅像
  period: ancient
  look: 這尊青銅像在阿特米西翁海角附近的沉船中被撈起。他右手原本握著一樣已經失落的武器：如果是雷電，他就是宙斯；如果是三叉戟，他就是波賽頓。學者至今還在爭論。
  artist: 佚名希臘雕刻家
  date: 約前 460 年
  museum: 希臘雅典國家考古博物館

- id: img-zeus-ingres
  kind: work
  commons: "File:Jupiter and Thetis (Ingres).jpg"
  title: 〈朱比特與忒提斯〉
  period: modern
  look: 海中女神忒提斯跪在宙斯腳邊，一手摸他的下巴，求他幫兒子阿基里斯。這個動作來自《伊里亞德》第一卷。
  artist: 尚－奧古斯特－多米尼克．安格爾
  date: 1811 年
  museum: 法國普羅旺斯地區艾克斯格拉內博物館

- id: img-hera-barberini
  kind: work
  commons: "File:Hera Barberini Chiaramonti Inv1210.jpg"
  title: 戴冠的希拉頭像
  period: ancient
  look: 頭戴高冠的端莊女性頭像。高冠是天后身分的標誌。
  artist: 佚名（羅馬時期複製品，仿前 5 世紀「巴貝里尼的希拉」類型）
  date: 原作約前 5 世紀
  museum: 梵蒂岡博物館

- id: img-hera-rubens
  kind: work
  commons: "File:Juno and Argus - Peter Paul Rubens - Wallraf-Richartz Museum - Cologne - Germany 2017.jpg"
  title: 〈朱諾與阿爾戈斯〉
  period: modern
  look: 百眼巨人阿爾戈斯被砍頭倒在地上，朱諾（希拉）把他的眼睛一顆顆取出，放到孔雀的尾巴上。孔雀尾羽上的「眼睛」就是這樣來的。
  artist: 彼得．保羅．魯本斯
  date: 約 1610–1611 年
  museum: 德國科隆瓦拉夫－里夏茨博物館

- id: img-poseidon-melos
  kind: work
  commons: "File:Marble statue of Poseidon from Melos. 125-100 B.C.jpg"
  title: 米洛斯的波賽頓
  period: ancient
  look: 這尊比真人還高的大理石像 1877 年在米洛斯島出土。他高舉的右手原本應該握著三叉戟。
  artist: 佚名希臘雕刻家
  date: 約前 125–100 年
  museum: 希臘雅典國家考古博物館

- id: img-poseidon-pinax
  kind: work
  commons: "File:Penteskouphia tablet - Poseidon (Louvre CA 452).jpg"
  title: 科林斯陶板上的波賽頓
  period: ancient
  look: 科林斯附近出土的小陶板，是信徒獻給波賽頓的祈福牌。畫得很簡單：一個留鬍子的男人拿著三叉戟，一眼就認得出是海神。
  artist: 佚名科林斯陶匠
  date: 約前 6 世紀
  museum: 法國巴黎羅浮宮

- id: img-demeter-eleusis
  kind: work
  commons: "File:Great Eleusinian relief (NAMA 126).jpg"
  title: 厄琉息斯大浮雕
  period: ancient
  look: 左邊的狄蜜特把麥穗交給中間的少年特里普托勒摩斯，右邊的波瑟芬妮把手放在他頭上祝福。傳說他之後把農耕傳遍了人間。
  artist: 佚名希臘雕刻家
  date: 約前 440–430 年
  museum: 希臘雅典國家考古博物館

- id: img-demeter-knidos
  kind: work
  commons: "File:Marble Statue of Demeter.jpg"
  title: 尼多斯的狄蜜特
  period: ancient
  look: 坐著、全身包在厚重衣袍裡的女神，神情沉靜帶著哀傷，常被解讀為正在思念被擄走的女兒。
  artist: 佚名希臘雕刻家
  date: 約前 350 年
  museum: 英國倫敦大英博物館

- id: img-athena-varvakeion
  kind: work
  commons: "File:Athena Varvakeion - MANA - Fidias.jpg"
  title: 瓦瓦奇恩的雅典娜
  period: ancient
  look: 帕德嫩神廟裡那尊 12 公尺高的金象牙雅典娜早已消失，這尊只有約 1 公尺高的小複製品，讓我們知道原作的樣子：頭盔、胸前的梅杜莎、右手上的勝利女神、腳邊的盾與大蛇。
  artist: 佚名（羅馬時期縮小複製品，仿菲迪亞斯的〈雅典娜．帕德嫩〉）
  date: 公元 3 世紀前半
  museum: 希臘雅典國家考古博物館

- id: img-athena-mourning
  kind: work
  commons: "File:Relief of the Mourning Athena, 460 B.C..jpg"
  title: 沉思的雅典娜
  period: ancient
  look: 雅典娜低頭倚著長矛，凝視面前一塊石碑。她沒有在戰鬥，而是在沉思，石碑可能是界碑或墓碑，所以這件浮雕也被稱為「哀悼的雅典娜」。
  artist: 佚名希臘雕刻家
  date: 約前 460 年
  museum: 希臘雅典衛城博物館

- id: img-athena-botticelli
  kind: work
  commons: "File:Botticelli Pallas and the Centaur.jpg"
  title: 〈帕拉斯與半人馬〉
  period: modern
  look: 手持長戟的女神抓住半人馬的頭髮，半人馬一臉委屈。一般解讀為理性（雅典娜）馴服了野性與慾望（半人馬）。
  artist: 桑德羅．波提且利
  date: 約 1482 年
  museum: 義大利佛羅倫斯烏菲茲美術館

- id: img-apollo-bernini
  kind: work
  commons: "File:Apollo and Daphne (Bernini).jpg"
  title: 〈阿波羅與達芙妮〉
  period: modern
  look: 繞著雕像走一圈：達芙妮的手指正長出樹葉，腳趾變成樹根，阿波羅的手碰到的已經是樹皮。大理石被雕得像正在變化的皮膚。
  artist: 吉安．洛倫佐．貝尼尼
  date: 1622–1625 年
  museum: 義大利羅馬博爾蓋塞美術館

- id: img-apollo-kylix
  kind: work
  commons: "File:Kylix with Apollo, AM of Delphi 8140, 201390.jpg"
  title: 德爾菲的阿波羅白底杯
  period: ancient
  look: 戴著桂冠的阿波羅坐在獅腳椅上，左手抱琴，右手倒出祭酒；對面停著一隻黑色的鳥。這是在阿波羅的聖地德爾菲出土的杯子。
  artist: 佚名（白底杯畫家）
  date: 約前 460 年
  museum: 希臘德爾菲考古博物館

- id: img-artemis-versailles
  kind: work
  commons: "File:Diane de Versailles - Musée du Louvre AGER Ma 589.jpg"
  title: 凡爾賽的黛安娜
  period: ancient
  look: 女神邁步向前，右手伸到背後的箭筒拿箭，身邊跟著一頭鹿。短裙、箭筒、鹿，三個標誌一次到齊。
  artist: 佚名（羅馬時期複製品，仿前 4 世紀希臘原作）
  date: 公元 1–2 世紀
  museum: 法國巴黎羅浮宮

- id: img-artemis-titian
  kind: work
  commons: "File:Titian - Diana and Actaeon - Google Art Project.jpg"
  title: 〈黛安娜與阿克泰翁〉
  period: modern
  look: 獵人阿克泰翁（左）掀開布簾，撞見正在沐浴的女神與仙女們。畫中的女神正要用布遮身，下一刻他就會被變成鹿。
  artist: 提香
  date: 1556–1559 年
  museum: 英國愛丁堡蘇格蘭國家美術館（與倫敦國家美術館共同持有）

- id: img-aphrodite-milo
  kind: work
  commons: "File:Venus de Milo Louvre Ma399 n4.jpg"
  title: 米洛的維納斯
  period: ancient
  look: 1820 年在米洛斯島出土時就已經沒有雙臂。她原本的手在做什麼，至今沒人知道，這反而成了她最讓人著迷的地方。
  artist: 佚名希臘雕刻家（有學者認為是安提阿的亞歷山德羅斯）
  date: 約前 150–125 年
  museum: 法國巴黎羅浮宮

- id: img-aphrodite-botticelli
  kind: work
  commons: "File:Sandro Botticelli - La nascita di Venere - Google Art Project - edited.jpg"
  title: 〈維納斯的誕生〉
  period: modern
  look: 女神站在貝殼上被風神吹到岸邊，右邊的女子正要替她披上斗篷。畫的就是赫西俄德說的：愛神從海沫中誕生、漂上岸。
  artist: 桑德羅．波提且利
  date: 約 1484–1486 年
  museum: 義大利佛羅倫斯烏菲茲美術館

- id: img-aphrodite-ludovisi
  kind: work
  commons: "File:Ludovisi throne Altemps Inv8570.jpg"
  title: 盧多維西寶座
  period: ancient
  look: 兩位侍女從兩側扶起一位女子，女子的薄衣緊貼身體，一般解讀為阿芙蘿黛蒂從海中誕生。也有學者懷疑這件作品是近代偽作。
  artist: 佚名希臘雕刻家（真偽有爭議）
  date: 約前 460 年
  museum: 義大利羅馬國立博物館阿爾騰普斯宮

- id: img-hephaestus-velazquez
  kind: work
  commons: "File:Diego Velázquez - The Forge of Vulcan - WGA24376.jpg"
  title: 〈阿波羅造訪伏爾甘的鍛造坊〉
  period: modern
  look: 頭頂發光的阿波羅（左）走進鍛造坊，告訴伏爾甘（赫菲斯托斯）他的妻子和戰神偷情。看看每個工人臉上的表情：一句話讓整個工坊都愣住了。
  artist: 迪亞哥．維拉斯奎茲
  date: 1630 年
  museum: 西班牙馬德里普拉多美術館

- id: img-hephaestus-return
  kind: work
  commons: "File:Leningrad Painter ARV 568 35extra return of Hephaistos.jpg"
  title: 赫菲斯托斯回到奧林帕斯
  period: ancient
  look: 喝醉的赫菲斯托斯騎在驢上，由酒神戴奧尼索斯帶回奧林帕斯。傳說他被丟下天庭後懷恨在心，只有酒神能把他勸回來。
  artist: 列寧格勒畫家
  date: 約前 470–460 年
  museum: 希臘雅典基克拉澤斯藝術博物館（古蘭德里斯收藏，編號 1117）

- id: img-hermes-praxiteles
  kind: work
  commons: "File:Hermes and the Infant Dionysus 10 04 2005.jpg"
  title: 抱著嬰兒戴奧尼索斯的荷米斯
  period: ancient
  look: 荷米斯左手抱著嬰兒戴奧尼索斯，舉起的右手（已斷）可能拿著一串葡萄逗弄他。他正把剛出生的弟弟送去給仙女撫養。
  artist: 傳為普拉克西特列斯（也可能是後世的複製品）
  date: 約前 4 世紀（年代有爭議）
  museum: 希臘奧林匹亞考古博物館

- id: img-hermes-giambologna
  kind: work
  commons: "File:Mercurius by Giambologna-Bargello.jpg"
  title: 〈墨丘利〉
  period: modern
  look: 整尊銅像只靠左腳尖踩在一陣「風」上，彷彿就要飛走。有翅膀的帽子、腳上的翅膀與雙蛇杖都很清楚。
  artist: 詹波隆那
  date: 約 1580 年
  museum: 義大利佛羅倫斯巴傑羅美術館

- id: img-hestia-giustiniani
  kind: work
  commons: "File:Hestia Giustiniani.jpg"
  title: 朱斯蒂尼亞尼的赫斯提亞
  period: ancient
  look: 這是極少數被認為是赫斯提亞的雕像：全身包在厚重衣袍裡，頭披面紗，站得筆直，莊重而不帶任何裝飾。
  artist: 佚名（羅馬時期複製品，仿前 5 世紀希臘原作）
  date: 原作約前 470–460 年
