  title: 〈納西瑟斯〉
  period: modern
  look: 少年和他的倒影組成一個圓圈，彷彿兩人手牽著手；畫面其他地方幾乎全黑，整個世界只剩下他和他自己。
  artist: 傳為卡拉瓦喬
  date: 約 1597–1599 年
  museum: 義大利羅馬國立古代藝術美術館（巴貝里尼宮）

- id: img-narcissus-waterhouse
  kind: work
  commons: "File:John William Waterhouse - Echo and Narcissus - Google Art Project.jpg"
  title: 〈厄科與納西瑟斯〉
  period: modern
  look: 納西瑟斯趴在水邊盯著倒影，仙女厄科在樹旁望著他。他從頭到尾沒有看她一眼。
  artist: 約翰．威廉．沃特豪斯
  date: 1903 年
  museum: 英國利物浦沃克美術館

- id: img-icarus-bruegel
  kind: work
  commons: "File:Pieter Bruegel the Elder - Landscape with the Fall of Icarus - Brussels, Royal Museums of Fine Arts of Belgium - Google Arts & Culture.jpg"
  title: 〈伊卡洛斯墜落的風景〉
  period: modern
  look: 先找找伊卡洛斯在哪：右下角大船旁邊的水面上，只露出兩條腿。農夫、牧羊人、漁夫都低頭忙自己的事。
  artist: 老彼得．布勒哲爾（現存這幅可能是後人的摹本）
  date: 約 1560 年代（摹本年代有爭議）
  museum: 比利時布魯塞爾皇家美術館

- id: img-icarus-relief
  kind: work
  commons: "File:Meyers b4 s0409 b1.png"
  title: 代達洛斯與伊卡洛斯浮雕（版畫）
  period: ancient
  look: 坐著的代達洛斯正在調整一副翅膀，伊卡洛斯已經背上翅膀站在一旁。兩人都還不知道接下來會發生什麼。
  artist: 《邁爾百科全書》插圖，依據羅馬阿爾巴尼別墅的古代浮雕
  date: 插圖約 1885 年；原浮雕為羅馬時期
  museum: 原浮雕在義大利羅馬阿爾巴尼別墅

- id: img-icarus-leighton
  kind: work
  commons: "File:Lord Frederick Leighton FLL006.jpg"
  title: 〈代達洛斯與伊卡洛斯〉
  period: modern
  look: 父親代達洛斯正替兒子綁上翅膀，伊卡洛斯卻已經抬頭看向天空，一點都沒在聽。
  artist: 弗雷德里克．雷頓
  date: 1869 年
  museum: 私人收藏

- id: img-arachne-velazquez
  kind: work
  commons: "File:Velazquez-las hilanderas.jpg"
  title: 〈阿拉克涅的寓言（紡紗女）〉
  period: modern
  look: 前景是紡紗工坊裡的女工；往後看，明亮的小房間牆上掛著一幅織毯，前面戴頭盔的就是雅典娜，正對著阿拉克涅舉起手。神話藏在日常勞動的背後。
  artist: 迪亞哥．維拉斯奎茲
  date: 約 1655–1660 年
  museum: 西班牙馬德里普拉多美術館

- id: img-arachne-dore
  kind: work
  commons: "File:Arachne.jpg"
  title: 〈阿拉克涅〉
  period: modern
  look: 上半身還是女人、下半身已經長出蜘蛛腳的阿拉克涅，痛苦地扭著身子。這是多雷替但丁《神曲》畫的插圖。
  artist: 古斯塔夫．多雷
  date: 1861 年版
  museum: 書籍插畫（但丁《神曲》）

- id: img-romulus-wolf
  kind: work
  commons: "File:Lupa Capitolina, Rome.jpg"
  title: 卡比托利歐母狼像
  period: ancient
  look: 母狼警覺地豎起耳朵，下面兩個嬰兒在吸奶。這對雙胞胎是 15 世紀才加上去的，母狼本身究竟是古代還是中世紀作品，學者還在爭論。
  artist: 佚名（母狼年代有爭議；雙胞胎為 15 世紀加上）
  date: 母狼可能為前 5 世紀或中世紀；雙胞胎約 15 世紀末
  museum: 義大利羅馬卡比托利歐博物館

- id: img-romulus-rubens
  kind: work
  commons: "File:Peter Paul Rubens - Romulus and Remus - Google Art Project.jpg"
  title: 〈羅慕路斯與雷穆斯〉
  period: modern
  look: 母狼回頭溫柔地看著吸奶的雙胞胎，左邊的老人是台伯河的河神，右上角的牧羊人剛剛發現他們。
  artist: 彼得．保羅．魯本斯
  date: 約 1615–1616 年
  museum: 義大利羅馬卡比托利歐博物館

- id: img-medusa-rondanini
  kind: work
  commons: "File:Rondanini Medusa Glyptothek Munich 252 n1.jpg"
  title: 隆達尼尼的梅杜莎
  period: ancient
  look: 這張梅杜莎臉孔平靜、甚至美麗，只有頭上的翅膀與蛇洩漏了身分。和早期吐舌獠牙的鬼臉相比，可以看出梅杜莎形象的轉變。
  artist: 佚名（羅馬時期複製品，仿菲迪亞斯的作品）
  date: 原作約前 5 世紀
  museum: 德國慕尼黑古代雕塑館

- id: img-medusa-caravaggio
  kind: work
  commons: "File:Caravaggio - Medusa - Google Art Project.jpg"
  title: 〈梅杜莎〉
  period: modern
  look: 畫在一面真正的圓形盾牌上。梅杜莎剛被砍下頭，嘴還張著尖叫，脖子噴出血。據說這張臉是卡拉瓦喬照著自己的臉畫的。
  artist: 卡拉瓦喬
  date: 約 1597–1598 年
  museum: 義大利佛羅倫斯烏菲茲美術館

- id: img-minotaur-louvre
  kind: work
  commons: "File:Kylix Theseus Minotauros Louvre F83.jpg"
  title: 忒修斯與米諾陶洛斯（黑繪杯）
  period: ancient
  look: 杯子內側：忒修斯一手抓住米諾陶洛斯，一手舉劍刺下。牛頭人身的怪物在圓框裡被畫得像在翻滾掙扎。
  artist: 佚名雅典陶瓶畫家
  date: 約前 450–440 年
  museum: 法國巴黎羅浮宮

- id: img-knossos
  kind: work
  commons: "File:Knossos North entrance bull fresco.jpg"
  title: 克諾索斯宮殿北入口
  period: ancient
  look: 紅色柱子與牆上的公牛壁畫看起來很新，因為這部分是考古學家伊文斯用水泥重建的。照片裡同時有真實的古蹟與 20 世紀的想像。
  artist: 考古遺址（20 世紀初伊文斯部分重建）
  date: 宮殿約前 1700–1450 年；重建約 1900–1930 年
  museum: 希臘克里特島克諾索斯遺址

- id: img-underworld-patinir
  kind: work
  commons: "File:Joachim Patinir 007.jpg"
  title: 〈卡戎渡冥河的風景〉
  period: modern
  look: 擺渡人卡戎划著船載亡魂穿過中間的河。左岸是有天使的樂園，右岸是火光與三頭犬看守的地獄入口：亡魂正面對選擇。
  artist: 約阿希姆．帕蒂尼爾
  date: 約 1520–1524 年
  museum: 西班牙馬德里普拉多美術館

- id: img-troy-walls
  kind: work
  commons: "File:Walls of Troy (2).jpg"
  title: 特洛伊遺址城牆
  period: ancient
  look: 斜斜向上收的石牆屬於特洛伊遺址較晚期的城市，很多學者認為荷馬想像中的特洛伊，最接近的就是這一時期。
  artist: 考古遺址
  date: 這段城牆約前 2 千紀（特洛伊第六層）
  museum: 土耳其希沙利克特洛伊遺址

- id: img-mycenae-gate
  kind: work
  commons: "File:Lion Gate, Mycenae, 201510.jpg"
  title: 邁錫尼獅子門
  period: ancient
  look: 城門上方的三角石板刻著兩頭面對面的獅子。傳說這裡是特洛伊戰爭統帥阿伽門農的城市。
  artist: 佚名邁錫尼工匠
  date: 約前 1250 年
  museum: 希臘邁錫尼遺址

- id: img-apollo-belvedere
  kind: work
  commons: "File:Belvedere Apollo Pio-Clementino Inv1015.jpg"
  title: 觀景殿的阿波羅
  period: ancient
  look: 阿波羅剛射出一箭，目光追著箭的方向。18 世紀的人把它當成「完美人體」的標準。
  artist: 佚名（羅馬時期複製品，仿萊奧卡雷斯的青銅原作）
  date: 公元 2 世紀（原作約前 330 年）
  museum: 梵蒂岡博物館

- id: img-ares-ludovisi
  kind: work
  commons: "File:Ares Ludovisi Altemps Inv8602.jpg"
  title: 盧多維西的阿瑞斯
  period: ancient
  look: 戰神放下武器、抱著膝蓋坐著休息，神情若有所思。腳邊有一個小愛神，暗示他正在想著愛情。
  artist: 佚名（羅馬時期複製品，仿前 4 世紀希臘原作；部分由貝尼尼修復）
  date: 原作約前 320 年
  museum: 義大利羅馬國立博物館阿爾騰普斯宮

- id: img-ares-botticelli
  kind: work
  commons: "File:Venus and Mars National Gallery.jpg"
  title: 〈維納斯與馬爾斯〉
  period: modern
  look: 維納斯清醒地看著熟睡的馬爾斯，小薩堤爾拿走了他的長矛和頭盔，還對著他耳朵吹號角也吵不醒。愛征服了戰爭。
  artist: 桑德羅．波提且利
  date: 約 1485 年
  museum: 英國倫敦國家美術館

- id: img-janus-head
  kind: work
  commons: "File:Janus1.JPG"
  title: 雙面雅努斯頭像
  period: ancient
  look: 兩張留著鬍子的臉背靠背，一張看前、一張看後。
  artist: 佚名羅馬雕刻家
  date: 羅馬時期
  museum: 梵蒂岡博物館

- id: img-hermes-berlin
  kind: work
  commons: "File:Amphora of the Berlin Painter at the Antikensammlung Berlin.jpg"
  title: 柏林畫家雙耳瓶上的荷米斯
  period: ancient
  look: 瓶身上的荷米斯戴著旅行帽、拿著雙蛇杖，正和一個半人半獸的薩堤爾一起走。照片中他的身影較小，可以點開原圖看細節。
  artist: 柏林畫家
  date: 約前 490 年
  museum: 德國柏林古代文物館

- id: img-prometheus-laconian
  kind: work
  commons: "File:Prometheus and Atlas, Laconian black-figure kylix, by the Arkesilas Painter, 560-550 BC, inv. 16592 - Museo Gregoriano Etrusco - Vatican Museums - DSC01069.jpg"
  title: 拉科尼亞杯：阿特拉斯與普羅米修斯
  period: ancient
  look: 一個杯子畫了兩位受罰的泰坦兄弟：左邊的亞特拉斯撐著天，右邊的普羅米修斯被綁在柱子上，一隻鷹正在啄他。
  artist: 阿克西拉斯畫家（斯巴達地區）
  date: 約前 560–550 年
  museum: 梵蒂岡博物館

- id: img-olympus-mytikas
  kind: work
  commons: "File:Mytikas peak 02.jpg"
  title: 奧林帕斯山最高峰米蒂卡斯
  period: modern
  look: 奧林帕斯山最高峰米蒂卡斯，約 2,900 公尺，是希臘最高點。古希臘人相信眾神就住在這些雲霧上面。
  artist: 現代照片
  date: 2019 年
  museum: 希臘奧林帕斯山

- id: img-delphi-temple
  kind: work
  commons: "File:Temple of Apollo Delphi Greece 2009.jpg"
  title: 德爾菲阿波羅神廟遺址
  period: modern
  look: 帕納索斯山腳下的阿波羅神廟只剩幾根柱子。古希臘人相信這裡是世界的中心，女祭司在神廟裡代阿波羅說出預言。
  artist: 考古遺址
  date: 現存遺跡約前 4 世紀
  museum: 希臘德爾菲遺址

- id: img-pandora-krater
  kind: work
  commons: "File:Niobid Painter ARV 601 23 creation of Pandora - chorus of women - Pans - satyrs and maenad (03).jpg"
  title: 眾神裝扮潘朵拉（尼俄柏畫家）
  period: ancient
  look: 上排是眾神圍著剛被造出來的潘朵拉：雅典娜拿著花冠要替她戴上，宙斯坐在一旁看著。古希臘人畫的潘朵拉沒有盒子。
  artist: 尼俄柏畫家
  date: 約前 460–450 年
  museum: 英國倫敦大英博物館

- id: img-persephone-hydria
  kind: work
  commons: "File:Chicago Painter - ARV 630 31 - Triptolemos with Persephone and Demeter - München AS 2432 - 09.jpg"
  title: 狄蜜特、波瑟芬妮與特里普托勒摩斯
  period: ancient
  look: 坐在有翅膀馬車上的少年特里普托勒摩斯，手捧麥穗，波瑟芬妮與狄蜜特一左一右送他出發去傳播農業。
  artist: 芝加哥畫家
  date: 約前 450–440 年
  museum: 德國慕尼黑國立古代藝術博物館

- id: img-tellus-mosaic
  kind: work
  commons: "File:Aion mosaic Glyptothek Munich W504.jpg"
  title: 森提努姆馬賽克：永恆之神與大地女神
  period: ancient
  look: 站在星座圓環裡的是永恆之神艾翁；右下坐著的女神是大地（羅馬稱特盧斯，即蓋亞），身邊圍著四個可能代表四季的孩子。
  artist: 佚名羅馬馬賽克工匠
  date: 約公元 200–250 年
  museum: 德國慕尼黑古代雕塑館

- id: img-rhea-pelike
  kind: work
  commons: "File:Rhea handing a swaddled stone to Cronus, Attic terracotta pelike, c. 460–450 BC, Met 06.1021.144.jpg (cropped).jpg"
  title: 瑞亞把包著襁褓的石頭交給克羅諾斯（雅典陶瓶）
  period: ancient
  artist: 瑙西卡畫家（雅典陶瓶畫家）
  date: 約前 460–450 年
  museum: 美國紐約大都會藝術博物館
  look: 瑞亞（左）雙手捧著一個包在襁褓裡的「嬰兒」，遞給拄著權杖的克羅諾斯；他伸手要接。古希臘觀眾都知道布裡包的是石頭，這一刻決定了宙斯能不能活下來。
