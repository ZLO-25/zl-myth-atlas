# 中華與希臘羅馬對照：只比較「想法」，不主張任何一方影響了另一方。每一列的細節請看連到的卡片。
# 北歐卡片已經寫了相關內容的題目（世界怎麼開始、大洪水、龍）放在 three-way.yaml，這裡不重複；
# 留在這裡的題目，本站的北歐卡片沒有對應內容，所以只比兩邊。
- theme: 誰撐著天
  chinese: {text: 共工撞斷撐天的柱子、天破了洞，女媧煉五色石把它補好。, cards: [story-buzhou, story-nuwa-mends-sky]}
  western: {text: 泰坦阿特拉斯在世界盡頭用肩膀撐著天。, cards: [titan-atlas]}
  diff: 中國的故事是「天壞了，要修」；希臘的故事是「天很重，要有人一直扛著」。
- theme: 從天上拿東西給人類
  chinese: {text: 鯀偷了天帝的息壤去擋洪水，被天帝處死。, cards: [hero-gun]}
  western: {text: 普羅米修斯偷火給人類，被罰每天被老鷹啄肝。, cards: [titan-prometheus]}
  diff: 兩個人都因為偷神的東西幫人而被重罰；不同的是，鯀的失敗後來由兒子大禹接手完成。
- theme: 鳳凰與 phoenix
  chinese: {text: 鳳凰是天下太平才出現的祥鳥，不會浴火重生。, cards: [beast-fenghuang]}
  western: {text: 西方的 phoenix 是會在火中重生的不死鳥。, cards: []}
  diff: 英文常把鳳凰翻成 phoenix，但兩者的意義不同，只是外形都是漂亮的大鳥。
- theme: 火是怎麼來到人間的
  chinese: {text: 《韓非子》說，上古的人吃生食、常生病，有聖人「鑽燧取火」把食物煮熟，百姓很高興，推他當王，稱為燧人氏。, cards: [hero-suiren]}
  western: {text: 宙斯把火收走，普羅米修斯把天上的火種藏在空心的巨茴香莖裡，偷偷帶回人間，結果被鎖在山上，每天被老鷹啄肝。, cards: [titan-prometheus]}
  diff: 燧人氏是自己鑽木取火教大家，沒有神被懲罰；普羅米修斯的火是從神那裡偷來的，要付出代價。一個講聖人幫助百姓，一個講人和神的衝突。
- theme: 神仙住的山
  chinese: {text: 崑崙山是天帝在人間的都城，百神聚集；渤海上的蓬萊三神山有仙人和不死之藥，遠看像雲，走近了山反而沉到水下，船一靠近風就把船引走。, cards: [place-kunlun, place-penglai]}
  western: {text: 奧林帕斯山是希臘最高的山，宙斯和眾神住在雲霧繚繞的山頂，荷馬說那裡不刮風、不下雨、永遠晴朗。, cards: [place-olympus]}
  diff: 奧林帕斯是一座今天找得到的真山；中華的神山有兩種：崑崙後來真被漢代人安到一條山脈上，蓬萊則是看得到、到不了的海上仙山，連秦始皇派人去找也沒找到。
- theme: 月亮裡有什麼
  chinese: {text: 月亮裡有兔子（《天問》）、蟾蜍（《淮南子》），後來加上搗藥的兔子，唐代《酉陽雜俎》又多了砍桂樹的吳剛；這些角色是一個朝代一個朝代加上去的。, cards: [story-moon-palace]}
  western: {text: 月神是塞勒涅，赫利俄斯的姊妹，她愛上沉睡的恩底彌翁；太陽神赫利俄斯駕四匹馬的車橫過天空。, cards: [god-helios]}
  diff: 希臘把月亮想成一位女神，講的是她的愛情；中華則看著月亮表面的陰影，想像裡面住著動物和人，故事是靠古書一層層加出來的。
- theme: 相愛卻不能在一起
  chinese: {text: 祝英台女扮男裝讀書，和梁山伯相愛；本站查得到最早完整文字（明代《喻世明言》）寫英台跳進裂開的墳墓，衣服碎片化成兩種花蝴蝶。, cards: [story-liangzhu]}
  western: {text: 皮拉穆斯與提斯柏隔著牆縫低語，約在城外桑樹下私奔；皮拉穆斯看到染血的面紗，以為她死了而自殺，她回來看到後也自殺，桑椹從白色變成深紅。, cards: [story-pyramus-thisbe]}
  diff: 兩個故事都是相愛的兩人最後雙雙死去，死後留下了變化：中華變成蝴蝶，希臘變成染紅的桑椹。
