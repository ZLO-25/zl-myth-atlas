  tudi: "Tudi Gong: kindly old man with a white beard in a Ming-style official's hat and a simple brown robe, standing by a small roadside shrine."
  zao: "Zaoshen: a kindly bearded old man in a Song-style robe near a stove in a kitchen, plain and homely, a small paper horse beside the stove."
