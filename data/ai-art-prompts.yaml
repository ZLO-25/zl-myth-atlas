  - {id: img-ai-cowherd-weaver-1, card: story-cowherd-weaver, system: chinese, title: 天上的兩顆星, characters: [weaver], scene: "The Weaver Girl weaving brilliant cloud-colored silk in the sky palace on one bank of the Milky Way, a bright star beside her."}
  - {id: img-ai-cowherd-weaver-2, card: story-cowherd-weaver, system: chinese, title: 牛郎與牛, characters: [cowherd], scene: "The Cowherd with his ox in a green valley under a sky showing the Milky Way."}
  - {id: img-ai-cowherd-weaver-3, card: story-cowherd-weaver, system: chinese, title: 相遇與成家, characters: [cowherd, weaver], scene: "The Cowherd and Weaver Girl meeting by a river at dusk, smiling shyly."}
  - {id: img-ai-cowherd-weaver-4, card: story-cowherd-weaver, system: chinese, title: 被銀河分開, characters: [weaver], scene: "The Weaver Girl is lifted away by two celestial attendants toward the Milky Way; the Cowherd, in his plain blue-grey tunic with no armor and no hat, a simple cloth headband only, reaches after her with both hands, his ox beside him."}
  - {id: img-ai-cowherd-weaver-5, card: story-cowherd-weaver, system: chinese, title: 七夕鵲橋, characters: [cowherd, weaver, magpies], scene: "A bridge made of hundreds of black-and-white magpies, wings spread and linked together, stretches in a straight line across the Milky Way from one bank to the other; the Cowherd (plain blue-grey tunic) stands on the bridge from the left and the Weaver Girl stands on the bridge from the right, and they meet in the middle holding hands."}
