  apollo: "Apollo: beardless athletic young man with wavy hair, laurel wreath, light short chiton, holding a seven-string lyre; a silver bow and quiver slung on his back."
  ares: "Ares: powerful warrior in full bronze armor and a crested helmet, spear and round shield, grim expression, a vulture nearby."
