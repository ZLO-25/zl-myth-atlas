  hebo: "Hebo: a man in a long robe riding a water chariot drawn by two dragons, a lotus-leaf canopy; scales on the roof of his palace."
  luoshen: "Luoshen: graceful woman in Han-style silk robe walking lightly on the water, high cloud-shaped hair-knot, jade and pearl jewellery, like a startled swan."
  xiang: "The Xiang ladies: two women in long Han-style robes standing by autumn water with mottled bamboo behind them, hair in high buns, calm and sorrowful."
