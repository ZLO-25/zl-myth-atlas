  eros: "Eros: a winged boy with golden wings, bow and quiver of arrows, sometimes a torch; playful face."
  fates: "The three Fates: three women of different ages in plain robes; one holds a spindle with thread, one a staff pointing at a globe, one a scroll and a pair of shears."
  furies: "The Furies: three stern winged women in black mourning robes with snakes wound in their hair and arms, holding whips and torches; grave and frightening but not gory."
  hecate: "Hecate: woman in a knee-length tunic and hunting boots holding two lit torches, a hound at her feet, a ring of keys at her belt."
