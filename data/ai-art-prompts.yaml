  - {id: img-ai-portrait-xihe, card: god-xihe, system: chinese, title: 羲和, characters: [xihe], scene: "At the Sweet Spring at the eastern edge of the world, Xihe gently bathes a glowing round sun in clear water with her hands, steam rising around her; a calm dawn, mulberry branches overhead. Exactly one sun in the image."}
  - {id: img-ai-portrait-zhurong, card: god-zhurong, system: chinese, title: 祝融, characters: [zhurong], scene: "Zhurong stands upon two dragons above a southern mountain range, red flames rising around him, banners and clouds, his gaze steady and powerful."}
  - {id: img-ai-portrait-chiyou, card: god-chiyou, system: chinese, title: 蚩尤, characters: [chiyou], scene: "Chiyou stands on a windswept battlefield in horned helmet and dark armor, holding a bronze halberd and a bronze axe, with swirling wind and rain clouds behind him; fierce but dignified, a war god rather than a monster."}
  - {id: img-ai-portrait-huangdi, card: god-huangdi, system: chinese, title: 黃帝, characters: [huangdi], scene: "Huangdi seated on a simple earthen throne in the central plain, wearing a yellow-ochre robe and a flat-topped crown with beaded tassels hanging front and back, long beard, calm authority; yellow earth and a river valley behind him."}
  - {id: img-ai-portrait-shennong, card: god-shennong, system: chinese, title: 神農, characters: [shennong], scene: "Shennong sits on a mountain slope tasting a herb, bundles of plants and a bamboo basket around him, a field of young crops below; a plain wooden plough leaning beside him."}
  - {id: img-ai-portrait-xiwangmu, card: god-xiwangmu, system: chinese, title: 西王母, characters: [xiwangmu], scene: "Xiwangmu sits on a throne of carved stone on Kunlun Mountain among clouds, wearing a sheng headdress (a horizontal bar with ends like small scrolls), one hand holding a small jade vessel; a white rabbit pounds medicine beside her. No other creatures."}
  - {id: img-ai-portrait-pangu, card: primordial-pangu, system: chinese, title: 盤古, characters: [pangu], scene: "Inside a vast dark cosmic egg splitting open: light, clear air rises above to become sky and heavy murk sinks below to become earth, while Pangu stands between them with arms raised, holding them apart."}
  - {id: img-ai-portrait-fuxi, card: primordial-fuxi, system: chinese, title: 伏羲, characters: [fuxi], scene: "Fuxi on a riverbank at dawn, serpent body coiled on the ground, looking at the stars and at patterns in the river sand, tracing eight simple three-line symbols (the eight trigrams: each made of three horizontal lines, solid or broken) in the earth with his finger; no readable text or letters."}
  # 中華卡片補圖（2026-11-17）
  - {id: img-ai-portrait-change, card: hero-change, system: chinese, title: 嫦娥, characters: [change], scene: "Match the earlier images of her: a young woman with black hair in a high bun held by a jade-green hairpin, a pale ivory Han-style robe with long flowing sleeves over a stone-blue skirt with thin cinnabar-red trim. Chang'e stands alone on a pale stone terrace of the palace on the moon, the ground silvery and quiet, seen from the knees up; she looks down with a wistful face toward the small, distant, blue-green Earth hanging in the black sky. One small white rabbit sits at her feet. Cold silver light, a few stars. No other people, no sun."}
  - {id: img-ai-portrait-houyi, card: hero-houyi, system: chinese, title: 后羿, characters: [houyi], scene: "Match the earlier images of him: a man of about thirty, black hair in a topknot, clean-shaven, dark lamellar leather armour over a cinnabar-red and stone-blue tunic, a quiver of arrows at his hip, a long red recurved bow. Hou Yi stands on a scorched rocky ridge just after his great deed, seen from the knees up in three-quarter view, the long red bow held upright in his left hand and one arrow resting loosely in his right, looking calmly toward the horizon. Cracked dry earth behind him is beginning to turn green. EXACTLY ONE sun in the image, low on the horizon; no other sun or glowing disc anywhere."}
  - {id: img-ai-portrait-yu, card: hero-yu, system: chinese, title: 大禹, characters: [yu], scene: "Match the earlier images of him: a lean, sun-tanned man of about forty with a short rough beard, ragged undyed hemp tunic tied with a rope belt, bare muddy shins and straw sandals, a long wooden digging spade, a conical straw hat hanging on his back. Yu the Great stands on a muddy earthen bank, seen from the knees up, both calloused hands resting on his wooden spade, tired but steady, looking out over the land. Behind him a newly dug channel carries brown floodwater away between hills toward a distant sea, and the sky is clearing after rain. A few tiny workers far in the background."}
  - {id: img-ai-portrait-gun, card: hero-gun, system: chinese, title: 鯀, characters: [gun], scene: "Match the earlier image of him: a man of about sixty, grey-streaked hair in a topknot, grey beard, worn layered robes of faded blue-grey and brown, mud on his sleeves, holding a cloth pouch of softly glowing golden earth in both hands. Gun stands in driving rain on top of a half-built earthen dike, seen from the knees up, shielding the pouch of softly glowing golden earth against his chest and looking back over his shoulder at the dark sky as if afraid of being seen. Grey floodwater presses against the dike on one side; drowned fields and rooftops lie on the other. He is the only figure."}
  - {id: img-ai-portrait-jingwei, card: hero-jingwei, system: chinese, title: 精衛, characters: [jingwei], scene: "The small bird Jingwei flies low over a vast, rough, grey-blue eastern sea, wings spread, carrying one small pebble in its white beak, about to drop it into the waves; its red feet are tucked beneath it. The bird is in sharp focus in the foreground, tiny against the endless water. Far behind, a wild wooded mountain rises on the western shore: only trees and rock on it, completely uninhabited. NO buildings, no palace, no temple, no pavilion, no roofs, no walls anywhere in the image. Exactly one bird; no people, no ships."}
  - {id: img-ai-portrait-xingtian, card: hero-xingtian, system: chinese, title: 刑天, characters: [xingtian], scene: "Xingtian stands defiantly on a barren mountain slope under a stormy sky, a rectangular lacquered wooden shield raised in his left hand and a long-handled bronze battle-axe swung high in his right, as if still fighting an enemy in the sky. The eyes on his chest glare upward. Wind whips dust around him. No blood, no wound, no severed head shown anywhere; frightening but dignified, like a figure from a Han tomb relief."}
  - {id: img-ai-portrait-kuafu, card: hero-kuafu, system: chinese, title: 夸父, characters: [kuafu], scene: "Kuafu runs in a huge stride across a wide dry riverbed of cracked yellow mud, chasing the setting sun, one arm stretched toward it, his mouth open with thirst, his long staff in the other hand. Small trees and hills at his feet show how enormous he is. The land is dry and golden in the evening light. EXACTLY ONE sun, large and low on the western horizon; no other sun. He is a human-shaped giant, not a monster."}
  - {id: img-ai-portrait-dragon, card: beast-dragon, system: chinese, title: 龍, characters: [dragon], scene: "One Chinese dragon coils through dark rain clouds above a wide river plain, its whole long body visible in an S-curve, head turned toward the viewer with a calm, noble expression. Rain falls from the clouds around it onto green fields and a winding river far below. No wings, no fire, no flames, no smoke from its mouth; not a Western dragon, not a dinosaur-like or bat-winged creature. Exactly one dragon; no people."}
  - {id: img-ai-portrait-cangjie, card: hero-cangjie, system: chinese, title: 倉頡, characters: [cangjie], scene: "Cangjie kneels on a reed mat in an open courtyard at dusk, seen from the knees up, holding a small bronze knife above a set of flat wooden tablets on which he has just scratched a few simple picture-like marks (tiny sketches of a bird track, a mountain, a fish; NOT readable characters or writing). He looks up in amazement as grains of golden millet fall from the sky like rain around him. In the dark background, faint pale ghostly shapes drift away among the trees. No readable text anywhere."}
  - {id: img-ai-portrait-fenghuang, card: beast-fenghuang, system: chinese, title: 鳳凰, characters: [fenghuang], scene: "One fenghuang alights with wings half spread on a rocky outcrop of a sunlit mountain, its long tail feathers trailing in the air, as if dancing. Below it lies a peaceful valley with tilled fields and small thatched houses under a clear morning sky; in the far distance a few tiny musicians in Han-style robes play panpipes. The bird is calm and gentle. NO fire, no flames, no burning feathers, no ashes: it is not the Western phoenix. Exactly one bird."}
  - {id: img-ai-portrait-ninetail-fox, card: beast-ninetail-fox, system: chinese, title: 九尾狐, characters: [ninetail_fox], scene: "The nine-tailed fox sits upright on a mossy rock on the green wooded slope of Mount Qingqiu in morning mist, seen from the front and slightly to one side, head turned toward the viewer, mouth slightly open as if calling. Behind it, its nine tails stand up and spread out in ONE flat, even fan like an open hand-fan or a peacock's display: one tail straight up in the middle, four tails to the left of it and four tails to the right of it, with a clear gap of pale mist between every two tails so that none overlap or hide behind another. Count the white tail tips: there are exactly NINE white tips, no more and no fewer (not seven, not eight). It is a wild, slightly dangerous animal, not cute. It is NOT a woman and not part human; no glowing magic flames, no fireballs. No buildings, no temples, no pavilions, no shrine or torii gate anywhere. Exactly one fox."}
  - {id: img-ai-portrait-four-symbols, card: beast-four-symbols, system: chinese, title: 四象, characters: [four_symbols], scene: "The whole picture is a deep dark-blue night sky full of small stars, nothing else: no ground, no room, no wall, no gate, no altar, no furniture. The four creatures float among thin clouds in a cross-shaped (plus-sign) layout, one in the middle of each edge of the picture, all facing the centre: the Vermilion Bird in the TOP-MIDDLE; the Black Tortoise with its snake in the BOTTOM-MIDDLE; the Azure Dragon in the LEFT-MIDDLE; the White Tiger in the RIGHT-MIDDLE. The four corners of the picture are empty sky. The exact centre of the picture is EMPTY except for a soft ring of stars: there is NO human figure, NO person, NO priest, NO emperor anywhere in the image. All four creatures are about the same size. EXACTLY four creatures (the tortoise and its snake count as one); no compass letters, no labels, no decorative border."}
  - {id: img-ai-portrait-kunlun, card: place-kunlun, system: chinese, title: 崑崙山, characters: [kunlun, xiwangmu], scene: "A grand wide view of Mount Kunlun, the capital of the High God on earth: tier upon tier of cliffs climbing above the clouds, with Han-dynasty style gate towers (paired que towers with straight tiled roofs) and jade-coloured halls on its terraces, soft golden light at the summit. On a rock ledge in the middle distance, very small, Xiwangmu sits on her carved stone throne in her jade-green robe. Snowy ranges and desert haze lie far below. NO pagodas, no Buddhist temples or statues, no Tibetan buildings, no Ming or Qing palace roofs. No text."}
