  houji: "Houji: sturdy farmer-lord in plain hemp clothes, holding millet stalks, with a basket of beans and hemp, a child grown into a farm official."
  zhulong: "Zhulong: a giant red serpent-bodied god with a human face and straight vertical eyes, body a thousand miles long; a faint torch-like glow in his mouth."
  xiangliu: "Xiangliu: a nine-headed serpent-bodied creature, dark green scales, the ground around him barren and discoloured."
  qilin: "Qilin: a creature with a deer-like body, an ox's tail, ONE horn, a dragon-like head and scales on the body, split hooves; calm, auspicious, no fire, no wings."
