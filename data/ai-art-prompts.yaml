# AI 插畫提示詞（畫風 C：現代平塗插畫）。規範見 docs/art-style.md
# 生圖後存成 public/images/ai/<card>/<id>.webp，網站會自動換掉佔位圖。
# tool：ZL 實際使用的生圖工具，生好後請改成工具名稱。
tool: 待定（由 ZL 生圖）
style: >-
  Realistic cinematic digital painting, semi-realistic historical illustration with natural lighting,
  believable anatomy and detailed textures of stone, cloth, bronze and skin. Warm Mediterranean palette:
  terracotta, Aegean blue, olive green, marble white, gold accents. Clothing, armor and architecture of the
  ancient Greek world (or early Italy for Roman scenes). Landscape 4:3, 1600x1200. No text, no letters,
  no watermark, no signature. Not a photograph, not a vase painting, not anime or cartoon.
  Violence only implied, no blood or gore; no explicit nudity; tasteful for adult general audiences.
characters:
  zeus: "Zeus: powerful middle-aged man, thick curly grey-black hair and full beard, Aegean-blue cloak over one shoulder, holding a golden zigzag thunderbolt."
  hera: "Hera: regal woman, dark hair under a tall gold crown, long marble-white robe with blue border."
  athena: "Athena: tall young woman, tall-crested bronze helmet pushed up, spear, aegis cape with a small Medusa face on the chest, a small owl nearby."
  hermes: "Hermes: slim beardless young man, wide-brimmed traveller's hat with small wings, winged sandals, short tunic, staff with two snakes."
  aphrodite: "Aphrodite: young woman with long golden hair, light marble-white robe, a white dove nearby."
  hephaestus: "Hephaestus: bearded stocky craftsman, conical felt cap, short work tunic off one shoulder, hammer, walks with a stick."
  hades: "Hades: bearded stern man resembling Zeus but darker, deep blue-black robe, sceptre."
  demeter: "Demeter: mature woman, wreath of wheat ears, olive-green robe, carrying a torch when searching."
  persephone: "Persephone: young woman, long dark hair, light robe with flower pattern; as queen, a small gold crown."
  prometheus: "Prometheus: lean bearded titan, earth-colored tunic, carrying a fennel stalk with a small flame."
  epimetheus: "Epimetheus: younger brother of Prometheus, beardless, open friendly face, simple tunic."
  pandora: "Pandora: young woman, elaborate gold crown and fine robe given by the gods, beside a large knee-high clay storage jar (pithos), not a box."
  eris: "Eris: gaunt woman in dark ragged robe, sly expression, holding a golden apple."
  paris: "Paris: handsome beardless young Trojan prince, Phrygian cap, shepherd's staff."
  helen: "Helen: beautiful young queen, veil, marble-white robe with gold trim."
  agamemnon: "Agamemnon: proud bearded king, bronze armor, red cloak, gold crown."
  iphigenia: "Iphigenia: teenage girl in white bridal robe and veil."
  achilles: "Achilles: young beardless warrior, long blond hair, bronze armor with round shield."
  hector: "Hector: bearded Trojan prince, crested helmet, bronze armor."
  odysseus: "Odysseus: weathered bearded man, small conical sailor's cap, short tunic, clever eyes."
  laocoon: "Laocoon: grey-bearded Trojan priest in robes, with two young sons."
  sinon: "Sinon: young Greek man in torn clothes, hands bound, pleading."
  polyphemus: "Polyphemus: huge one-eyed giant shepherd, shaggy hair, single eye in the middle of his forehead."
  circe: "Circe: elegant sorceress, long dark-red hair, gold cup and wand."
  penelope: "Penelope: dignified woman, veil, working at a large upright loom."
  oedipus: "Oedipus: young traveller with a staff and short cloak; later a king with a gold circlet."
  laius: "Laius: older king in a chariot, grey beard."
  sphinx: "Sphinx: winged lion with the head of a woman, sitting on a rock."
  jocasta: "Jocasta: mature queen, veil, gold diadem."
  tiresias: "Tiresias: old blind prophet, white beard, staff."
  narcissus: "Narcissus: beautiful youth of about sixteen, dark curly hair, hunter's tunic and spear."
  echo: "Echo: shy young nymph, long light-brown hair, pale olive-green robe."
  daedalus: "Daedalus: grey-bearded inventor, leather apron, tools."
  icarus: "Icarus: slim teenage boy, short curly hair, wings of feathers and wax strapped to his arms."
  arachne: "Arachne: young Lydian weaver, simple brown dress, hair tied up, working at an upright loom."
  rhea_silvia: "Rhea Silvia: young Vestal priestess, white veil and robe."
  romulus_remus: "Romulus and Remus: twin boys (babies or young men depending on the scene), identical dark hair."
  she_wolf: "She-wolf: large grey-brown wolf with a gentle expression."
  faustulus: "Faustulus: rough bearded shepherd with a crook."
