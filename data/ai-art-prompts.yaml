  apollo: "Apollo: beardless athletic young man with wavy hair, laurel wreath, light short chiton, holding a seven-string lyre; a silver bow and quiver slung on his back."
  asclepius: "Asclepius: kindly bearded mature man in a simple robe, holding a wooden staff with exactly ONE snake coiled round it (no wings), a small dog and medicinal herbs nearby."
  dionysus: "Dionysus: young man with long curly hair, crown of grape vine and ivy, holding a wine cup and a thyrsus (a staff topped with a pine cone), a leopard beside him."
  eros: "Eros: a winged boy with golden wings, bow and quiver of arrows, sometimes a torch; playful face."
  fates: "The three Fates: three women of different ages in plain robes; one holds a spindle with thread, one a staff pointing at a globe, one a scroll and a pair of shears."
  furies: "The Furies: three stern winged women in black mourning robes with snakes wound in their hair and arms, holding whips and torches; grave and frightening but not gory."
  hecate: "Hecate: woman in a knee-length tunic and hunting boots holding two lit torches, a hound at her feet, a ring of keys at her belt."
  helios: "Helios: handsome beardless man in a purple robe with a crown of rays, driving a chariot with four horses; Selene rides a two-horse chariot with a crescent above her head; Eos is a winged goddess with rose-pink light."
  muses: "The Nine Muses: nine young women in flowing robes, each with a different object: lyre, double flute, tragic and comic masks, scroll, a staff pointing at a globe."
  pan: "Pan: man with goat's horns, ears and legs, thick beard and flat nose, playing a reed pan-pipe; a lynx skin on his shoulder, pine trees behind."
  antigone: "Antigone: young woman in a plain dark Greek robe with a head-covering, determined face, carrying a small jar of earth."
  atalanta: "Atalanta: lean young huntress with short tunic, hair tied back, bow and a boar-spear, a swift runner."
  bellerophon: "Bellerophon: handsome young hero with a golden bridle in hand, riding or standing beside the white winged horse Pegasus."
  cadmus: "Cadmus: young Phoenician prince in a travelling cloak with a spear, beside a great serpent."
  dioscuri: "Castor and Pollux: two young horsemen in wide-brimmed travelling hats, short cloaks and spears, two white horses; small flames glow on their heads."
  heracles: "Heracles: muscular bearded hero wearing a lion skin with the lion's head as a hood, carrying a wooden club and a bow."
  medea: "Medea: dark-haired sorceress in rich robes with a small flask of potion, intense calm gaze."
  centaur: "Centaur: a creature with a man's upper body and a horse's body and four legs, wild hair, holding a tree branch; Chiron wears a long robe and boots, with a human body and a small horse rump attached."
  cerberus: "Cerberus: huge dog with three heads, a snake for a tail, snake heads along its back, lion's claws."
  sirens: "Sirens: bird bodies with a woman's head and chest, singing on rocks by the sea; one plays a harp, one a flute."
  typhon: "Typhon: gigantic winged being with a human upper body, a hundred snake heads rising from his arms, legs as great coils of serpent, eyes glowing."
  nyx: "Nyx: winged goddess in a dark veil wrapped in night mist, driving a dark chariot; in her arms two sleeping boys, one pale, one dark."
  aegir: "Aegir: tall sea-giant host with a long white-grey beard, a deep sea-green wool cloak, gold glinting in his hall."
  ran: "Ran: sea goddess in a dark blue-green dress, holding a large fishing net in both hands, hair like sea foam."
  bragi: "Bragi: long-bearded man in a fine wool tunic, telling stories at a feast table, a harp near him."
  freyr: "Freyr: young handsome man in a rich green wool tunic, a sword at his belt, a golden-bristled boar beside him."
  hel: "Hel: a stern, fierce woman whose body is half dark blue-black and half ordinary skin tone, long plain grey dress, hard face."
  idun: "Idun: young woman with a gentle face holding an ash-wood box of apples, long light-brown hair, plain linen dress."
  mimir: "Mimir: only a wise severed head preserved with herbs, eyes open, resting beside a spring, no body."
  njord: "Njord: weathered man in his prime with a short grey-brown beard, wool tunic and sea boots, standing by the shore."
  norns: "The Norns: three women in plain wool dresses at the foot of a great ash tree, drawing water from a spring and pouring it on the roots."
  sif: "Sif: woman with long golden hair falling to her waist, Viking-age wool dress with brooches."
  skadi: "Skadi: tall woman in winter hunting clothes, fur-trimmed wool cloak and snowshoes, a bow on her back, a giant's daughter in full armour (a plain Viking-age mail shirt and round shield, no horned helmet)."
  valkyries: "Valkyries: women on horseback in plain wool cloaks and long dresses, carrying drinking horns, riding toward a battlefield or serving at a long hall."
  vidar: "Vidar: silent broad-shouldered man in a plain tunic and a pair of unusually thick-soled leather shoes."
  sleipnir: "Sleipnir: a grey horse with EIGHT legs, strong, realistic horse anatomy."
  jotnar: "A giant (jotunn): huge man towering over a house, rough fur clothing, frost in his beard; no unified look."
  hundun: "Hundun (Emperor Jiang, per the Classic of Mountains and Seas): a faceless sack-shaped being, yellow like a bag and red like cinnabar fire, with six legs and four wings, no eyes, nose or mouth."
  leigong: "Lei Gong (as Han painters drew him, per Wang Chong): a strongman with the build of a warrior, the left hand pulling a ring of linked drums, the right hand pushing a mallet as if striking them; Han-style short robe."
  fengbo: "Wind Earl Feilian (per Ying Shao): a creature with a deer's body, a bird's head, antlers, a snake's tail, about as big as a leopard."
  hebo: "Hebo (per the Nine Songs): a river lord in a long robe riding a water chariot under a lotus-leaf canopy, drawn by two dragons (wingless)."
  luoshen: "Luoshen (per Cao Zhi's Ode to the Goddess of the Luo): graceful woman, her form light as a startled swan and supple as a swimming dragon, high cloud-like coiled hair, long fine eyebrows, silk gauze robe, gold and kingfisher-blue ornaments and bright pearls, stepping lightly over the water so that dust rises from her silk stockings."
  xiangfu: "Lady of the Xiang (per the Nine Songs 'Lady of the Xiang'): a noble woman in Han-style robes with her face turned away or small and distant (the sources do not describe her face), standing on the north bank in autumn wind."
  taiyi: "Eastern Emperor Taiyi (per the Nine Songs): a majestic god in Han-style court robes, one hand on a long sword whose hilt has jade ear-pieces, jade pendants at his waist."
  houtu: "Houtu (per the Huainanzi): a dignified divine official in a plain earth-yellow Han-style robe, holding a long measuring rope in both hands, assisting the Yellow Emperor at the centre; no face detail needed beyond calm."
  houji: "Houji as a child: a small boy in hemp clothes planting bean and hemp seeds in a furrow, serious and delighted."
  zhulong: "Zhulong (per the Classic of Mountains and Seas): a god with a human face and a long red serpent body, eyes set straight (vertical) in his face, body thousands of miles long."
  xiangliu: "Xiangliu: a serpent body coiled into a ring, nine heads each eating from a different mountain; the heads are those of snakes (nine heads)."
  qilin: "Qilin (per the Shuowen): a deer-like (elk) body, an ox's tail and exactly ONE horn; calm; no wings, no fire."
  yandi: "Yandi (per the Diwang Shiji): a god with a man's body and the head of an ox, raised by the Jiang River, in a plain red-ochre Han-style robe."
  suiren: "Suiren: ancient man in rough hemp and hide clothing, kneeling and drilling a wooden stick into a block of wood to make fire."
  jade: "Jade Emperor (per Britannica): an emperor seated on a throne in a dragon-embroidered Song-Ming imperial robe, a crown with hanging strings of beads, holding a jade tablet (a jade gui)."
  sanqing: "The Three Pure Ones (per Journey to the West ch.44, as statues in a Taoist temple): three seated statues, the middle one Yuanshi Tianzun, the left Lingbao Daojun, the right Taishang Laojun; Taoist robes."
  eight: "The Eight Immortals (per Journey to the East ch.48): each throws one object into the sea and crosses on it: an iron crutch (Li Tieguai), a horsetail whisk (Zhongli), a paper donkey (Zhang Guolao), a bamboo flute (Lu Dongbin), a flower basket (Han Xiangzi), a bamboo cover (He Xiangu), castanets (Lan Caihe), a jade tablet (Cao Guojiu); Ming-style robes."
  guandi: "Guan Yu (per the Three Kingdoms): a tall man with a beautiful long flowing beard and a ruddy face 'like a ripe jujube', wielding the Green Dragon Crescent Blade, with the red horse Red Hare; Han-era general's armour and green robe; dignified."
  guanyin: "Guanyin (per Journey to the West ch.8): a serene woman with hair coiled high like a dark cloud, a plain pale silk robe, holding a pure-water vase in which a willow branch is inserted, dignified and fully covered; at the Luojia mountain in the Southern Sea."
  menshen: "Door gods (per the Sanjiao Soushen Daquan): two fully armoured warriors with angry flaring hair, holding a jade axe, a chain-whip at the belt and a bow at the side; painted on door boards (no text)."
  chenghuang: "The City God's attendants (per Britannica): one tall attendant in black and one short attendant in white; the City God in an official's robe."
  caishen: "Caishen, Marshal Zhao (per the Sanjiao Soushen Daquan): a dark-faced man with a beard, an iron crown and a iron whip in hand, riding a tiger."
  xuanwu: "Xuanwu (per the Soushen Daquan): a god with loose unbound hair, barefoot, wearing golden armour under a black robe, a black banner behind him, with a tortoise and a snake under his feet."
  fulushou: "Fu, Lu and Shou (per Journey to the West ch.26): three old men; two sit at a game of Go (weiqi) at a stone table, the third stands watching the game."
  yanluo: "Yanluo and the Ten Kings (per Journey to the West ch.11): ten kings in imperial court robes with jade pendants that chime, descending the steps of a great hall; a judge beside them holding a register of life and death against his chest."
  zhongkui: "Zhongkui (per Tang tradition): a fierce bearded man in a battered hat, a blue robe, a horn belt and court boots."
  yuelao: "Yue Lao (per 'The Inn of Fixed Marriages'): an old man sitting on stone steps in moonlight, leaning against a cloth bag, reading a book turned to the moon; red cords showing in the bag; Tang-style robe."
  nezha: "Nezha (per Investiture of the Gods): a child-looking boy with a golden bracelet (Universe Ring) on his right arm and a red silk sash (Heaven Sash) wrapped round his waist, standing on two wheels of wind and fire and carrying a fire-tipped spear."
  erlang: "Erlang Shen (per Journey to the West ch.6): a warrior with a 'three-mountain winged-phoenix cap', a crescent-shaped slingshot at his hip, a three-pointed two-edged spear in his hand, a slim hound beside him, a white horse; an ordinary human face with two eyes."
  wukong: "Sun Wukong (per Journey to the West): a monkey born from stone, quick and bright-eyed, holding a long staff banded with gold at both ends, standing on a cloud."
  jiangziya: "Jiang Ziya (per the Investiture of the Gods): an old white-haired man in a plain robe seated at the Wei River, holding a fishing line whose hook is straight."
