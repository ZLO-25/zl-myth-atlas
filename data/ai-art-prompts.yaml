# AI 插畫提示詞（寫實數位繪畫，2026-11-08 改）。規範見 docs/art-style.md
# 生圖後存成 public/images/ai/<card>/<id>.webp，網站會自動換掉佔位圖。
# tool：ZL 實際使用的生圖工具，生好後請改成工具名稱。
tool: Grok
style: >-
  Realistic cinematic digital painting, semi-realistic historical illustration with natural lighting,
  believable anatomy and detailed textures of stone, cloth, bronze and skin. Warm Mediterranean palette:
  terracotta, Aegean blue, olive green, marble white, gold accents. Clothing, armor and architecture of the
  ancient Greek world (or early Italy for Roman scenes). Landscape 4:3, 1600x1200. No text, no letters,
  no watermark, no signature. Not a photograph, not a vase painting, not anime or cartoon.
  Violence only implied, no blood or gore; no explicit nudity; tasteful for adult general audiences.
style_chinese: >-
  Realistic cinematic digital painting, semi-realistic historical illustration with natural lighting,
  believable anatomy and detailed textures of silk, bronze, lacquer, jade and rammed earth. Palette: cinnabar red,
  stone blue, malachite green, rice-paper ivory and gold accents. Clothing, armor and architecture of the Han-dynasty
  Chinese world (clothing and style of Han tomb paintings and reliefs; no Ming/Qing costumes, no kimono, no Japanese
  or Korean styling). Landscape 4:3, 1600x1200. No text, no letters, no calligraphy, no seals, no watermark, no signature.
  Not a photograph, not anime or cartoon. Violence only implied, no blood or gore; no explicit nudity;
  tasteful for adult general audiences.
style_norse: >-
  Realistic cinematic digital painting, semi-realistic historical illustration with natural lighting, believable
  anatomy and detailed textures of wool, linen, leather, iron, timber, carved wood and weathered stone.
  Palette: cold sea blue-grey, fjord green, peat brown, undyed wool cream, iron grey, with firelight amber accents.
  Clothing, ships and buildings of Viking-age Scandinavia (about 9th-11th century): wool tunics and trousers, long
  wool and linen dresses with oval shoulder brooches, leather belts and shoes, round wooden shields, longhouses
  and clinker-built longships. NO horned helmets (no horns or wings on any helmet), NO Marvel-style or superhero
  costumes, NO modern fantasy armour (no plate armour, no oversized pauldrons, no glowing ornate armour), no
  medieval castles or knights. Landscape 4:3, 1600x1200. No text, no letters, no written runes, no watermark,
  no signature. Not a photograph, not anime or cartoon. Violence only implied, no blood or gore; no explicit
  nudity; tasteful for adult general audiences.
style_chinese_later: >-
  Realistic cinematic digital painting, semi-realistic historical illustration with natural lighting, believable anatomy and detailed textures of silk, bronze, lacquer, jade and rammed earth. Palette: cinnabar red, stone blue, malachite green, rice-paper ivory and gold accents. Clothing, armor and architecture of the Chinese world of the period when this belief or story took its familiar form (Tang-Song-Ming clothing, hats and architecture as the scene requires; no Qing queue hairstyles, no kimono, no Japanese or Korean styling). Landscape 4:3, 1600x1200. No text, no letters, no calligraphy, no seals, no watermark, no signature. Not a photograph, not anime or cartoon. Violence only implied, no blood or gore; no explicit nudity; tasteful for adult general audiences.
characters:
  zeus: "Zeus: powerful middle-aged man, thick curly grey-black hair and full beard, Aegean-blue cloak over one shoulder, holding a golden zigzag thunderbolt."
  hera: "Hera: regal woman, dark hair under a tall gold crown, long marble-white robe with blue border."
  athena: "Athena: tall young woman, tall-crested bronze helmet pushed up, spear, aegis cape with a small Medusa face on the chest, a small owl nearby."
  hermes: "Hermes: slim beardless young man, wide-brimmed traveller's hat with small wings, winged sandals, short tunic, staff with two snakes."
  aphrodite: "Aphrodite: young woman with long golden hair, light marble-white robe, a white dove nearby."
  hephaestus: "Hephaestus: bearded stocky craftsman, conical felt cap, short work tunic off one shoulder, hammer, walks with a stick."
  hades: "Hades: bearded stern man resembling Zeus but darker, deep blue-black robe, sceptre."
  demeter: "Demeter: mature woman, wreath of wheat ears, olive-green robe, carrying a torch when searching."
  persephone: "Persephone: young woman, long dark hair, light robe with flower pattern; as queen, a small gold crown."
  prometheus: "Prometheus: lean bearded titan, earth-colored tunic, carrying a fennel stalk with a small flame."
  epimetheus: "Epimetheus: younger brother of Prometheus, beardless, open friendly face, simple tunic."
  pandora: "Pandora: young woman, elaborate gold crown and fine robe given by the gods, beside a large knee-high clay storage jar (pithos), not a box."
  eris: "Eris: gaunt woman in dark ragged robe, sly expression, holding a golden apple."
  paris: "Paris: handsome beardless young Trojan prince, Phrygian cap, shepherd's staff."
  helen: "Helen: beautiful young queen, veil, marble-white robe with gold trim."
  agamemnon: "Agamemnon: proud bearded king, bronze armor, red cloak, gold crown."
  iphigenia: "Iphigenia: teenage girl in white bridal robe and veil."
  achilles: "Achilles: young beardless warrior, long blond hair, bronze armor with round shield."
  hector: "Hector: bearded Trojan prince, crested helmet, bronze armor."
  odysseus: "Odysseus: weathered bearded man, small conical sailor's cap, short tunic, clever eyes."
  laocoon: "Laocoon: grey-bearded Trojan priest in robes, with two young sons."
  sinon: "Sinon: young Greek man in torn clothes, hands bound, pleading."
  polyphemus: "Polyphemus: huge one-eyed giant shepherd, shaggy hair, single eye in the middle of his forehead."
  circe: "Circe: elegant sorceress, long dark-red hair, gold cup and wand."
  penelope: "Penelope: dignified woman, veil, working at a large upright loom."
  oedipus: "Oedipus: young traveller with a staff and short cloak; later a king with a gold circlet."
  laius: "Laius: older king in a chariot, grey beard."
  sphinx: "Sphinx: winged lion with the head of a woman, sitting on a rock."
  jocasta: "Jocasta: mature queen, veil, gold diadem."
  tiresias: "Tiresias: old blind prophet, white beard, staff."
  narcissus: "Narcissus: beautiful youth of about sixteen, dark curly hair, hunter's tunic and spear."
  nemesis: "Nemesis: stern dignified goddess of retribution, grey-blue robe and veil, holding a bridle; no helmet, no spear, no shield, no owl (she is not Athena)."
  echo: "Echo: shy young nymph, long light-brown hair, pale olive-green robe."
  daedalus: "Daedalus: grey-bearded inventor, leather apron, tools."
  icarus: "Icarus: slim teenage boy, short curly hair, simple short tunic."
  arachne: "Arachne: young Lydian weaver, simple brown dress, hair tied up, working at an upright loom."
  rhea_silvia: "Rhea Silvia: young Vestal priestess, white veil and robe."
  romulus_remus: "Romulus and Remus: twin boys (babies or young men depending on the scene), identical dark hair."
  she_wolf: "She-wolf: large grey-brown wolf with a gentle expression."
  faustulus: "Faustulus: rough bearded shepherd with a crook."
  nuwa: "Nuwa: goddess with a human head and upper body and a long serpent lower body, in the Han-dynasty tomb-art convention; hair in a high bun, flowing robe of cinnabar red and pale ivory."
  gonggong: "Gonggong: fierce bearded water-god warrior with wild dark hair and a blue-green robe, a rough horn-like helmet."
  zhuanxu: "Zhuanxu: calm young king in Han-style black and red court robes with a flat-topped beaded crown."
  huangdi: "Huangdi (Yellow Emperor): dignified bearded ruler in a yellow-ochre Han-style robe with a beaded crown, a bronze sword."
  chiyou: "Chiyou: imposing war-chief with a horned helmet, bronze weapons, dark armor with red trim."
  yinglong: "Yinglong: a winged auspicious dragon with long serpentine body, deer-like antlers and four clawed legs, deep azure scales, associated with water; no fire breathing."
  nuba: "Nuba (drought goddess): slender woman in plain pale-green robe, bald or with very short hair, quiet and sorrowful, the ground around her cracked and dry."
  houyi: "Hou Yi: strong archer in Han-style short tunic, leather armor and a long red bow, topknot, calm focused expression."
  xihe: "Xihe: dignified goddess in vermilion robes driving a chariot of light, a bright round sun at her side."
  change: "Chang'e: graceful woman in long flowing sleeves of pale ivory and stone-blue Han-style dress, hair in a high bun with a jade hairpin, a small white rabbit nearby when on the moon."
  xiwangmu: "Xiwangmu (Queen Mother of the West): majestic woman with an ornate hair ornament called a sheng, long jade-green robe, seated on a mountain throne."
  yu: "Yu the Great: tough lean man in rough hemp clothes, a work spade or digging tool, sun-tanned, calloused hands, straw hat optional."
  gun: "Gun: older bearded man in rough clothes, tired expression, carrying a pouch of glowing earth."
  yao: "Yao: elderly wise ruler in simple Han-style robe, grey hair and beard."
  shun: "Shun: humble sincere young farmer in plain hemp clothes."
  cowherd: "Cowherd (Niulang): young herdsman in simple blue-grey Han-style tunic, an old ox beside him."
  weaver: "Weaver Girl (Zhinu): graceful young woman in brilliant cloud-colored silk robes, working at a loom of light."
  magpies: "Magpies: a large flock of black-and-white magpies forming a bridge across the Milky Way."
  pangu: "Pangu: a towering primeval giant with a hairy chest, wearing a skirt of green leaves, two small horns on his head, bearded, standing with his legs on the earth and his arms raised to hold up the sky; NO axe in his hands."
  fuxi: "Fuxi: a bearded man with a human head and upper body and a long serpent lower body in the Han-dynasty tomb-art convention; hair in a topknot under a small cap, a plain dark robe, holding a carpenter's square (a right-angled ruler)."
  zhurong: "Zhurong: a red-faced fire god general with a black beard, red armor and a flowing crimson robe, standing on the backs of two dragons, with flames curling around him."
  shennong: "Shennong: a barefoot old farmer-god in a robe of green leaves, two small horns on his head, white beard, holding a handful of herbs and a bamboo basket of plants."
  gonggong_ancient: "Gonggong (ancient description): a figure with a human face and red hair, the upper body of a man in a dark blue-green robe and the lower body of a long red-brown serpent, rising out of dark water; fierce expression."
  jingwei: "Jingwei: a small bird shaped like a crow, with glossy black feathers, a patterned crest of pale markings on its head, a WHITE beak and RED feet."
  xingtian: "Xingtian: a towering, heavily muscled headless giant with ordinary weathered human skin. He has NO head and NO neck: the top of his torso between the shoulders is completely covered by smooth, unbroken skin of the same colour as the rest of his body, with no cut surface, no stump, no red flesh and no wound. His face is on his torso: two fierce eyes exactly where the nipples would be, on the upper chest, and a wide grimacing mouth low on the belly exactly where the navel would be, with a broad space of plain skin between the eyes and the mouth. He wears a dark waist wrap with a cinnabar-red sash, tied below the mouth, and leather greaves."
  kuafu: "Kuafu: a giant, many times taller than the trees, lean long-legged runner with sun-burnt skin, wild black hair tied back, short rough beard, a knee-length wrap of coarse undyed hemp and animal hide, bare feet, carrying a long plain wooden walking staff."
  dragon: "Chinese dragon (long): a long, slender, serpentine body covered in deep azure-blue scales with a paler belly, a pair of branching deer-like antlers, long trailing whiskers on its snout, a flowing mane, and four short legs with clawed feet. It has NO wings. It is a benevolent rain-bringing creature in the slim style of Han-dynasty art."
  cangjie: "Cangjie: a thoughtful middle-aged scribe-official with an ordinary human face (two eyes), black hair in a topknot under a small plain cap, a neat short beard, a plain dark stone-blue Han-style robe with ivory collar."
  fenghuang: "Fenghuang: a large, elegant auspicious bird with the head of a rooster or golden pheasant, a small crest, a long graceful neck, and very long sweeping tail feathers like a peacock's. Its plumage shows five colours: cinnabar red, stone blue, golden yellow, white and black."
  # ===== 北歐神話（style_norse）：只放每一格都會有的特徵，只在部分場景出現的道具寫在場景裡 =====
  odin: "Odin: a tall, weathered old man with long grey hair and a long grey beard, ONE eye only (the other eye socket closed and scarred), dark blue-grey wool cloak over a long wool tunic, leather belt."
  thor: "Thor: a very broad-shouldered, powerfully built man in his prime, thick reddish-brown beard and hair, plain wool tunic and trousers with a wide leather belt, no helmet."
  loki: "Loki: a lean, handsome man with sharp features, quick restless eyes and a knowing smile, dark hair, well-made dark green wool tunic with trim."
  freyja: "Freyja: a dignified woman with long fair hair in a braid, Viking-age long dress: a wool underdress with a linen overdress fastened by two oval brooches at the shoulders."
  frigg: "Frigg: a mature woman of the highest rank, calm and serious, long linen dress with a deep blue wool overdress fastened by two oval brooches, hair covered by a plain linen headcloth."
  baldr: "Baldr: a very handsome young man, clean-shaven with light hair, his body gives off a soft golden glow, pale cream wool tunic."
  hodr: "Hodr: a young man who is blind, eyes closed, plain grey wool tunic, careful hands feeling the air."
  heimdall: "Heimdall: a tall, alert man dressed all in white and cream wool, his teeth gleam gold when he speaks, watchful eyes."
  thrym: "Thrym: a giant chieftain, huge and heavy compared with people around him, wild hair and beard, furs over a coarse wool tunic."
  fenrir: "Fenrir: an enormous grey wolf as big as a longship, lean and powerful, pale eyes, realistic wolf anatomy."
  jormungandr: "Jormungand: an enormous dark-scaled sea serpent, thick as a ship's hull, long enough to encircle the land."
  surtr: "Surtr: a towering fire giant, charred dark skin cracked with glowing embers, wreathed in flame."
  audhumla: "Audhumla: a huge, adult, hornless primeval cow (not a calf) with a shaggy cream-white coat and a full udder."
  ymir: "Ymir: the first frost giant, a colossal human-shaped figure whose whole body is made of rough white rime frost and blue-grey ice, with a heavy brow and a beard of icicles. His head is bare and rounded: NO horns, no antlers, no spikes, no helmet, no crown. He wears nothing and carries nothing: no brooch, no jewellery, no belt, no clothing; his body is a rough natural shape of ice, more like a living glacier than a man."
  odin_one_eye: "Odin: a tall, weathered old man with long grey hair and a long grey beard, dark blue-grey wool cloak over a long wool tunic, leather belt. He has ONLY ONE EYE: his LEFT eye is open; his RIGHT eye is gone, the right eyelid is permanently sunken and sewn shut with an old pale scar running vertically through the brow and cheek. No eye-patch, no helmet, no hat."
  fusang: "Fusang: a colossal sacred mulberry tree with a massive gnarled trunk and broad green leaves, growing straight up out of the sea."
  three_norns: "The three Norns: three women in plain Viking-age wool dresses and headcloths, one young, one middle-aged, one old."
  yggdrasil: "Yggdrasil: an immense, ancient, evergreen ash tree with a huge grey trunk and a wide crown of fresh green ash leaves (compound leaves with many narrow leaflets), far larger than any mountain."
  tyr: "Tyr: a brave, steady warrior of about forty, short dark-blond hair, short beard, a weathered face with a level gaze, a rust-red wool tunic with a plain leather belt, dark trousers with leg wraps, no helmet, no armour."
  sigyn: "Sigyn: Loki's loyal wife, a tired, gentle woman in a plain grey-brown wool dress with two oval shoulder brooches, hair under a linen headcloth."
  kunlun: "Mount Kunlun: an impossibly tall, steep mountain of pale rock and jade-green cliffs rising in several great tiers far above a sea of clouds, in the remote north-west."
  four_symbols: "The Four Symbols, four directional creatures, painted as realistic living animals (NOT as a mural, wall painting, tapestry or old scroll): (1) the Azure Dragon: a slender wingless azure-blue Chinese dragon with antlers; (2) the White Tiger: a powerful white tiger with dark stripes; (3) the Vermilion Bird: a cinnabar-red bird with a long tail, NOT on fire; (4) the Black Tortoise (Xuanwu): a dark tortoise with a snake coiled around its shell, the two heads facing each other."
  ninetail_fox: "Nine-tailed fox: a real-looking wild fox, larger than a wolf, with russet-red fur, white throat and chest, black legs, sharp amber eyes, and NINE long bushy tails. Every tail ends in a clear WHITE tip."
