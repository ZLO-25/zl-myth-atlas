  freyr: "Freyr: young handsome man in a rich green wool tunic, a sword at his belt, a golden-bristled boar beside him."
  hel: "Hel: a stern, fierce woman whose body is half dark blue-black and half ordinary skin tone, long plain grey dress, hard face."
  idun: "Idun: young woman with a gentle face holding an ash-wood box of apples, long light-brown hair, plain linen dress."
  mimir: "Mimir: only a wise severed head preserved with herbs, eyes open, resting beside a spring, no body."
  njord: "Njord: weathered man in his prime with a short grey-brown beard, wool tunic and sea boots, standing by the shore."
  norns: "The Norns: three women in plain wool dresses at the foot of a great ash tree, drawing water from a spring and pouring it on the roots."
  sif: "Sif: woman with long golden hair falling to her waist, Viking-age wool dress with brooches."
  skadi: "Skadi: tall woman in winter hunting clothes, fur-trimmed wool cloak and snowshoes, a bow on her back, a giant's daughter in full armour (a plain Viking-age mail shirt and round shield, no horned helmet)."
  valkyries: "Valkyries: women on horseback in plain wool cloaks and long dresses, carrying drinking horns, riding toward a battlefield or serving at a long hall."
  vidar: "Vidar: silent broad-shouldered man in a plain tunic and a pair of unusually thick-soled leather shoes."
  sleipnir: "Sleipnir: a grey horse with EIGHT legs, strong, realistic horse anatomy."
  jotnar: "A giant (jotunn): huge man towering over a house, rough fur clothing, frost in his beard; no unified look."
