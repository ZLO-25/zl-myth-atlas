  aeneas: "Aeneas: Trojan warrior in bronze armor carrying his old father on his shoulders, holding a small household-god statue; a small boy walks beside him."
  antigone: "Antigone: young woman in a plain dark Greek robe with a head-covering, determined face, carrying a small jar of earth."
  atalanta: "Atalanta: lean young huntress with short tunic, hair tied back, bow and a boar-spear, a swift runner."
  bellerophon: "Bellerophon: handsome young hero with a golden bridle in hand, riding or standing beside the white winged horse Pegasus."
  cadmus: "Cadmus: young Phoenician prince in a travelling cloak with a spear, beside a great serpent."
  dioscuri: "Castor and Pollux: two young horsemen in wide-brimmed travelling hats, short cloaks and spears, two white horses; small flames glow on their heads."
  heracles: "Heracles: muscular bearded hero wearing a lion skin with the lion's head as a hood, carrying a wooden club and a bow."
  jason: "Jason: young warrior with one sandal missing, holding the Golden Fleece, the ship Argo behind him."
  medea: "Medea: dark-haired sorceress in rich robes with a small flask of potion, intense calm gaze."
  orpheus: "Orpheus: young man with a seven-string lyre, soft expression, animals listening around him."
  perseus: "Perseus: young man with winged sandals and a curved sickle-sword, holding up the head of Medusa without looking at it, an invisibility cap, a bag over his shoulder."
  theseus: "Theseus: beardless young hero with a sword and a ball of red thread, at the entrance to a stone labyrinth."
  centaur: "Centaur: a creature with a man's upper body and a horse's body and four legs, wild hair, holding a tree branch; Chiron wears a long robe and boots, with a human body and a small horse rump attached."
  cerberus: "Cerberus: huge dog with three heads, a snake for a tail, snake heads along its back, lion's claws."
  medusa: "Medusa: woman whose hair is made of living snakes, a haunting sorrowful face; her gaze must not be shown as magic rays."
  minotaur: "Minotaur: a man's body with a bull's head, huge and muscular, in a dim stone labyrinth."
  sirens: "Sirens: bird bodies with a woman's head and chest, singing on rocks by the sea; one plays a harp, one a flute."
  typhon: "Typhon: gigantic winged being with a human upper body, a hundred snake heads rising from his arms, legs as great coils of serpent, eyes glowing."
  gaia: "Gaia: majestic woman rising from the earth only to her waist, long brown hair with leaves, fruits in her hands."
  nyx: "Nyx: winged goddess in a dark veil wrapped in night mist, driving a dark chariot; in her arms two sleeping boys, one pale, one dark."
  uranus: "Uranus: a huge man whose body is the night sky, dotted with stars, arching over the earth."
  atlas: "Atlas: huge muscular man kneeling on one knee, a vast celestial sphere with constellations on his shoulders."
  cronus: "Cronus: old bearded Titan holding a curved sickle, grim, a swaddled bundle in his other hand."
  rhea: "Rhea: mature queen in a long robe and a crown shaped like city walls, a lion beside her, holding a swaddled bundle."
  chaos: "Chaos: not a person; a swirling dark gap between earth and sky."
  janus: "Janus: one head with two bearded faces looking opposite ways, in a simple early-Roman robe, standing in a gateway, a key in one hand."
  aegir: "Aegir: tall sea-giant host with a long white-grey beard, a deep sea-green wool cloak, gold glinting in his hall."
  ran: "Ran: sea goddess in a dark blue-green dress, holding a large fishing net in both hands, hair like sea foam."
  bragi: "Bragi: long-bearded man in a fine wool tunic, telling stories at a feast table, a harp near him."
  freyr: "Freyr: young handsome man in a rich green wool tunic, a sword at his belt, a golden-bristled boar beside him."
  hel: "Hel: a stern, fierce woman whose body is half dark blue-black and half ordinary skin tone, long plain grey dress, hard face."
  idun: "Idun: young woman with a gentle face holding an ash-wood box of apples, long light-brown hair, plain linen dress."
  mimir: "Mimir: only a wise severed head preserved with herbs, eyes open, resting beside a spring, no body."
  njord: "Njord: weathered man in his prime with a short grey-brown beard, wool tunic and sea boots, standing by the shore."
  norns: "The Norns: three women in plain wool dresses at the foot of a great ash tree, drawing water from a spring and pouring it on the roots."
  sif: "Sif: woman with long golden hair falling to her waist, Viking-age wool dress with brooches."
