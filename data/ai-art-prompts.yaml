  - {id: img-ai-portrait-xihe, card: god-xihe, system: chinese, title: 羲和, characters: [xihe], scene: "At the Sweet Spring at the eastern edge of the world, Xihe gently bathes a glowing round sun in clear water with her hands, steam rising around her; a calm dawn, mulberry branches overhead. Exactly one sun in the image."}
  - {id: img-ai-portrait-zhurong, card: god-zhurong, system: chinese, title: 祝融, characters: [zhurong], scene: "Zhurong stands upon two dragons above a southern mountain range, red flames rising around him, banners and clouds, his gaze steady and powerful."}
  - {id: img-ai-portrait-chiyou, card: god-chiyou, system: chinese, title: 蚩尤, characters: [chiyou], scene: "Chiyou stands on a windswept battlefield in horned helmet and dark armor, holding a bronze halberd and a bronze axe, with swirling wind and rain clouds behind him; fierce but dignified, a war god rather than a monster."}
  - {id: img-ai-portrait-huangdi, card: god-huangdi, system: chinese, title: 黃帝, characters: [huangdi], scene: "Huangdi seated on a simple earthen throne in the central plain, wearing a yellow-ochre robe and a flat-topped crown with beaded tassels hanging front and back, long beard, calm authority; yellow earth and a river valley behind him."}
  - {id: img-ai-portrait-shennong, card: god-shennong, system: chinese, title: 神農, characters: [shennong], scene: "Shennong sits on a mountain slope tasting a herb, bundles of plants and a bamboo basket around him, a field of young crops below; a plain wooden plough leaning beside him."}
  - {id: img-ai-portrait-xiwangmu, card: god-xiwangmu, system: chinese, title: 西王母, characters: [xiwangmu], scene: "Xiwangmu sits on a throne of carved stone on Kunlun Mountain among clouds, wearing a sheng headdress (a horizontal bar with ends like small scrolls), one hand holding a small jade vessel; a white rabbit pounds medicine beside her. No other creatures."}
  - {id: img-ai-portrait-pangu, card: primordial-pangu, system: chinese, title: 盤古, characters: [pangu], scene: "Inside a vast dark cosmic egg splitting open: light, clear air rises above to become sky and heavy murk sinks below to become earth, while Pangu stands between them with arms raised, holding them apart."}
  - {id: img-ai-portrait-fuxi, card: primordial-fuxi, system: chinese, title: 伏羲, characters: [fuxi], scene: "Fuxi on a riverbank at dawn, serpent body coiled on the ground, looking at the stars and at patterns in the river sand, tracing eight simple three-line symbols (the eight trigrams: each made of three horizontal lines, solid or broken) in the earth with his finger; no readable text or letters."}
  # 中華卡片補圖（2026-11-17）
  - {id: img-ai-portrait-change, card: hero-change, system: chinese, title: 嫦娥, characters: [change], scene: "Match the earlier images of her: a young woman with black hair in a high bun held by a jade-green hairpin, a pale ivory Han-style robe with long flowing sleeves over a stone-blue skirt with thin cinnabar-red trim. Chang'e stands alone on a pale stone terrace of the palace on the moon, the ground silvery and quiet, seen from the knees up; she looks down with a wistful face toward the small, distant, blue-green Earth hanging in the black sky. One small white rabbit sits at her feet. Cold silver light, a few stars. No other people, no sun."}
  - {id: img-ai-portrait-houyi, card: hero-houyi, system: chinese, title: 后羿, characters: [houyi], scene: "Match the earlier images of him: a man of about thirty, black hair in a topknot, clean-shaven, dark lamellar leather armour over a cinnabar-red and stone-blue tunic, a quiver of arrows at his hip, a long red recurved bow. Hou Yi stands on a scorched rocky ridge just after his great deed, seen from the knees up in three-quarter view, the long red bow held upright in his left hand and one arrow resting loosely in his right, looking calmly toward the horizon. Cracked dry earth behind him is beginning to turn green. EXACTLY ONE sun in the image, low on the horizon; no other sun or glowing disc anywhere."}
  - {id: img-ai-portrait-yu, card: hero-yu, system: chinese, title: 大禹, characters: [yu], scene: "Match the earlier images of him: a lean, sun-tanned man of about forty with a short rough beard, ragged undyed hemp tunic tied with a rope belt, bare muddy shins and straw sandals, a long wooden digging spade, a conical straw hat hanging on his back. Yu the Great stands on a muddy earthen bank, seen from the knees up, both calloused hands resting on his wooden spade, tired but steady, looking out over the land. Behind him a newly dug channel carries brown floodwater away between hills toward a distant sea, and the sky is clearing after rain. A few tiny workers far in the background."}
  - {id: img-ai-portrait-gun, card: hero-gun, system: chinese, title: 鯀, characters: [gun], scene: "Match the earlier image of him: a man of about sixty, grey-streaked hair in a topknot, grey beard, worn layered robes of faded blue-grey and brown, mud on his sleeves, holding a cloth pouch of softly glowing golden earth in both hands. Gun stands in driving rain on top of a half-built earthen dike, seen from the knees up, shielding the pouch of softly glowing golden earth against his chest and looking back over his shoulder at the dark sky as if afraid of being seen. Grey floodwater presses against the dike on one side; drowned fields and rooftops lie on the other. He is the only figure."}
  - {id: img-ai-portrait-jingwei, card: hero-jingwei, system: chinese, title: 精衛, characters: [jingwei], scene: "The small bird Jingwei flies low over a vast, rough, grey-blue eastern sea, wings spread, carrying one small pebble in its white beak, about to drop it into the waves; its red feet are tucked beneath it. The bird is in sharp focus in the foreground, tiny against the endless water. Far behind, a wild wooded mountain rises on the western shore: only trees and rock on it, completely uninhabited. NO buildings, no palace, no temple, no pavilion, no roofs, no walls anywhere in the image. Exactly one bird; no people, no ships."}
  - {id: img-ai-portrait-xingtian, card: hero-xingtian, system: chinese, title: 刑天, characters: [xingtian], scene: "Xingtian stands defiantly on a barren mountain slope under a stormy sky, a rectangular lacquered wooden shield raised in his left hand and a long-handled bronze battle-axe swung high in his right, as if still fighting an enemy in the sky. The eyes on his chest glare upward. Wind whips dust around him. No blood, no wound, no severed head shown anywhere; frightening but dignified, like a figure from a Han tomb relief."}
  - {id: img-ai-portrait-kuafu, card: hero-kuafu, system: chinese, title: 夸父, characters: [kuafu], scene: "Kuafu runs in a huge stride across a wide dry riverbed of cracked yellow mud, chasing the setting sun, one arm stretched toward it, his mouth open with thirst, his long staff in the other hand. Small trees and hills at his feet show how enormous he is. The land is dry and golden in the evening light. EXACTLY ONE sun, large and low on the western horizon; no other sun. He is a human-shaped giant, not a monster."}
  - {id: img-ai-portrait-dragon, card: beast-dragon, system: chinese, title: 龍, characters: [dragon], scene: "One Chinese dragon coils through dark rain clouds above a wide river plain, its whole long body visible in an S-curve, head turned toward the viewer with a calm, noble expression. Rain falls from the clouds around it onto green fields and a winding river far below. No wings, no fire, no flames, no smoke from its mouth; not a Western dragon, not a dinosaur-like or bat-winged creature. Exactly one dragon; no people."}
  - {id: img-ai-portrait-cangjie, card: hero-cangjie, system: chinese, title: 倉頡, characters: [cangjie], scene: "Cangjie kneels on a reed mat in an open courtyard at dusk, seen from the knees up, holding a small bronze knife above a set of flat wooden tablets on which he has just scratched a few simple picture-like marks (tiny sketches of a bird track, a mountain, a fish; NOT readable characters or writing). He looks up in amazement as grains of golden millet fall from the sky like rain around him. In the dark background, faint pale ghostly shapes drift away among the trees. No readable text anywhere."}
  - {id: img-ai-portrait-fenghuang, card: beast-fenghuang, system: chinese, title: 鳳凰, characters: [fenghuang], scene: "One fenghuang alights with wings half spread on a rocky outcrop of a sunlit mountain, its long tail feathers trailing in the air, as if dancing. Below it lies a peaceful valley with tilled fields and small thatched houses under a clear morning sky; in the far distance a few tiny musicians in Han-style robes play panpipes. The bird is calm and gentle. NO fire, no flames, no burning feathers, no ashes: it is not the Western phoenix. Exactly one bird."}
  - {id: img-ai-portrait-ninetail-fox, card: beast-ninetail-fox, system: chinese, title: 九尾狐, characters: [ninetail_fox], scene: "The nine-tailed fox sits upright on a mossy rock on the green wooded slope of Mount Qingqiu in morning mist, seen from the front and slightly to one side, head turned toward the viewer, mouth slightly open as if calling. Behind it, its nine tails stand up and spread out in ONE flat, even fan like an open hand-fan or a peacock's display: one tail straight up in the middle, four tails to the left of it and four tails to the right of it, with a clear gap of pale mist between every two tails so that none overlap or hide behind another. Count the white tail tips: there are exactly NINE white tips, no more and no fewer (not seven, not eight). It is a wild, slightly dangerous animal, not cute. It is NOT a woman and not part human; no glowing magic flames, no fireballs. No buildings, no temples, no pavilions, no shrine or torii gate anywhere. Exactly one fox."}
  - {id: img-ai-portrait-four-symbols, card: beast-four-symbols, system: chinese, title: 四象, characters: [four_symbols], scene: "The whole picture is a deep dark-blue night sky full of small stars, nothing else: no ground, no room, no wall, no gate, no altar, no furniture. The four creatures float among thin clouds in a cross-shaped (plus-sign) layout, one in the middle of each edge of the picture, all facing the centre: the Vermilion Bird in the TOP-MIDDLE; the Black Tortoise with its snake in the BOTTOM-MIDDLE; the Azure Dragon in the LEFT-MIDDLE; the White Tiger in the RIGHT-MIDDLE. The four corners of the picture are empty sky. The exact centre of the picture is EMPTY except for a soft ring of stars: there is NO human figure, NO person, NO priest, NO emperor anywhere in the image. All four creatures are about the same size. EXACTLY four creatures (the tortoise and its snake count as one); no compass letters, no labels, no decorative border."}
  - {id: img-ai-portrait-kunlun, card: place-kunlun, system: chinese, title: 崑崙山, characters: [kunlun, xiwangmu], scene: "A grand wide view of Mount Kunlun, the capital of the High God on earth: tier upon tier of cliffs climbing above the clouds, with Han-dynasty style gate towers (paired que towers with straight tiled roofs) and jade-coloured halls on its terraces, soft golden light at the summit. On a rock ledge in the middle distance, very small, Xiwangmu sits on her carved stone throne in her jade-green robe. Snowy ranges and desert haze lie far below. NO pagodas, no Buddhist temples or statues, no Tibetan buildings, no Ming or Qing palace roofs. No text."}
  - {id: img-ai-portrait-fusang, card: place-fusang, system: chinese, title: 扶桑, characters: [fusang], scene: "The giant Fusang tree rises out of the calm steaming water of Tang Valley at the eastern edge of the world, just before dawn, mist curling over the sea around its roots. The suns are glowing golden discs resting among its branches like lanterns, arranged in a strict, simple pattern that is easy to count: ONE sun alone at the very top of the crown; below it, NINE suns in exactly three horizontal rows of exactly three suns each (row 1: three suns, row 2: three suns, row 3: three suns), each row neatly lined up left-centre-right like a grid. That is 1 + 3 + 3 + 3 = TEN suns in total. Do not add a fourth sun to any row, do not put any sun at the edges of the crown outside the grid, and there is no sun or glowing disc anywhere else in the image, not in the sky and not reflected in the water as an extra disc. No people, no chariot, no buildings."}
  # ===== 北歐神話（style_norse）=====
  - {id: img-ai-ragnarok-1, card: story-ragnarok, system: norse, title: 芬布爾之冬, characters: [], scene: "A harsh unending winter: snow and ice cover a Viking-age settlement and a fjord under a dark sky; high above, a huge wolf has its jaws closed around the sun, which is almost gone."}
  - {id: img-ai-ragnarok-2, card: story-ragnarok, system: norse, title: 海姆達爾吹號角, characters: [heimdall], scene: "Heimdall stands on the glowing rainbow bridge Bifrost and blows a great horn that sounds across all the worlds; behind him a vast ash tree, the world tree Yggdrasil, shakes, its branches swaying."}
  - {id: img-ai-ragnarok-3, card: story-ragnarok, system: norse, title: 指甲船與火巨人, characters: [loki, surtr], scene: "A huge ship built of fingernails sails out over a stormy sea with Loki at the steering oar; to the south, on the horizon, the fire giant Surtr advances with flames behind him."}
  - {id: img-ai-ragnarok-4, card: story-ragnarok, system: norse, title: 一組一組的對戰, characters: [odin, fenrir, thor, jormungandr], scene: "A wide shattered battlefield showing two fights side by side. On the left, Odin faces the enormous wolf Fenrir as it lunges with open jaws. On the right, Thor swings his hammer at the Midgard serpent rearing out of the sea. Violence only implied, no blood."}
  - {id: img-ai-ragnarok-5, card: story-ragnarok, system: norse, title: 大地再度升起, characters: [], scene: "After the great fire: a calm sea from which fresh green land rises again, blackened ground in the foreground giving way to green hills and clear water, soft morning light."}
  - {id: img-ai-baldr-death-1, card: story-baldr-death, system: norse, title: 惡夢與誓言, characters: [frigg, baldr], scene: "Frigg stands at the centre of an open landscape asking for vows: around her are a small fire, a stream, iron tools, a stone, a tree, birds, animals and a snake, each shown as if listening. In the distance Baldr watches, his body faintly glowing."}
  - {id: img-ai-baldr-death-2, card: story-baldr-death, system: norse, title: 眾神丟東西取樂, characters: [baldr, thor, odin], scene: "On an open assembly field, Baldr stands in the middle, glowing, while gods around him laugh and toss things at him as a game."}
  - {id: img-ai-baldr-death-3, card: story-baldr-death, system: norse, title: 洛基套話, characters: [loki, frigg], scene: "Inside the hall Fensalir, Frigg listens to a woman who is really Loki in disguise, in a woman's dress and headcloth; Loki's sly eyes show he is after a secret."}
  - {id: img-ai-baldr-death-4, card: story-baldr-death, system: norse, title: 槲寄生的箭, characters: [loki, hodr, baldr, odin], scene: "A circle of stunned Viking-age gods and villagers on the assembly field, all bareheaded or in plain wool hoods: NO helmets of any kind on anyone in this image, and absolutely no horns. In the centre Baldr falls to the ground, his glow fading, no blood. Beside the circle blind Hodr, eyes closed or blindfolded with a plain cloth, holds one small sprig of mistletoe (a thin green twig, not a weapon or sword), with Loki standing close behind him, his hand guiding Hodr's arm to aim. Odin stands at the edge with a face full of grief; show Odin with EXACTLY ONE eye open and the other eye socket closed and scarred, face turned toward the viewer so this is clearly visible."}
  - {id: img-ai-baldr-death-5, card: story-baldr-death, system: norse, title: 火葬的船, characters: [odin, thor], scene: "On a shore, a giantess pushes a great Viking-age ship down to the water, the funeral pyre built on its deck. Mourners stand on the beach. Thor raises his hammer to bless the pyre; Odin lays a gold ring on the pyre. A woman, Baldr's wife Nanna, lies still beside the pyre."}
  - {id: img-ai-thor-bride-1, card: story-thor-bride, system: norse, title: 錘子不見了, characters: [thor, freyja, loki], scene: "Inside Thor's hall at dawn: Thor sits up and stares at the empty place where his hammer lay. In the doorway Freyja hands a cloak of falcon feathers to Loki."}
  - {id: img-ai-thor-bride-2, card: story-thor-bride, system: norse, title: 芙蕾雅拒絕, characters: [freyja, thor, loki], scene: "Freyja stands before Thor and Loki in the hall of the gods, furious; her necklace bursts apart with gold beads flying as she refuses to marry the giant."}
  - {id: img-ai-thor-bride-3, card: story-thor-bride, system: norse, title: 新娘頭紗, characters: [heimdall, thor, loki], scene: "In the hall of the gods, Heimdall holds up a white bridal veil. Thor, broad and grim, looks reluctant; Loki grins and leans in to persuade him."}
  - {id: img-ai-thor-bride-4, card: story-thor-bride, system: norse, title: 驚人的食量, characters: [thor, loki, thrym], scene: "A giant's feast hall: Thor, wearing a bridal veil, sits at the high table in front of the remains of a whole ox, eight salmon and three barrels of mead, his eyes burning like fire. Beside him Loki, dressed as a maid, whispers excuses to the staring giants. Thrym watches."}
  - {id: img-ai-thor-bride-5, card: story-thor-bride, system: norse, title: 錘子放在膝上, characters: [thor, thrym, loki], scene: "In the giant's hall, ONE person only is the veiled bride, and that bride IS Thor himself: a broad-shouldered, red-bearded man sitting at the feast table wearing a white bridal veil and a bridal dress, his beard and strong jaw visible under the veil, his face NOT hidden. A giant servant has just laid the great hammer Mjollnir across Thor's lap, and Thor's own hand closes around the hammer handle, a fierce grin on his face. Thrym, the huge giant chieftain, and the other giants are frozen in surprise. Loki stands to one side dressed as a maid in a long wool dress and a headcloth (clearly a woman's dress, not his green tunic). No separate bride figure, exactly one veiled person. Violence only implied, no blood."}
  - {id: img-ai-portrait-thor, card: god-thor, system: norse, title: 索爾, characters: [thor], scene: "Match the earlier images of him: undyed tan-brown wool tunic, brown trousers with leg wraps. His hammer Mjollnir is a plain, heavy iron hammer with a SHORT handle, held in one hand. For this picture he also wears a pair of plain iron-plated work gloves and his wide leather belt of strength. Thor stands braced in a simple two-wheeled wooden cart drawn by EXACTLY TWO large, shaggy he-goats with curved horns, driving it along a rocky ridge under dark storm clouds; he grips the reins in one gloved hand and holds the short-handled hammer ready in the other. A flash of lightning lights the clouds behind him; rain sweeps the fjord below. No helmet, no cape, no wings, no armour, no glowing hammer; the lightning is in the sky, not shooting from the hammer. No other people."}
  - {id: img-ai-portrait-loki, card: god-loki, system: norse, title: 洛基, characters: [loki, sigyn], scene: "Match the earlier images of him: wavy black hair to the collar, clean-shaven, dark green wool tunic with a narrow woven trim. No horned helmet, no gold armour, no cape. Inside a dim rocky cave: Loki lies bound on his back across three flat upright stones, tied with dark iron-grey bonds at shoulders, hips and knees, his clever face tense and defiant. On a ledge above his head ONE grey-green snake hangs, a drop of venom forming at its mouth. Sigyn stands beside him holding a wooden bowl up under the snake to catch the venom, her arms tired. A little cold daylight comes from the cave mouth. No blood, no wounds; exactly two people and one snake."}
  - {id: img-ai-portrait-freyja, card: god-freyja, system: norse, title: 芙蕾雅, characters: [freyja], scene: "Match the earlier images of her: a woman of about thirty, golden-blond hair in one long thick braid over her shoulder, a grey-brown wool overdress over a cream underdress, bronze oval brooches. She wears the necklace Brisingamen: a broad necklace of gold beads and amber, unbroken. Freyja rides in a small, low, two-wheeled wooden cart drawn by EXACTLY TWO large, long-haired grey forest cats (big as lynxes, like Norwegian forest cats), across a flowering summer meadow above a fjord. She holds the reins lightly, proud and calm, the gold necklace bright at her throat; a cloak of brown-and-grey falcon feathers is folded over the side of the cart beside her. No armour, no winged helmet, no sword, no lions or tigers. She is the only person."}
  - {id: img-ai-portrait-frigg, card: god-frigg, system: norse, title: 芙麗嘉, characters: [frigg], scene: "Match the earlier images of her: a woman of about fifty with a calm, lined face, cream linen headcloth, cream linen dress under a deep blue wool overdress held by two round-oval bronze brooches. Frigg sits upright on a carved wooden high seat inside her timber hall Fensalir, seen from the knees up, hands folded in her lap, looking straight at the viewer with a quiet, knowing, slightly sad expression, as someone who knows every fate and says nothing. Firelight warms one side of her face. Through the open doorway behind her lie misty wetlands and, on a bare oak branch near the door, one small green sprig of mistletoe. No crown, no spinning wheel, no other people."}
  - {id: img-ai-portrait-baldr, card: god-baldr, system: norse, title: 巴德爾, characters: [baldr], scene: "Match the earlier images of him: about twenty years old, shoulder-length pale blond hair, a gentle open face, cream wool tunic and trousers, a soft golden glow all around his body. Baldr stands in a sunlit green meadow in front of his bright timber hall Breidablik, seen from the knees up, smiling gently, one hand slightly raised in greeting; the soft golden light from his body brightens the grass and flowers around him. On the branch of an old tree at the edge of the picture hangs one small green sprig of mistletoe, unnoticed. No armour, no weapon, no halo ring or angel wings (the glow is a soft light, not a disc). He is the only person."}
  - {id: img-ai-portrait-heimdall, card: god-heimdall, system: norse, title: 海姆達爾, characters: [heimdall], scene: "Match the earlier image of him blowing the horn: long pale-blond hair, a short trimmed beard, white and cream wool tunic and hooded cloak, leather leg wraps. His horn Gjallarhorn is a very long, curved natural horn with plain bands, as in that image. Heimdall stands guard at the upper end of the softly glowing rainbow bridge Bifrost, seen from the knees up, turned three-quarters, one hand shading his sharp eyes as he scans the far distance, his lips parted so that his golden teeth catch the light. The great horn hangs at his side on a leather strap; he is NOT blowing it. Beside him stands his horse Gulltopp, a sturdy pale horse with a shining golden mane. Clear cold morning light, mountains and sea far below. No helmet. No other people."}
  - {id: img-ai-portrait-tyr, card: god-tyr, system: norse, title: 提爾, characters: [tyr, fenrir], scene: "In this scene he is not yet full-grown: his shoulder stands a little higher than a man's head. Grey-brown shaggy fur as in the earlier image. On a bare rocky island in a grey lake: the great wolf Fenrir stands with a thin, smooth, pale ribbon (the fetter Gleipnir, as slight as a silk band) looped around his neck and legs, eyeing the gods with suspicion. Tyr alone steps forward and calmly lays his RIGHT hand between the wolf's open jaws as a pledge, looking the wolf in the eye without fear. A few other gods in plain wool cloaks stand well back, uneasy. The moment before the bite: the hand is whole, no blood, no injury."}
  - {id: img-ai-portrait-fenrir, card: monster-fenrir, system: norse, title: 芬里爾, characters: [fenrir], scene: "Match the earlier image of him: grey-brown shaggy fur, pale eyes. Fenrir alone, bound on a bare rocky island under a heavy sky: a thin, smooth, pale ribbon-like fetter (Gleipnir), no thicker than a silk band, winds around his neck, body and legs and runs to a great boulder sunk in the ground; it looks far too slight to hold him, yet it does. His jaws are propped wide open by a single upright sword, the hilt against the lower jaw and the point against the roof of the mouth, and a stream of slaver pours from his mouth and runs away over the rocks as a small river. He strains against the band, furious. No blood, no people, no heavy iron chains."}
  - {id: img-ai-portrait-jormungandr, card: monster-jormungandr, system: norse, title: 耶夢加得, characters: [jormungandr], scene: "Match the earlier image of it: dark blue-grey scales, a row of short spines along the back, a long narrow serpent head; no legs, no wings. A view from very high above a cold northern ocean: in the middle lies a green land of mountains and fjords, and all the way around it, in the deep water, runs the vast body of the Midgard Serpent in one great closed ring. In the near foreground its head rises from the waves and bites its own tail, closing the circle. Tiny longships near the coast show the scale. One serpent only, one head; no legs, no wings, not a dragon. Stormy light, white surf where the coils break the surface."}
  - {id: img-ai-portrait-yggdrasil, card: place-yggdrasil, system: norse, title: 世界樹, characters: [yggdrasil, three_norns], scene: "The whole world tree shown from the side like a cutaway view: its green crown high in the clouds, and below the ground THREE great roots reaching to three different springs. Beside the first root, at a clear well with white stones, the three Norns draw water. Under the second root lies a dark, still, deep spring. Under the third root, in cold mist, a dark dragon (Nidhogg) gnaws at the root beside a bubbling spring. One red squirrel runs up the trunk. Exactly three roots and three springs. No labels, no map of named worlds, no floating planets or spheres, no glowing runes."}
  - {id: img-ai-portrait-odin, card: god-odin, system: norse, title: 奧丁, characters: [odin_one_eye], scene: "Odin sits on a carved wooden high seat on a windy height that looks out over fjords and distant lands, seen from the knees up, his plain iron-headed spear upright in his right hand. His face is turned toward the viewer in clear three-quarter view and well lit so that the closed, scarred, empty RIGHT eye socket is obvious at a glance, while the single LEFT eye gazes far away. EXACTLY TWO ravens: one perched on his shoulder, one landing on the back of the seat. EXACTLY TWO grey wolves lie at his feet. Grey sky with a break of pale light. No other people; no horse. The face must show only one open eye."}
  - {id: img-ai-portrait-ymir, card: primordial-ymir, system: norse, title: 尤彌爾, characters: [ymir, audhumla], scene: "The beginning of the world in the great empty gap Ginnungagap: on the left, a wall of dark ice and freezing mist; on the right, a distant glow of fire and sparks; in the middle, where the frost is melting and dripping, Ymir sits half-risen from the ice, steam curling off him. Beside him stands the cow Audhumla, as big as he is. FOUR thin streams of white milk flow FROM THE COW'S UDDER across the ground toward Ymir, and he drinks from them. At the same time the cow bends her head down and licks a large block of salty ice lying on the ground at her front feet. The milk comes only from the cow, not from Ymir. No sun, no land, no sea, no trees, no buildings, no other figures."}
