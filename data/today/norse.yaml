  diff: 埃達裡的諸神黃昏，是神、巨人與怪物的最後一戰：奧丁被狼吞下，索爾殺了大蛇後倒下，世界被火燒毀。本站沒有查核電影的劇情，所以這裡只確認片名用了這個詞，不比較內容。
