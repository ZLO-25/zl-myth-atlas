- id: eris-dwarf-planet
  category: 天文與太空
  title: 矮行星鬩神星（Eris）
  cards: [story-judgement-of-paris]
  what: 矮行星 Eris（鬩神星），原名 2003 UB313，名字取自希臘的不和女神。2006 年 IAU 在布拉格開會決定命名，同一次會議也把冥王星、穀神星、鬩神星歸為矮行星；它的衛星 Dysnomia，是不和女神的女兒。
  diff: 神話裡，不和女神厄里斯因為沒被邀請參加婚禮，丟出一顆寫著「給最美的人」的金蘋果，三位女神都說蘋果是自己的，這就是「帕里斯的裁判」的開端。天文學家用她來命名這顆讓天文界吵了一架的天體。
  status: 已查證
  sources:
    - {cite: NASA 噴射推進實驗室「Hotly Debated Solar System Object Gets a Name」, url: 'https://www.jpl.nasa.gov/news/hotly-debated-solar-system-object-gets-a-name/'}
