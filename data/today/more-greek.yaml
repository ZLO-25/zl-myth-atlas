- id: sisyphean-word
  category: 英文單字與成語
  title: Sisyphean（永無止境、徒勞的）
  cards: [story-underworld-punishments]
  what: 英文形容詞 Sisyphean，意思是「像薛西弗斯那樣不斷重複卻徒勞無功的」，1630 年代就有。
  diff: 辭典寫道，薛西弗斯是科林斯國王，被稱為「最狡猾的人」。他死後受罰，要把一顆大石推上山，石頭又滾下來，永遠重來。「徒勞」是後來的比喻；神話的重點是懲罰他的狡猾。
