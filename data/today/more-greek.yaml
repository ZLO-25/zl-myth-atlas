- id: europa-clipper
  category: 天文與太空
  title: 歐羅巴快艇號（Europa Clipper）
  cards: [story-europa]
  what: NASA 的 Europa Clipper 在 2024 年 10 月 14 日由 SpaceX 獵鷹重型火箭發射，預計 2030 年抵達木星，目標是調查木衛二歐羅巴（Europa）是否有適合生命的環境。
  diff: 木衛二以宙斯愛上的腓尼基公主歐羅巴命名。神話裡她是被拐走的，今天她的名字卻成了科學探測的目標。
