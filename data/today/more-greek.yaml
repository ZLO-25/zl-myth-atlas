- id: delphic-word
  category: 英文單字與成語
  title: Delphic（神諭般的）
  cards: [place-delphi]
  what: 英文 Delphic 是「德爾斐的、阿波羅神諭的」，1590 年代就有。德爾斐（Delphi）這個地名來自希臘文 delphis「海豚」。
  diff: 辭典說，傳說阿波羅變成海豚來建立自己的神殿，所以才叫「海豚之地」。大英百科則說，德爾斐原本是蓋亞的神諭所，阿波羅殺死蟒蛇皮同後在此建立自己的神諭。
