- id: phaethon-asteroid
  category: 天文與太空
  title: 小行星 3200 Phaethon 與雙子座流星雨
  cards: [story-phaethon]
  what: 雙子座流星雨的源頭是小行星 3200 Phaethon，1983 年 10 月 11 日由紅外線天文衛星 IRAS 發現。NASA 說，因為它非常靠近太陽，所以用駕駛太陽神赫利俄斯戰車的神話人物命名。
  diff: 神話裡法厄同駕不住父親的太陽戰車，差點燒毀大地，被宙斯用雷霆擊落。天文上的 Phaethon，也是一顆離太陽很近的天體。
