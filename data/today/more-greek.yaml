- id: anouilh-antigone
  category: 文學
  title: 阿努伊《安蒂岡妮》
  cards: [hero-antigone]
  what: 法國劇作家阿努伊（Jean Anouilh）的《安蒂岡妮》寫於 1944 年，大英百科把它列為他最知名的作品之一。
  diff: 神話裡的安蒂岡妮，違抗舅舅克瑞翁禁止埋葬哥哥波呂涅克斯的命令，偷偷埋了他，結果被關進洞穴。現代劇作家把這個「一個人對抗權力」的故事一再搬上舞台。
