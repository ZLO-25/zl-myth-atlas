- id: pygmalion-effect
  category: 科學與醫學
  title: 畢馬龍效應（Pygmalion effect）
  cards: [story-pygmalion]
  what: 心理學的「畢馬龍效應」指一個人對另一個人的期待，會讓對方表現得越來越像期待的樣子。1968 年羅森塔爾與雅各布森的課堂研究：老師被告知某些學生是「即將開竅的學生」，其實是隨機挑的，年底這些學生的智商進步比對照組多。
  diff: 神話裡畢馬龍是雕刻家，他愛上自己刻的象牙少女像，女神讓雕像變成活人。心理學家借的是「相信會讓東西成真」的想法，沒有魔法。
  status: 已查證
  sources:
