- id: shaw-pygmalion
  category: 文學
  title: 蕭伯納《賣花女》與《窈窕淑女》
  cards: [story-pygmalion]
  what: 蕭伯納的劇本《Pygmalion》（中文常譯《賣花女》）1913 年在維也納以德語首演，1914 年在英國上演；語音學家希金斯打賭能把倫敦賣花女伊萊莎訓練成公爵夫人。1956 年改編成音樂劇《窈窕淑女》（My Fair Lady），1964 年電影由雷克斯．哈里森與奧黛麗．赫本主演。
  diff: 奧維德的故事裡，雕像靠女神的力量變成活人；蕭伯納把「創造者」換成教口音的語音學家，被改造的是一個活生生的女孩。
  status: 已查證
