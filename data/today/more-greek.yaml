- id: midas-touch
  category: 英文單字與成語
  title: Midas touch（點石成金的本事）
  cards: [story-midas]
  what: 英文說一個人有 the Midas touch，是指他做什麼生意都賺錢。韋氏辭典記錄 1813 年已有這個用法。
  diff: 辭典自己也提醒，今天的用法常常忽略故事的警告。奧維德的版本裡，邁達斯許願讓摸到的東西都變成金子，結果連食物和酒也變成金子，只好求神收回，最後到帕克托羅斯河把這個本事洗掉。「連女兒都變成金子」是後來作家加的情節。在神話裡，這是一個關於貪心的教訓，不是祝福。
  status: 已查證
  sources:
