- id: poussin-sabine-women
  category: 名畫與雕塑
  title: 普桑〈劫奪薩賓婦女〉
  cards: [story-sabine-women]
  what: 紐約大都會藝術博物館藏有法國畫家普桑的〈劫奪薩賓婦女〉（約 1633 至 34 年）。館方說明：羅馬人邀請鄰近的薩賓人參加慶典，打算強行擄走他們的女人當妻子。
  diff: 館方說，羅穆路斯舉起斗篷作為暗號，戰士們就動手抓人。畫家把最緊張的那一瞬間凍結在畫面裡；大英百科說這是普魯塔克記下的傳說：羅穆路斯邀請薩賓人赴宴，然後把他們的女人擄走。
