- id: augean-word
  category: 英文單字與成語
  title: Augean stables（奧吉亞斯的牛棚）
  cards: [story-heracles-labours]
  what: 英文 Augean 是「骯髒透頂的」，1590 年代就有。它來自海克力斯十二功績之一：國王奧吉亞斯有 3,000 頭牛，牛棚 30 年沒打掃。
  diff: 辭典說，海克力斯把阿爾斐俄斯河改道，一天就沖乾淨了牛棚。所以 clean the Augean stables 指「清理積壓已久的爛攤子」。
