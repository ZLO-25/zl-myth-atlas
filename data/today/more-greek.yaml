- id: euro-europa
  category: 英文單字與成語
  title: Europe（歐洲）與歐元鈔票上的歐羅巴
  cards: [story-europa]
  what: 歐洲央行說，歐元的「歐羅巴系列」鈔票以神話人物歐羅巴命名，她是歐洲大陸名字的由來。她的肖像取自一只古代陶瓶，用在鈔票的浮水印和全像圖上。
  diff: 神話裡的歐羅巴是腓尼基公主，被化身為白牛的宙斯拐到克里特島。今天的「歐洲」之名只是借用她的名字，和她的遭遇無關。
