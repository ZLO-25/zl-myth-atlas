- id: medea-adaptations
  category: 文學
  title: 〈美狄亞〉的歌劇與戲劇改編
  cards: [hero-medea]
  what: 1797 年，作曲家凱魯比尼的歌劇《美狄亞》（Médée）在巴黎首演，改編自希臘神話。大英百科也列出塞內加、格里帕策、阿努伊、米堯等人的改編。
  diff: 在歐里庇得斯的劇本裡，美狄亞被伊阿宋拋棄後，為了報復殺死兩個兒子、克瑞翁和他的女兒，最後坐著祖父赫利俄斯送來的龍車逃走。後世的改編各有取捨。
