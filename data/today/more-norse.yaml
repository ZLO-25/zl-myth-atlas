- id: weird-word
  category: 英文單字與成語
  title: 英文 weird（怪異）
  cards: [god-norns]
  what: 英文 weird 的老祖宗是古英語 wyrd，意思是「命運」。詞源字典說，wyrd 和古諾斯語 urðr（意思是「命運、三位諾恩之一」）出自同一個原始日耳曼語字根。現代「怪異」的意思，是從「weird sisters」（命運三女神）這個說法發展出來的。
  diff: 在埃達裡，諾恩是掌管命運的女性，〈女先知的預言〉說有三位：烏爾德、薇兒丹蒂、詩寇蒂。烏爾德（Urðr）的名字就是這個字根。weird 後來變成「怪」，是英文自己的演變，神話裡沒有這個意思。
  status: 已查證
  sources:
    - {cite: Online Etymology Dictionary「weird」, url: 'https://www.etymonline.com/word/weird', accessed: '2026-11-21'}
    - {cite: 《詩體埃達》〈女先知的預言〉第 19–20 節（Bellows 英譯）, url: 'https://www.gutenberg.org/ebooks/73533'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 15–16 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning11-20.htm'}
- id: brag-bragi
  category: 英文單字與成語
  title: 英文 brag 與布拉基
  cards: [god-bragi]
  what: 有人把英文 brag（吹牛）和詩神布拉基連在一起。
  diff: 詞源字典說，brag 的來源不明；別的資料提出古諾斯語 bragr，意思是「最好的、（某物的）精華」，也有「詩」的意思。條目沒有提到布拉基。卡片寫的是：斯諾里說布拉基最懂得作詩，北歐人把詩叫做 bragr。所以「詩」這個詞和神的名字相近是有根據的，但 brag 是不是來自它，並沒有定論。
  status: 說法未證實
  sources:
    - {cite: Online Etymology Dictionary「brag」, url: 'https://www.etymonline.com/word/brag', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 26 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning21-30.htm'}
- id: rune-word
  category: 英文單字與成語
  title: 英文 rune（盧恩）
  cards: [story-odin-runes]
  what: 英文 rune 來自古英語 run，意思是「祕密、奧祕、神祕的話」，也可以指「盧恩字母」。詞源字典說，它和古諾斯語、古高地德語、哥德語的同源字出自同一個原始日耳曼語字根，也是日耳曼與凱爾特語裡許多魔法用語的來源。
  diff: 在〈高人的箴言〉裡，奧丁吊在風吹的樹上九夜，被矛刺傷，叫喊著拾起盧恩，然後開始興盛、得到智慧。詞源字典只講字的來歷，沒有講這個故事；字義裡的「祕密」和故事裡「得來不易的知識」很搭，但這是我們的聯想，不是字典的說法。
  status: 已查證
  sources:
    - {cite: Online Etymology Dictionary「rune」, url: 'https://www.etymonline.com/word/rune', accessed: '2026-11-21'}
    - {cite: 《詩體埃達》〈高人的箴言〉第 139–146 節與 Bellows 註解（Bellows 英譯）, url: 'https://www.gutenberg.org/ebooks/73533'}
- id: bluetooth-logo
  category: 品牌與企業
  title: 藍牙（Bluetooth）的標誌
  cards: [story-odin-runes]
  what: 藍牙官網說，Bluetooth 標誌是一個「結合字」（bind rune）：把年輕弗薩克（Younger Futhark）裡的兩個盧恩字母 Hagall（ᚼ）與 Bjarkan（ᛒ）疊在一起，它們是哈拉爾國王名字的縮寫。
  diff: 標誌用的是盧恩字母，字母的主人是國王哈拉爾，和奧丁沒有關係。神話裡的盧恩，是奧丁吊在樹上九夜之後拾起來的文字；這個標誌只是用了同一套字母，故事沒有跟著過來。
  status: 已查證
  sources:
    - {cite: 藍牙技術聯盟官網「Bluetooth Origin」, url: 'https://www.bluetooth.com/about-us/bluetooth-origin/', accessed: '2026-11-21'}
    - {cite: 《詩體埃達》〈高人的箴言〉第 139–146 節與 Bellows 註解（Bellows 英譯）, url: 'https://www.gutenberg.org/ebooks/73533'}
- id: mead-word
  category: 英文單字與成語
  title: 英文 mead（蜂蜜酒）
  cards: [story-mead-of-poetry]
  what: 英文 mead 指用蜂蜜和水發酵的烈酒。詞源字典說，它來自古英語 medu，往上追到原始印歐語字根 *medhu-，意思是「蜂蜜、甜的飲料」，希臘語的「酒」也是親戚。
  diff: 神話裡的「詩之蜜酒」不是普通的蜜酒：卡片說，智者克瓦希爾的血混了蜂蜜，變成喝了就成為詩人或學者的酒，後來被奧丁用計喝光。詞源字典只講字的來歷，沒有提這個故事。
  status: 已查證
  sources:
    - {cite: Online Etymology Dictionary「mead」, url: 'https://www.etymonline.com/word/mead', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈詩語法〉第 5–6 節（Brodeur 英譯）, url: 'https://www.voluspa.org/skaldskaparmal1-10.htm'}
- id: asgard-archaea
  category: 科學與醫學
  title: 阿斯嘉古菌（Asgard archaea）
  cards: [god-heimdall, story-baldr-death]
  what: 一群和真核生物（動物、植物都屬於真核生物）關係很近的微生物，叫阿斯嘉古菌。《科學新聞》說，整個類群「以北歐神話裡眾神的家命名」；其中的洛基古菌取名自「洛基之堡」熱泉，海姆達爾古菌「以北歐眾神的哨兵命名」，Hodarchaeales「以奧丁的盲眼兒子霍德爾命名」。
  diff: 神話裡的海姆達爾是守在彩虹橋旁的眾神守衛，睡得比鳥少，看得見一百里外；霍德爾則是被洛基引導、用槲寄生射死巴德爾的盲眼神。微生物只是借用名字，和這些故事無關。
  status: 已查證
  sources:
    - {cite: 《科學新聞》「How these strange cells may explain the origin of complex life」, url: 'https://www.sciencenews.org/article/cells-origin-of-life-asgard-archaea', accessed: '2026-11-21'}
