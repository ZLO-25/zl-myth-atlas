- id: marvel-heimdall
  category: 電影、影集、遊戲
  title: 漫威的海姆達爾
  cards: [god-heimdall, place-nine-worlds]
  what: 漫威官方角色頁寫：「海姆達爾掌管彩虹橋（Bifrost），守護九界之間的通道。」
  diff: 神話裡的海姆達爾也是守在彩虹橋畢弗羅斯特旁的眾神守衛，這一點對得上。但「九界」要小心：〈女先知的預言〉第 2 節只說「九個世界」，沒有列名字；斯諾里也沒有給完整名單，常見的九界名單是後人整理的。漫威的說法是自己的設定。
  status: 已查證
  sources:
    - {cite: 漫威官方角色頁「Heimdall」, url: 'https://www.marvel.com/characters/heimdall', accessed: '2026-11-21'}
