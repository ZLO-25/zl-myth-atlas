# 今日影子：北歐神話補充（今天這一邊的來源 2026-11-21 逐一打開確認；神話那一邊只用卡片與來源包已有的內容）
- id: valhalla-word
  category: 英文單字與成語
  title: 英文 Valhalla
  cards: [place-valhalla]
  what: 英文 Valhalla 來自古諾斯語 Valhöll，意思是「戰死者的大廳」。詞源字典說，1845 年起英文也用它指「享有極大榮耀的地方」。
  diff: 詞源字典把神話裡的 Valhalla 說成奧丁接待戰死英雄的大廳。卡片說，不是所有死者都來這裡：芙蕾雅的弗爾克范格分走一半戰死者，病死老死的人歸赫爾。英文裡的「榮耀之地」是後來才有的引申義。
  status: 已查證
  sources:
    - {cite: Online Etymology Dictionary「Valhalla」, url: 'https://www.etymonline.com/word/Valhalla', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 20、24、36 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning11-20.htm'}
- id: assassins-creed-valhalla
  category: 電影、影集、遊戲
  title: 遊戲《刺客教條：維京紀元》
  cards: [place-valhalla]
  what: 育碧的遊戲《刺客教條：維京紀元》（Assassin's Creed Valhalla）官方頁說，玩家扮演維京突襲者艾沃（Eivor），帶領族人從挪威到 9 世紀的英格蘭，目標是贏得榮耀、「在 Valhalla 有一席之地」。
  diff: 神話裡的 Valhalla 是奧丁的大廳，收的是戰死的戰士，英靈戰士每天打鬥再宴飲。本站沒有查核遊戲的劇情，所以這裡只確認遊戲的名字和官方宣傳用了這個詞，不比較內容。
  status: 已查證
  sources:
    - {cite: 育碧官方遊戲頁《Assassin's Creed Valhalla》, url: 'https://www.ubisoft.com/en-us/game/assassins-creed/valhalla', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 36、39、41 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning31-40.htm'}
- id: valkyrie-word
  category: 英文單字與成語
  title: 英文 Valkyrie
  cards: [god-valkyries]
  what: 英文 Valkyrie 來自古諾斯語 valkyrja，字面是「挑選戰死者的人」。詞源字典說，英文在 1768 年有這個字，德語 Walküre 也是借自北歐語。
  diff: 在埃達裡，女武神是替奧丁把戰死者帶到英靈殿的女性，也在英靈殿斟酒。〈格里姆尼爾之歌〉和〈女先知的預言〉各列出一串女武神的名字，兩份名單不同。詞源字典只講字的來歷，沒有講這些故事。
  status: 已查證
  sources:
    - {cite: Online Etymology Dictionary「Valkyrie」, url: 'https://www.etymonline.com/word/Valkyrie', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 36 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning31-40.htm'}
- id: wagner-die-walkure
  category: 文學
  title: 華格納的歌劇《女武神》
  cards: [god-valkyries]
  what: 華格納的歌劇《女武神》（Die Walküre）是他的「指環」系列（Ring cycle）四部歌劇之一，大英百科列出的順序是《萊茵的黃金》《女武神》《齊格飛》《諸神的黃昏》。
  diff: 本站只確認歌劇的名字用了「女武神」這個詞，沒有查核劇情，所以不比較內容。神話這邊，卡片說英雄傳說裡的布倫希爾德被稱為女武神，她違背奧丁的意思，被奧丁用睡眠刺扎得沉睡不醒。
  status: 已查證
  sources:
    - {cite: 大英百科全書「Die Walküre」, url: 'https://www.britannica.com/topic/Die-Walkure', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 49 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning41-50.htm'}
    - {cite: 《詩體埃達》〈法夫尼爾之歌〉第 44 節註解與〈西格德莉法之歌〉第 4 節後的散文（Bellows 英譯）, url: 'https://www.gutenberg.org/ebooks/73533'}
- id: saturn-ymir-moon
  category: 天文與太空
  title: 土星衛星尤彌爾（Ymir）與貝格爾米爾（Bergelmir）
  cards: [primordial-ymir, story-norse-creation]
  what: 土星有兩顆衛星以創世故事的巨人命名。NASA 說，Ymir 是「北歐神話裡第一個活著的存在、霜巨人的始祖」；Bergelmir 則是「和妻子一起逃過尤彌爾血洪水的霜巨人」。兩顆都屬於 NASA 說的「北歐群」，是繞行方向和土星自轉相反的不規則衛星。
  diff: 這兩個名字在神話裡確實是同一個故事：卡片說，包爾的兒子殺了尤彌爾，血淹死霜巨人，只有貝格爾米爾一家搭「船」（原文是磨坊箱）逃走。NASA 頁面把包爾的兒子寫成「奧丁和他的兄弟」，卡片寫的是「包爾的兒子們」，兩者相符。衛星只是借用名字，和故事沒有別的關係。
  status: 已查證
  sources:
    - {cite: NASA 科學頁「Ymir」, url: 'https://science.nasa.gov/saturn/moons/ymir/', accessed: '2026-11-21'}
    - {cite: NASA 科學頁「Bergelmir」, url: 'https://science.nasa.gov/saturn/moons/bergelmir/', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 5–7 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning1-10.htm'}
- id: saturn-fenrir-moon
  category: 天文與太空
  title: 土星衛星芬里爾（Fenrir）
  cards: [monster-fenrir]
  what: 土星有一顆衛星叫 Fenrir（原編號 S/2004 S16）。NASA 說，名字來自北歐神話裡的巨狼，牠是洛基和女巨人的孩子，被眾神綁住，諸神黃昏時會掙脫並殺死奧丁。這顆衛星屬於北歐群，繞行方向和土星自轉相反。
  diff: 卡片寫的是：洛基與女巨人安格爾波達之子，被格萊普尼爾綁住，諸神黃昏時掙脫、吞下奧丁。NASA 頁面的概述大致相符，但沒有提到提爾的手，也沒有提到狼最後怎麼死。衛星只是借用名字。
  status: 已查證
  sources:
    - {cite: NASA 科學頁「Fenrir」, url: 'https://science.nasa.gov/saturn/moons/fenrir/', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 34、51 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning31-40.htm'}
- id: saturn-giant-moons
  category: 天文與太空
  title: 土星衛星貝絲特拉（Bestla）與埃吉爾（Aegir）
  cards: [monster-jotnar]
  what: 土星的北歐群衛星用北歐巨人命名。NASA 說，Bestla 是「巨人女兒、奧丁的母親」；Aegir 是「象徵海洋的巨人」。
  diff: 這兩個說法和卡片對得上的部分是：奧丁的母親貝絲特拉是巨人的女兒。埃吉爾是巨人，卡片也這麼說，但卡片同時指出，〈詩語法〉把他寫成住在島上的巫師，Bellows 註解則稱他為「海神」，古書對他的身分說法不一。
  status: 已查證
  sources:
    - {cite: NASA 科學頁「Bestla」, url: 'https://science.nasa.gov/saturn/moons/bestla/', accessed: '2026-11-21'}
    - {cite: NASA 科學頁「Aegir」, url: 'https://science.nasa.gov/saturn/moons/aegir/', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈欺騙古魯菲〉第 6 章（Brodeur 英譯）, url: 'https://www.voluspa.org/gylfaginning1-10.htm'}
- id: aegir-ran-exoplanet
  category: 天文與太空
  title: 恆星瀾（Ran）與行星埃吉爾（AEgir）
  cards: [god-aegir]
  what: 天文學會 IAU 的系外行星命名活動，把天空中的恆星 epsilon Eridani 取名 Ran，它的行星 epsilon Eridani b 取名 AEgir。日本國立天文台公布的最終名單把兩個名字並列。
  diff: 在神話裡，Aegir 與 Rán 是一對夫妻：埃吉爾替眾神辦酒宴，妻子瀾有一張網專門撈海上的人。這份名單沒有寫命名理由，所以這裡只確認名字的組合，不說明為什麼這樣選。
  status: 已查證
  sources:
    - {cite: 日本國立天文台「Final Results of NameExoWorlds Public Vote Released」, url: 'https://www.nao.ac.jp/en/news/topics/2015/20151218-nameexoworlds.html', accessed: '2026-11-21'}
    - {cite: 斯諾里《散文埃達》〈詩語法〉第 1 章與第 41 章（Brodeur 英譯）, url: 'https://www.voluspa.org/skaldskaparmal41-50.htm'}
- id: idunn-mons-venus
  category: 天文與太空
  title: 金星的伊登山（Idunn Mons）
  cards: [god-idun, story-idun-apples]
  what: 金星上有一座山叫 Idunn Mons。美國地質調查局的行星命名資料庫說，名字的由來是「北歐女神」，國際天文學聯合會 1994 年通過。
  diff: 資料庫只說她是北歐女神，沒有提蘋果。神話這邊，卡片說伊登保管讓眾神不會變老的蘋果，洛基的詭計害她被巨人夏濟擄走，眾神立刻開始變老。
  status: 已查證
  sources:
    - {cite: 美國地質調查局行星命名資料庫「Idunn Mons」, url: 'https://planetarynames.wr.usgs.gov/Feature/2653', accessed: '2026-11-21'}
