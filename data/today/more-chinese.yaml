  title: 南極崑崙站
  cards: [place-kunlun]
  what: 中國極地研究中心說，南極崑崙站是中國第一座南極內陸夏季科學考察站，2009 年 1 月 27 日建成，位在南極內陸冰蓋最高處的冰穹 A（Dome A）一帶，海拔 4087 公尺，離中山站直線距離 1260 公里。
  diff: 頁面沒有說明為什麼叫「崑崙」。本站崑崙卡說，神話裡的崑崙是天帝在人間的都城，今天地圖上的崑崙山脈則是漢武帝依古書替河源之山命的名；「南極站取名來自崑崙」只是合理的聯想，所以本條標示為說法未證實。
