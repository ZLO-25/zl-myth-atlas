- id: electro-third-prince
  category: 台灣生活
  title: 電音三太子
  cards: [god-nezha]
  what: 國家文化記憶庫說，電音三太子是把「三太子」的民俗形象、戰舞和電子音樂結合起來的表演，把三太子從廟會陣頭搬上舞台、當成藝術表演；最早源自嘉義朴子太子會，由熱舞社的大學生把三太子和戰舞結合，被外國媒體報導後一炮而紅。
  diff: 這份資料只講表演形式，沒有說三太子是哪位神明。本站哪吒卡說，台灣廟裡的「太子爺」「中壇元帥」就是哪吒；《封神演義》裡的哪吒是剔骨還父、蓮花化身的少年，電音三太子則是跳舞的藝陣，兩者只共用同一位神明的形象。
