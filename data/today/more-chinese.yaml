- id: tiangong-birthday-hsinchu
  category: 台灣生活
  title: 天公生（正月初九）
  cards: [god-jade-emperor]
  what: 中央社發布的新竹市政府新聞稿說，2025 年 2 月 6 日是農曆正月初九，也就是玉皇大帝聖誕、民間所說的「天公生」；代理市長和民政處長到新竹的天公壇與富美宮上香，祈求「風調雨順、國泰民安」。
  diff: 《三教源流搜神大全》引《宋真宗實錄》說，宋代朝廷才正式替玉皇上聖號；《西遊記》裡的玉帝則坐在靈霄寶殿被孫悟空鬧事。今天台灣人叫他「天公」，在他生日當天由官員與信徒一起上香祈福，是把這位天庭之主變成地方的守護對象。這份新聞稿是市府發布的稿子，不是對信仰歷史的研究。
