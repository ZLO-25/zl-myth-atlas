- id: cangjie-input-method
  category: 科學與醫學
  title: 倉頡輸入法
  cards: [hero-cangjie]
  what: 台灣常用的中文輸入法「倉頡」，依 ecj.hk 的介紹，是朱邦復在 1976 年創製的：把漢字拆成少量字形部件，完成後「以傳說中的造字者命名為倉頡」。這個網站是民間整理的資料，不是官方文件，所以本條只採它說的創製人、年份與命名由來。
  diff: 傳說裡倉頡造字時「天雨粟，鬼夜哭」；這套輸入法只是借用他的名字，拆字的方法是現代人設計的。同一頁也提醒，歷史學者認為漢字是長時間慢慢發展的，不是一個人造出來的。
