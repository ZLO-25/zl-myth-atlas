  title: 台灣的神農大帝廟
  cards: [god-shennong]
  what: 內政部「宗教知識＋」說，神農大帝的生日是農曆四月二十六日，各地廟宇常在這天舉辦慶典，有些成為地方大事；台灣很早就有信仰，臺南有一座 1646 年建的廟至今還在，1918 年約有六十座神農廟，現在估計約 150 座。頁面也說他是文化神、農業神也是醫藥神，許多中藥商把他當作守護神。
  diff: 《淮南子·脩務訓》把神農寫成教人種田、嘗百草的人；台灣的信仰把這兩個身分接起來，農民和藥商各自把他當成自己行業的守護神。頁面說的年代與數量是內政部的整理，不是對每座廟的逐一統計。
  status: 已查證
