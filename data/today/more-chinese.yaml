- id: nasu-sesshoseki
  category: 台灣生活
  title: 日本那須的殺生石與九尾狐
  cards: [beast-ninetail-fox]
  what: 日本栃木縣那須町的官方頁面說，殺生石是「白面金毛九尾狐」傳說的地點：九尾狐從天竺（印度）、唐（中國）飛來，變成美女玉藻前，成為鳥羽院的愛妃；被陰陽師識破後逃到那須野，被追殺後身體變成會冒毒氣的石頭，後來源翁和尚一喝，石頭裂成三塊。這處地點在 2014 年被指定為日本國家史跡。
  diff: 頁面說這個故事以平安時代為背景，但文獻上最早出現在 1445 年（室町時代）的《下學集》。《山海經》裡的九尾狐是青丘山上叫聲像嬰兒、會吃人的野獸，人吃了牠的肉就不會被妖邪迷惑；變成美女迷惑君王，是後來傳說才加上的。
  status: 已查證
  sources:
