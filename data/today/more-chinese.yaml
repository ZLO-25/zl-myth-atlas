- id: wenchang-exam-prayer
  category: 台灣生活
  title: 考前拜文昌帝君
  cards: [god-wenchang]
  what: 內政部移民署「新住民全球新聞網」2024 年學測前的一篇生活指南說，文昌帝君（也叫梓潼帝君、文昌公）是「主掌考試、功名與升遷的神明」，考生到廟裡祭拜時，要報上姓名、生日、地址和考試名稱、考場、准考證號碼；文章列出台北市文昌宮、新莊文昌祠、桃園文昌宮、新竹文林閣、苗栗文昌祠，並強調成績還是要靠自己準備。這是民間習慣的介紹文章，不是官方規定。
  diff: 「文昌」本來是天上斗魁旁的六顆星，「梓潼神」本來是四川的地方神，兩者合起來才成為文昌帝君；南宋《夢粱錄》已經記載二月初三是梓潼帝君誕辰。今天的新做法是考生帶准考證影本去廟裡報考試資訊，這是古書裡沒有的。
  status: 已查證
  sources:
