# 今日影子：中華神話在成語與日常用語裡的痕跡（補寫）
- id: idiom-yugong-yishan
  category: 英文單字與成語
  title: 愚公移山
  cards: [story-yugong]
  what: 教育部《成語典》說，「愚公移山」是說愚公為了門前兩座大山擋路，帶著子孫一起挖土石、把山鏟平；現在用來比喻只要持續努力，終究能達成目標。辭典也提醒，這個成語有時反過來嘲笑做事方法太沒效率。故事出自《列子·湯問》。
  diff: 《列子》裡的愚公說「子子孫孫無窮匱也，而山不加增」，最後是天帝被他感動，派神把山背走。今天的成語多半只留下「堅持就會成功」這一層，很少人再提天帝出手幫忙這一段。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「愚公移山」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=267&webMd=1&la=1', accessed: '2026-11-21'}
    - {cite: 《列子·湯問》, url: 'https://zh.wikisource.org/wiki/列子/湯問篇'}
- id: idiom-nuwa-butian
  category: 英文單字與成語
  title: 女媧補天
  cards: [primordial-nuwa, story-nuwa-mends-sky]
  what: 教育部《成語典》收有「女媧補天」，解釋是傳說上古時代女媧煉五色石補天的裂縫，又截下大龜（鰲）的腳當撐天的柱子，今天用來形容修復巨大災難的神話壯舉；辭典標明典故見《淮南子·覽冥》。
  diff: 成語只留下「補天」這件事。《淮南子》裡補天和共工撞不周山是分開的兩段，今天常聽到「共工撞斷天柱，女媧才補天」，是後來才串在一起的說法。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「女媧補天」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=26060&webMd=2&la=1', accessed: '2026-11-21'}
    - {cite: 《淮南子·覽冥訓》（西漢）, url: 'https://zh.wikisource.org/wiki/淮南子/覽冥訓'}
- id: idiom-kaitian-pidi
  category: 英文單字與成語
  title: 開天闢地
  cards: [primordial-pangu]
  what: 教育部《成語典》解釋「開天闢地」有兩層意思：字面上是天地初開，辭典註明「神話傳說中天地是由盤古所分開」；引申則是形容前所未有的創舉，辭典舉的例子是說詹天佑在中國鐵路工程上「開天闢地」。
  diff: 盤古故事（見三國吳徐整《三五曆紀》）說天地像雞蛋混在一起，盤古在裡面長高，把天推高、地壓厚。成語的第二層意思和盤古已經沒有關係，只借用「從無到有」的氣勢。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「開天闢地」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=8058&webMd=1&la=1', accessed: '2026-11-21'}
    - {cite: 徐整《三五曆紀》（三國吳），見歐陽詢《藝文類聚》卷1〈天部上〉, url: 'https://zh.wikisource.org/wiki/%E8%97%9D%E6%96%87%E9%A1%9E%E8%81%9A/%E5%8D%B7001'}
- id: idiom-san-guo-qi-men
  category: 英文單字與成語
  title: 三過其門而不入
  cards: [hero-yu, story-yu-flood]
  what: 教育部《成語典》說，這個成語指的是大禹治水時，好幾次經過自己家門都沒有進去，用來稱讚人把公事放在私事前面、做事勤奮。辭典引的原句是《孟子·離婁下》的「禹、稷當平世，三過其門而不入，孔子賢之」。
  diff: 各書對禹在外幾年說法不同：《孟子·滕文公上》說「八年於外，三過其門而不入」，《史記》說十三年，《吳越春秋》說七年。今天成語只留下「過門不入」的精神。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「三過其門而不入」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=19033&webMd=2&la=1', accessed: '2026-11-21'}
    - {cite: 《孟子·滕文公上》, url: 'https://zh.wikisource.org/wiki/孟子/滕文公上'}
- id: idiom-baxian-guohai
  category: 英文單字與成語
  title: 八仙過海，各顯神通
  cards: [god-eight-immortals]
  what: 教育部《成語典》說，這個成語出自八位仙人（如漢鍾離、張果老）各自用寶物渡海的傳說，今天比喻大家各用自己的本事達成目標；辭典的例句是大家各憑方法去爭取績效獎金。
  diff: 明代《東遊記》第四十八回裡，是呂洞賓提議「試以一物投之水面，各顯神通而過」，後來還發生藍采和被龍王太子抓走的衝突。今天的成語只用到「各憑本事」，不管龍王和打架。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「八仙過海，各顯神通」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=25879&webMd=2&la=1', accessed: '2026-11-21'}
    - {cite: 吳元泰《東遊記》第四十八回「八仙東遊過海」（明）, url: 'https://zh.wikisource.org/wiki/東遊記/第48回'}
- id: idiom-hualong-dianjing
  category: 英文單字與成語
  title: 畫龍點睛
  cards: [beast-dragon, beast-fenghuang]
  what: 教育部《成語典》說，「畫龍點睛」比喻畫畫或寫文章時，在最重要的地方加上一筆，讓整體變得生動傳神。辭典引《拾遺記》：秦始皇時有位巧匠把龍和鳳畫得像要飛起來，卻從不點眼睛，因為據說點了眼睛就會飛走；又引唐代《歷代名畫記》，張僧繇畫了四條龍，點上兩條的眼睛後，那兩條就雷電交加、破壁飛去。
  diff: 這裡的龍是「畫出來的龍」，故事的重點是畫家的功力，不是龍管不管雨。神話裡的龍（如《山海經》的應龍）則是會蓄水、能打仗的神獸。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「畫龍點睛」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=382&webMd=1&la=1', accessed: '2026-11-21'}
    - {cite: 《山海經·大荒北經》, url: 'https://zh.wikisource.org/wiki/山海經/大荒北經'}
- id: idiom-yegong-haolong
  category: 英文單字與成語
  title: 葉公好龍
  cards: [beast-dragon]
  what: 教育部《成語典》說，「葉公好龍」比喻表面上喜歡某樣東西，其實只是似是而非、表裡不一。故事來自《莊子》逸文：葉公愛龍，家裡到處畫著龍；真龍來訪時，他卻嚇得逃走。原句是「葉公非好龍也，好夫似龍而非龍也」。
  diff: 故事把龍寫成真的會降臨人間的神獸，重點卻是在諷刺人言行不一，並不是在談龍本身。辭典也註明這則故事不在今本《莊子》裡，是靠《太平御覽》保存下來的。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「葉公好龍」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=486&webMd=2&la=1', accessed: '2026-11-21'}
    - {cite: 《山海經·大荒北經》, url: 'https://zh.wikisource.org/wiki/山海經/大荒北經'}
- id: idiom-longfeng-chengxiang
  category: 英文單字與成語
  title: 龍鳳呈祥
  cards: [beast-dragon, beast-fenghuang]
  what: 教育部《成語典》說，「龍鳳呈祥」是吉祥話，指富貴吉利的徵兆或喜慶場合；辭典引清代小說《兒女英雄傳》第二十八回，說新郎當天特別風流俊俏，「這大約就叫作龍鳳呈祥了」。
  diff: 龍和鳳在神話裡各是獨立的神獸：《山海經》的鳳皇像雞、羽毛五彩，龍則與雨水有關。把兩者湊成一對祝賀新婚的吉祥話，是後來才有的用法。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「龍鳳呈祥」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=11438&webMd=1&la=1', accessed: '2026-11-21'}
    - {cite: 《山海經·南山經》, url: 'https://zh.wikisource.org/wiki/山海經/南山經'}
- id: idiom-fengmao-linjiao
  category: 英文單字與成語
  title: 鳳毛麟角
  cards: [beast-fenghuang, beast-qilin]
  what: 教育部《成語典》說，「鳳毛麟角」比喻稀罕珍貴的人或東西；辭典說它是兩個詞後來合在一起：「鳳毛」出自《世說新語·容止》，「麟角」出自魏國蔣濟〈萬機論〉的「學者如牛毛，成者如鱗角」。
  diff: 鳳凰和麒麟在古書裡都是只在太平盛世才現身的瑞獸，很難見到，這正是成語「稀罕」的來源。《左傳》記魯哀公十四年有人獵到麟，孔子看了很傷心。成語只取「難得一見」，沒有故事裡的傷感。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「鳳毛麟角」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=476&webMd=2&la=1', accessed: '2026-11-21'}
    - {cite: 《左傳·哀公十四年》（據《春秋左傳事類始末》四庫全書本卷五所錄）, url: 'https://zh.wikisource.org/wiki/春秋左傳事類始末_(四庫全書本)/卷5'}
- id: idiom-wangyang-xingtan
  category: 英文單字與成語
  title: 望洋興嘆
  cards: [god-hebo]
  what: 教育部《成語典》說，「望洋興嘆」原本是仰望廣大的海洋而感嘆，後來用來表示面對事情無能為力。辭典標明典故出自《莊子·秋水》，並註解「河伯：古代傳說中的黃河水神」。
  diff: 《莊子·秋水》裡的河伯本來「欣然自喜」，以為天下的美都在自己這裡，走到北海才驚覺自己的渺小。成語後來偏向「無能為力」，原來「見到大的才知道自己小」這層意思反而淡了。
  status: 已查證
  sources:
    - {cite: 教育部《成語典》「望洋興嘆」, url: 'https://dict.idioms.moe.edu.tw/idiomView.jsp?ID=918&webMd=2&la=1', accessed: '2026-11-21'}
    - {cite: 《莊子·秋水》（戰國）, url: 'https://zh.wikisource.org/wiki/莊子/秋水'}
- id: taotie-bronze-motif
  category: 名畫與雕塑
  title: 青銅器上的饕餮紋
  cards: [monster-four-fiends]
  what: 大英百科說，「饕餮」（貪吃者）這個名字至遲在西元前三世紀就用來稱呼青銅器上的獸面紋，大概因為牠看起來像一直在吞食的野獸；這種紋飾在商代和西周早期最常見，出現在祭祀用的青銅器上。
  diff: 《左傳》裡的饕餮原本是一個壞家族的名字，後來才被《山海經》《神異經》寫成吃人的怪獸；青銅器上的紋飾比這些名字早很多，是後人借用「饕餮」這個名字稱呼它。
  status: 已查證
  sources:
    - {cite: 大英百科「taotie」, url: 'https://www.britannica.com/art/taotie', accessed: '2026-11-21'}
    - {cite: 《左傳·文公十八年》（據《春秋左傳事類始末》四庫全書本卷一所錄）, url: 'https://zh.wikisource.org/wiki/春秋左傳事類始末_(四庫全書本)/卷1'}
- id: kirin-beer-qilin
  category: 品牌與企業
  title: 麒麟啤酒（Kirin）與聖獸麒麟
  cards: [beast-qilin]
  what: 日本麒麟啤酒（Kirin）官方網站說，標籤上的「聖獸麒麟」是集團的象徵，被當成會替人帶來幸福的生物；這個圖案最早出現在 1888 年的「キリンビール」標籤上，據說是荘田平五郎提議：既然東方有麒麟這種聖獸，就拿來當商標。網站還說，日語的「キリン」也是長頸鹿的名字，1907 年上野動物園迎來長頸鹿時才取了這個名。
  diff: 網站說麒麟是中國自古相傳、會在喜事前出現的「仁獸」。本站的麒麟卡說，古書裡的麟只在聖人在世、天下太平時現身，明代永樂十二年孟加拉國王獻上的長頸鹿，朝廷也把牠當成麒麟。啤酒標籤取的是「吉祥」這一層，和古書裡「麟出現、孔子傷心」那一段無關。
  status: 已查證
  sources:
    - {cite: 'キリン「キリングループの歴史：ラベルに描かれた「聖獣麒麟」とは？」（キリンジャーナル，2025-03-24）', url: 'https://www.kirin.co.jp/journal/others/stories/20250324_01/', accessed: '2026-11-21'}
    - {cite: 《禮記·禮運》（四靈：麟、鳳、龜、龍）, url: 'https://zh.wikisource.org/wiki/禮記/禮運'}
- id: wukong-dampe-satellite
  category: 天文與太空
  title: 悟空號暗物質粒子探測衛星
  cards: [hero-sun-wukong, story-journey-west]
  what: 中新網報導，2015 年 12 月 16 日在酒泉公布，中國的暗物質粒子探測衛星命名為「悟空」。中國科學院國家空間科學中心說，名字有「領悟、探索太空」的意思；研究人員還說孫悟空的火眼金睛，就像衛星上的探測器，能在太空裡認出暗物質的蹤跡。
  diff: 《西遊記》裡的孫悟空學會七十二變和觔斗雲、大鬧天宮，衛星則是一台偵測暗物質粒子的儀器；兩者只共用「看穿」這個比喻。報導說名字也有提高大眾對空間科學的興趣、鼓勵青少年探索未知的用意。
  status: 已查證
  sources:
    - {cite: 中新網〈中國暗物質粒子探測衛星命名「悟空」〉（2015-12-16）, url: 'https://www.chinanews.com.cn/m/gn/2015/12-16/7674365.shtml', accessed: '2026-11-21'}
    - {cite: 吳承恩《西遊記》第一、二、三、四、七、十四、一百回（明）, url: 'https://zh.wikisource.org/wiki/西遊記/第001回'}
- id: keelung-zhongyuan-festival
  category: 台灣生活
  title: 基隆的雞籠中元祭
  cards: [story-mulian, god-sanguan]
  what: 內政部「臺灣宗教文化地圖」說，基隆的雞籠中元祭在 2008 年被指定為國家重要民俗，各姓氏輪流主辦，活動集中在農曆七月十三到十五日，包括放水燈遊行和十五日的中元普渡。頁面寫「中元節是地官赦罪之日」，十五日貼出的紅榜也寫著要昭告「中元地官大帝」；又說「盂蘭盆」這個詞和佛經裡目連救母的故事有關，佛教稱十五日為盂蘭盆節、道教稱為中元節。
  diff: 《佛說盂蘭盆經》講的是目連要在七月十五日供養眾僧才救得了母親，並沒有「普渡孤魂」；南宋《夢粱錄》則把七月十五寫成「中元地官赦罪之辰」。今天的中元祭是佛、道兩套說法疊在同一天：佛教誦經放焰口，道士用牲禮果品普渡孤魂。
  status: 已查證
  sources:
    - {cite: 內政部「臺灣宗教文化地圖：鷄籠中元祭」, url: 'https://taiwangods.moi.gov.tw/html/cultural/3_0011.aspx?i=4', accessed: '2026-11-21'}
    - {cite: 竺法護譯《佛說盂蘭盆經》（西晉；維基文庫所收版本署名如此）, url: 'https://zh.wikisource.org/wiki/佛說盂蘭盆經'}
    - {cite: 吳自牧《夢粱錄》卷一、卷四、卷六（南宋）, url: 'https://zh.wikisource.org/wiki/夢粱錄/卷04'}
- id: hualien-shengan-wangmu
  category: 台灣生活
  title: 花蓮勝安宮王母娘娘遶境
  cards: [god-xiwangmu, god-erlang]
  what: 國家文化記憶庫說，花蓮勝安宮的王母娘娘遶境，由廟出發，經吉安鄉、秀林鄉、新城鄉和花蓮市再回到廟裡，目的是「渡化沿途孤魂野鬼，淨化轄區達合境平安」；有三年一次的小規模遶境和五年一次的全縣大遶境。隊伍的順序依次是順天聖母、王三娘、二郎神、齊天大聖，最後才是王母娘娘。
  diff: 《山海經》裡的西王母是豹尾虎齒、掌管災厲的神，今天的王母娘娘是被供奉在廟裡、替地方求平安的女神；二郎神、齊天大聖也只是遶境隊伍裡的陪祀神明，和神話裡的故事沒有關係。這段資料沒有說明他們各自的來歷。
  status: 已查證
  sources:
    - {cite: 文化部國家文化記憶庫「花蓮勝安宮王母娘娘遶境活動」, url: 'https://tcmb.culture.tw/zh-tw/detail?indexCode=Culture_Place&id=289751', accessed: '2026-11-21'}
    - {cite: 《山海經·西山經》, url: 'https://zh.wikisource.org/wiki/山海經/西山經'}
- id: dujiangyan-erwang-temple
  category: 台灣生活
  title: 都江堰與二王廟
  cards: [god-erlang]
  what: 聯合國教科文組織說，青城山—都江堰是世界遺產；約在西元前 256 年由秦國蜀郡守李冰主持興建都江堰，遺產範圍裡的青城山有十一座重要道觀，其中包括二王廟。
  diff: 教科文組織的頁面只把二王廟列為遺產的一部分，沒有說廟裡祭的是誰。本站二郎神卡整理過：四川灌口的治水神有李冰之子、隋代趙昱、小說裡的楊戩三種來歷，哪一個才是廟裡的主角，要看各書怎麼說，這個頁面無法回答。
