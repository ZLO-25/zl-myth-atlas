- id: takamatsuzuka-four-symbols
  category: 名畫與雕塑
  title: 日本高松塚古墳的四神壁畫
  cards: [beast-four-symbols]
  what: 日本國營飛鳥歷史公園的介紹說，奈良縣明日香村的高松塚古墳建於七世紀末到八世紀初，2005 年的發掘把興建年代定在藤原京時期（694–710 年），壁畫在 1972 年被發現。石室東壁畫著青龍和上方的太陽，西壁是白虎和上方的月亮，北壁是玄武；頁面的比較表也把朱雀列為高松塚的四神像之一。
  diff: 中國古書裡四神是天上四大區星宿的圖像（《史記·天官書》有「東宮蒼龍」「南宮朱鳥」「北宮玄武」），後來用在墓葬與建築上。高松塚把它們畫在墓室牆壁上，是這套方位觀念傳到日本以後的樣子；介紹頁沒有說明日本人是怎麼接受這套說法的。
  status: 已查證
  sources:
