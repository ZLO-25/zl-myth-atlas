  cards: [god-luoshen]
  what: 香港故宮文化博物館「每日一文物」介紹的〈洛神賦圖〉，畫的是曹植《洛神賦》裡他與洛水女神從邂逅到分離的情景；畫上不寫賦文，用連續的構圖畫出多幕場景。這件作品一般被認為是北宋摹本，常和東晉顧愷之連在一起，但不是顧愷之的原作；它清代進了宮廷，1922 年由溥儀賜給溥傑，後來進入北京故宮博物院。
  diff: 屈原〈離騷〉裡的宓妃是拒絕求愛的傲慢女神，曹植把她寫成最美的水中仙女，畫家再把賦變成長卷。圖裡的洛神是畫家對文字的想像，不是古老的神話造像。
