- id: changbin-xuantian-shangdi
  category: 台灣生活
  title: 台東長濱保安宮的玄天上帝聖誕
  cards: [god-xuanwu]
  what: 國家文化記憶庫說，台東縣長濱鄉忠勇村保安宮主祀玄天上帝，遶境日期在農曆三月三日，也就是玄天上帝生日。由廟方委員和爐主規劃，可以選擇去外地進香、遶境、過火，或只在廟裡祭拜；當地乩童會在廟裡起乩傳達神明的決定。
  diff: 南宋《夢粱錄》寫杭州三月三日是「北極佑聖真君」聖誕，可見三月初三作為玄天上帝生日在宋代就有紀錄；本站玄武卡說他本來是天上北方七宿「玄武」。今天長濱的做法是由神明（透過乩童）決定怎麼慶祝，不是照固定行程表。
