- id: ich-three-legends
  category: 文學
  title: 白蛇傳、梁祝、孟姜女：國家級非物質文化遺產
  cards: [story-white-snake, story-liangzhu, story-mengjiangnu]
  what: 中國國務院 2006 年 5 月 20 日公布的第一批國家級非物質文化遺產名錄（國發〔2006〕18 號），民間文學類收有「白蛇傳傳說」（江蘇鎮江、浙江杭州申報）、「梁祝傳說」（浙江寧波、杭州、上虞，江蘇宜興，山東濟寧，河南汝南申報）和「孟姜女傳說」（山東淄博申報）。
  diff: 名錄把它們當成各地流傳的民間傳說來保護，沒有訂出標準版本。本站各卡查到的最早文字也不一樣：白蛇故事在唐代是吃人的蛇妖，明代《警世通言》才有雷峰塔；梁祝完整文字見明代《喻世明言》；孟姜女最早的底子是《左傳》裡拒絕在郊外受弔的杞梁之妻。申報地不只一處，也代表各地都說故事發生在自己那裡。
