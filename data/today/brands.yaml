# 今日影子：品牌與企業
- id: nike-brand
  category: 品牌與企業
  title: Nike（耐吉）
  cards: [event-titanomachy]
  what: 運動品牌 Nike 的名字取自希臘勝利女神妮琪（Nike）。
  diff: 赫西俄德說，泰坦之戰時，勝利女神和兄弟姊妹跟著母親斯堤克斯第一個投靠宙斯，從此永遠站在宙斯身邊。至於勾勾標誌是不是象徵女神的翅膀，我們查無品牌官方的可靠說法。
  status: 已查證
  sources:
    - {cite: 赫西俄德《神譜》383–403, url: 'https://www.theoi.com/Text/HesiodTheogony.html'}
    - {cite: 英文維基百科「Nike, Inc.」（輔助）, url: 'https://en.wikipedia.org/wiki/Nike,_Inc.'}
- id: hermes-brand
  category: 品牌與企業
  title: Hermès（愛馬仕）
  cards: [god-hermes]
  what: 很多人以為精品品牌 Hermès 來自信使之神荷米斯。
  diff: 其實它來自 1837 年在巴黎創業的馬具師傅蒂埃里．愛馬仕（Thierry Hermès）的姓氏，和神沒有直接關係。拼法相同，只是巧合。
  status: 已查證
  sources:
    - {cite: 英文維基百科「Hermès」（輔助）, url: 'https://en.wikipedia.org/wiki/Herm%C3%A8s'}
    - {cite: Theoi.com「Hermes」, url: 'https://www.theoi.com/Olympios/Hermes.html'}
- id: versace-medusa
  category: 品牌與企業
  title: 凡賽斯（Versace）的梅杜莎標誌
  cards: [monster-medusa]
  what: 義大利精品凡賽斯的商標，是一顆蛇髮的梅杜莎頭像。
  diff: 品牌常被解讀為取梅杜莎「讓人一看就無法移開目光」的吸引力；但在神話中，看她一眼的人會變成石頭，她本身是被詛咒、被斬首的悲劇角色。品牌標誌的確切用意，我們只找到媒體報導，沒有找到品牌官方的說明。
  status: 說法未證實
  sources:
    - {cite: Adweek「Versace's Medusa Logo Breaks Every Design Rule」, url: 'https://www.adweek.com/brand-marketing/versaces-medusa-logo-breaks-every-design-rule-so-why-does-it-work/'}
    - {cite: 奧維德《變形記》4.790–803, url: 'https://www.theoi.com/Text/OvidMetamorphoses4.html'}
- id: starbucks-siren
  category: 品牌與企業
  title: 星巴克的雙尾海妖
  cards: [story-odyssey, hero-odysseus]
  what: 星巴克綠色標誌中央是一位海妖（Siren）。官方說，設計靈感來自一張十六世紀北歐木刻版畫中的雙尾海妖。
  diff: 《奧德賽》和古希臘陶瓶上的海妖賽蓮是「女人頭、鳥身體」，用歌聲引誘水手送命；有魚尾巴的海妖是中世紀以後才流行的形象。
  status: 已查證
  sources:
    - {cite: 星巴克官方「The Story of the Siren」, url: 'https://about.starbucks.com/history/the-story-of-the-siren/'}
    - {cite: 荷馬《奧德賽》12.36–200, url: 'https://www.theoi.com/Text/HomerOdyssey12.html'}
- id: amazon-brand
  category: 品牌與企業
  title: Amazon（亞馬遜）
  cards: [hero-heracles]
  what: 電商 Amazon 的名字來自南美洲的亞馬遜河，創辦人貝佐斯想取世界最大河流的意象。
  diff: 河的名字則來自希臘神話的女戰士部族亞馬遜：十六世紀西班牙探險家在河邊遇到女戰士，就用了這個神話名稱。海克力斯的第九項任務，就是去取亞馬遜女王的腰帶。公司和神話之間，隔了一條河。
  status: 已查證
  sources:
    - {cite: Business Insider「How Amazon got its name」, url: 'https://www.businessinsider.in/how-amazon-got-its-name/articleshow/64068170.cms'}
    - {cite: Etymonline「Amazon」, url: 'https://www.etymonline.com/word/Amazon'}
    - {cite: 阿波羅多洛斯《書庫》2.5.9, url: 'https://www.theoi.com/Text/Apollodorus2.html'}
- id: ajax-name
  category: 品牌與企業
  title: Ajax（阿賈克斯足球隊、清潔劑）
  cards: [story-trojan-war, hero-achilles]
  what: 荷蘭足球俱樂部阿賈克斯和一個清潔劑品牌都叫 Ajax，取自特洛伊戰爭中的希臘英雄大埃阿斯，形象是強壯可靠。
  diff: 神話中的大埃阿斯力大無窮，但阿基里斯死後，他在爭奪阿基里斯盔甲時輸給了奧德修斯，羞憤發狂，最後自殺。他的結局一點也不光彩。
  status: 已查證
  sources:
    - {cite: 阿波羅多洛斯《書庫》摘要 5.6–5.7, url: 'https://www.theoi.com/Text/ApollodorusE.html'}
    - {cite: 英文維基百科「AFC Ajax」（輔助）, url: 'https://en.wikipedia.org/wiki/AFC_Ajax'}
