- {id: delphi, name_zh: 德爾菲, name_en: Delphi, name_orig: 'Δελφοί', kind: real, lat: 38.4824, lng: 22.5010, archaeology: 阿波羅神廟與神諭所遺址，列入世界遺產。, cards: [god-apollo, story-oedipus], src: [{cite: 聯合國教科文組織「Archaeological Site of Delphi」, url: 'https://whc.unesco.org/en/list/393'}]}
- {id: troy, name_zh: 特洛伊（希沙利克）, name_en: Troy (Hisarlik), name_orig: 'Ἴλιον / Τροία', kind: real, lat: 39.9575, lng: 26.2389, archaeology: 一層層疊起的古城遺址，十九世紀起開挖，多數學者認為就是特洛伊。, cards: [story-trojan-war, story-trojan-horse], src: [{cite: 聯合國教科文組織「Archaeological Site of Troy」, url: 'https://whc.unesco.org/en/list/849'}, {cite: World History Encyclopedia「Troy」, url: 'https://www.worldhistory.org/troy/'}]}
- {id: mycenae, name_zh: 邁錫尼, name_en: Mycenae, name_orig: 'Μυκῆναι', kind: real, lat: 37.7308, lng: 22.7561, archaeology: 青銅時代晚期的王城，有著名的獅子門；傳說是阿伽門農的城市。, cards: [story-trojan-war], src: [{cite: 聯合國教科文組織「Archaeological Sites of Mycenae and Tiryns」, url: 'https://whc.unesco.org/en/list/941'}]}
- {id: knossos, name_zh: 克諾索斯, name_en: Knossos, name_orig: 'Κνωσός', kind: real, lat: 35.2980, lng: 25.1632, archaeology: 克里特島上的米諾斯文明宮殿遺址，二十世紀初由伊文斯開挖並部分重建。, cards: [monster-minotaur, hero-theseus, story-icarus], src: [{cite: World History Encyclopedia「Knossos」, url: 'https://www.worldhistory.org/knossos/'}]}
- {id: athens, name_zh: 雅典衛城, name_en: Acropolis of Athens, name_orig: 'Ἀκρόπολις', kind: real, lat: 37.9715, lng: 23.7257, archaeology: 帕德嫩神廟所在地，供奉雅典娜。, cards: [god-athena, hero-theseus], src: [{cite: '聯合國教科文組織「Acropolis, Athens」', url: 'https://whc.unesco.org/en/list/404'}]}
- {id: olympia, name_zh: 奧林匹亞, name_en: Olympia, name_orig: 'Ὀλυμπία', kind: real, lat: 37.6383, lng: 21.6300, archaeology: 古代奧運舉辦地與宙斯神廟遺址；和奧林帕斯山是不同的地方。, cards: [god-zeus, place-olympus], src: [{cite: 聯合國教科文組織「Archaeological Site of Olympia」, url: 'https://whc.unesco.org/en/list/517'}]}
- {id: eleusis, name_zh: 厄琉息斯, name_en: Eleusis, name_orig: 'Ἐλευσίς', kind: real, lat: 38.0412, lng: 23.5384, archaeology: 以每年祭祀狄蜜特與波瑟芬妮的秘儀聞名。, cards: [god-demeter, story-persephone], src: [{cite: 'World History Encyclopedia「The Eleusinian Mysteries: The Rites of Demeter」', url: 'https://www.worldhistory.org/article/32/the-eleusinian-mysteries-the-rites-of-demeter/'}]}
- {id: ithaca, name_zh: 伊塔卡島, name_en: Ithaca, name_orig: 'Ἰθάκη', kind: real, lat: 38.3700, lng: 20.7200, archaeology: 荷馬讓奧德修斯說，他的家鄉伊塔卡「清晰可見」，島上有一座內里同山。, cards: [hero-odysseus, story-odyssey], src: [{cite: 荷馬《奧德賽》9.19–28（奧德修斯描述家鄉）, url: 'https://www.theoi.com/Text/HomerOdyssey9.html'}]}
- {id: rome, name_zh: 羅馬帕拉丁丘, name_en: 'Palatine Hill, Rome', name_orig: 'Palatium', kind: real, lat: 41.8892, lng: 12.4875, archaeology: 傳說羅慕路斯在此建城，傳統建城年份是前 753 年。, cards: [story-romulus-remus, god-janus], src: [{cite: 聯合國教科文組織「Historic Centre of Rome」, url: 'https://whc.unesco.org/en/list/91'}, {cite: World History Encyclopedia「Ancient Rome」, url: 'https://www.worldhistory.org/Rome/'}]}
- {id: avernus, name_zh: 阿韋爾努斯湖, name_en: Lake Avernus, name_orig: 'Lacus Avernus', kind: real, lat: 40.8389, lng: 14.0758, archaeology: 維吉爾筆下埃涅阿斯進入冥界的入口。, cards: [place-underworld, hero-aeneas], src: [{cite: 維吉爾《埃涅阿斯紀》卷 6, url: 'http://classics.mit.edu/Virgil/aeneid.6.vi.html'}]}
- {id: taenarum, name_zh: 泰納羅角, name_en: Cape Taenarum (Matapan), name_orig: 'Ταίναρον', kind: real, lat: 36.3866, lng: 22.4828, archaeology: 拉科尼亞的海角，古人相信這裡有通往冥界的洞口，海克力斯由此下冥界。, cards: [place-underworld, hero-heracles], src: [{cite: 阿波羅多洛斯《書庫》2.5.12, url: 'https://www.theoi.com/Text/Apollodorus2.html'}]}
# 中華神話（system: chinese）。座標取今日地名的近似位置；傳說地點是否就是故事發生地，學界並無定論。
- {id: zhuolu, system: chinese, name_zh: 涿鹿, name_en: Zhuolu, name_orig: 涿鹿 / Zhuōlù, kind: real, lat: 40.38, lng: 115.21, archaeology: 傳說黃帝與蚩尤大戰之地，今河北省張家口市涿鹿縣；古書只說「涿鹿之野」，確切戰場位置沒有定論。, cards: [story-zhuolu, god-huangdi, god-chiyou], src: [{cite: 司馬遷《史記·五帝本紀》（「戰於涿鹿之野」）, url: 'https://ctext.org/shiji/wu-di-ben-ji/zh'}]}
- {id: huangdi-tomb, system: chinese, name_zh: 黃帝陵（橋山）, name_en: Mausoleum of the Yellow Emperor, name_orig: 黃帝陵 / Huángdìlíng, kind: real, lat: 35.59, lng: 109.26, archaeology: 陝西省延安市黃陵縣的祭祀陵園；《史記》說黃帝葬在橋山。現存陵墓是後世祭祀用的，並非考古證實的墓葬。, cards: [god-huangdi], src: [{cite: 司馬遷《史記·五帝本紀》（「葬橋山」）, url: 'https://ctext.org/shiji/wu-di-ben-ji/zh'}]}
- {id: kuaiji-yu, system: chinese, name_zh: 會稽山（大禹陵）, name_en: Mount Kuaiji and the Mausoleum of Yu, name_orig: 會稽 / Kuàijī, kind: real, lat: 29.99, lng: 120.60, archaeology: 浙江省紹興市的大禹陵是後世祭祀大禹的地方；《史記》說禹到會稽召集諸侯，死後葬在這裡。, cards: [hero-yu, story-yu-flood], src: [{cite: 司馬遷《史記·夏本紀》（「至於會稽而崩」）, url: 'https://ctext.org/shiji/xia-ben-ji/zh'}]}
- {id: taishan, system: chinese, name_zh: 泰山, name_en: Mount Tai, name_orig: 泰山 / Tàishān, kind: real, lat: 36.25, lng: 117.10, archaeology: 山東省的名山，列入世界遺產；歷代帝王在此舉行封禪，古書說黃帝等古帝王也曾封禪泰山。, cards: [god-huangdi], src: [{cite: 聯合國教科文組織「Mount Taishan」, url: 'https://whc.unesco.org/en/list/437'}, {cite: 司馬遷《史記·封禪書》, url: 'https://ctext.org/shiji/feng-chan-shu/zh'}]}
- {id: kunlun-range, system: chinese, name_zh: 崑崙山脈, name_en: Kunlun Mountains, name_orig: 崑崙 / Kūnlún, kind: real, lat: 36.00, lng: 90.00, archaeology: 漢武帝依古書替黃河源頭附近的山命名為「崑崙」，今天的崑崙山脈橫跨新疆、西藏與青海；神話裡的崑崙是仙山，兩者是後來才被連在一起的。, cards: [place-kunlun, god-xiwangmu], src: [{cite: 司馬遷《史記·大宛列傳》, url: 'https://ctext.org/shiji/da-yuan-lie-zhuan/zh'}]}

# 北歐（system: norse）。座標取近似位置；每個地點與神話的關係都寫明資料來源是文獻還是後人的說法。
- {id: reykholt, system: norse, name_zh: 雷克霍特, name_en: Reykholt, name_orig: Reykholt, kind: real, lat: 64.667, lng: -21.300, archaeology: 冰島西部的聚落，中世紀詩人兼政治人物斯諾里曾住在這裡，他農場的遺跡（包括浴池與連到屋子的地道）今天還能參觀；他寫的《散文埃達》是本站多張北歐卡的來源。, cards: [place-yggdrasil, primordial-ymir, god-odin], src: [{cite: '維基百科「Reykholt, Western Iceland」', url: 'https://en.wikipedia.org/wiki/Reykholt,_Western_Iceland'}, {cite: World History Encyclopedia「Edda」（《散文埃達》約 1220 年，斯諾里編）, url: 'https://www.worldhistory.org/Edda/'}]}
- {id: gamla-uppsala, system: norse, name_zh: 舊烏普薩拉, name_en: Gamla Uppsala, name_orig: Gamla Uppsala, kind: real, lat: 59.898, lng: 17.634, archaeology: 11 世紀的基督教作者不來梅的亞當（約 1070 年代）寫道，這裡有一座供奉索爾、奧丁與弗雷的神廟；這是基督教作者的轉述，不是北歐人自己的記載。19 世紀挖掘證明這裡的大土丘是王室墓，World History Encyclopedia 也寫道考古紀錄不支持真有這座神廟。, cards: [god-thor, god-odin], src: [{cite: World History Encyclopedia「Temple at Uppsala」, url: 'https://www.worldhistory.org/Temple_at_Uppsala/'}, {cite: 不來梅的亞當《漢堡大主教教會史》卷 4 第 26 章（英譯）, url: 'https://www.germanicmythology.com/works/uppsalatemple.html'}, {cite: World History Encyclopedia「Norse Mythology」, url: 'https://www.worldhistory.org/Norse_Mythology/'}]}
