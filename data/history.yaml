# 真實歷史對照軸（西元前用負數）。和神話年代並排顯示，提醒讀者：神話不是史實。
- {label: 米諾斯文明的宮殿時代, start: -1900, end: -1450, note: 克里特島的克諾索斯等宮殿繁盛，米諾陶洛斯與迷宮的傳說常被拿來和這些宮殿聯想。, src: [{cite: World History Encyclopedia「Minoan Civilization」, url: 'https://www.worldhistory.org/Minoan_Civilization/'}]}
- {label: 邁錫尼文明, start: -1700, end: -1100, note: 希臘本土的青銅時代王國，荷馬史詩裡的「阿伽門農的邁錫尼」以此為背景。, src: [{cite: World History Encyclopedia「Mycenaean Civilization」, url: 'https://www.worldhistory.org/Mycenaean_Civilization/'}]}
- {label: 特洛伊遺址的城市毀壞, start: -1300, end: -1180, note: 希沙利克遺址的晚期城市層有毀壞痕跡，常被拿來和特洛伊戰爭對照，但無法證明戰爭真的發生。, src: [{cite: World History Encyclopedia「Troy」, url: 'https://www.worldhistory.org/troy/'}]}
- {label: 荷馬史詩成形, start: -750, end: -700, note: 《伊里亞德》《奧德賽》大約在這段時間成形（以口傳為主，何時寫成文字仍有爭論），距離它描寫的時代已經好幾百年。, src: [{cite: World History Encyclopedia「Homer」, url: 'https://www.worldhistory.org/homer/'}]}
- {label: 赫西俄德寫《神譜》, start: -700, end: -700, note: 一部記述希臘眾神與他們家譜的獨特作品。, src: [{cite: World History Encyclopedia「Hesiod」, url: 'https://www.worldhistory.org/hesiod/'}]}
- {label: 羅馬傳統建城年, start: -753, end: -753, note: 這是羅馬人自己推算的年份，不是考古確定的日期。, src: [{cite: World History Encyclopedia「Ancient Rome」, url: 'https://www.worldhistory.org/Rome/'}]}
- {label: 帕德嫩神廟興建, start: -447, end: -432, note: 雅典人在衛城上為雅典娜建造的神廟。, src: [{cite: World History Encyclopedia「Parthenon」, url: 'https://www.worldhistory.org/parthenon/'}]}
- {label: 索福克勒斯《伊底帕斯王》上演, start: -429, end: -429, note: 年代為學者推估，一般認為約在前 429 年前後（也有學者推到前 420 年代）。, src: [{cite: World History Encyclopedia「Oedipus the King」, url: 'https://www.worldhistory.org/Oedipus_the_King/'}]}
- {label: 維吉爾寫《埃涅阿斯紀》, start: -29, end: -19, note: 奧古斯都時代，替羅馬寫出特洛伊起源的史詩；維吉爾死時尚未完成修訂。, src: [{cite: World History Encyclopedia「Aeneid」, url: 'https://www.worldhistory.org/Aeneid/'}]}
- {label: 奧維德完成《變形記》, start: 8, end: 8, note: 公元 8 年左右，奧維德被流放前完成；許多今天熟悉的神話版本出自這本書。, src: [{cite: World History Encyclopedia「Ovid」, url: 'https://www.worldhistory.org/ovid/'}]}
