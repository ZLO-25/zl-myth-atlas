# 真實歷史對照軸（西元前用負數）。和神話年代並排顯示，提醒讀者：神話不是史實。
- {label: 米諾斯文明的宮殿時代, start: -1900, end: -1450, note: 克里特島的克諾索斯等宮殿繁盛，米諾陶洛斯與迷宮的傳說常被拿來和這些宮殿聯想。, src: [{cite: World History Encyclopedia「Minoan Civilization」, url: 'https://www.worldhistory.org/Minoan_Civilization/'}]}
- {label: 邁錫尼文明, start: -1700, end: -1100, note: 希臘本土的青銅時代王國，荷馬史詩裡的「阿伽門農的邁錫尼」以此為背景。, src: [{cite: World History Encyclopedia「Mycenaean Civilization」, url: 'https://www.worldhistory.org/Mycenaean_Civilization/'}]}
- {label: 特洛伊遺址的城市毀壞, start: -1300, end: -1180, note: 希沙利克遺址的晚期城市層有毀壞痕跡，常被拿來和特洛伊戰爭對照，但無法證明戰爭真的發生。, src: [{cite: World History Encyclopedia「Troy」, url: 'https://www.worldhistory.org/troy/'}]}
- {label: 荷馬史詩成形, start: -750, end: -700, note: 《伊里亞德》《奧德賽》大約在這段時間成形（以口傳為主，何時寫成文字仍有爭論），距離它描寫的時代已經好幾百年。, src: [{cite: World History Encyclopedia「Homer」, url: 'https://www.worldhistory.org/homer/'}]}
- {label: 赫西俄德寫《神譜》, start: -700, end: -700, note: 一部記述希臘眾神與他們家譜的獨特作品。, src: [{cite: World History Encyclopedia「Hesiod」, url: 'https://www.worldhistory.org/hesiod/'}]}
- {label: 羅馬傳統建城年, start: -753, end: -753, note: 這是羅馬人自己推算的年份，不是考古確定的日期。, src: [{cite: World History Encyclopedia「Ancient Rome」, url: 'https://www.worldhistory.org/Rome/'}]}
- {label: 帕德嫩神廟興建, start: -447, end: -432, note: 雅典人在衛城上為雅典娜建造的神廟。, src: [{cite: World History Encyclopedia「Parthenon」, url: 'https://www.worldhistory.org/parthenon/'}]}
- {label: 索福克勒斯《伊底帕斯王》上演, start: -429, end: -429, note: 年代為學者推估，一般認為約在前 429 年前後（也有學者推到前 420 年代）。, src: [{cite: World History Encyclopedia「Oedipus the King」, url: 'https://www.worldhistory.org/Oedipus_the_King/'}]}
- {label: 維吉爾寫《埃涅阿斯紀》, start: -29, end: -19, note: 奧古斯都時代，替羅馬寫出特洛伊起源的史詩；維吉爾死時尚未完成修訂。, src: [{cite: World History Encyclopedia「Aeneid」, url: 'https://www.worldhistory.org/Aeneid/'}]}
- {label: 奧維德完成《變形記》, start: 8, end: 8, note: 公元 8 年左右，奧維德被流放前完成；許多今天熟悉的神話版本出自這本書。, src: [{cite: World History Encyclopedia「Ovid」, url: 'https://www.worldhistory.org/ovid/'}]}

# ── 北歐（system: norse）：北歐神話主要靠兩部埃達留下來；這幾筆是它們被寫下的背景 ──
- {system: norse, label: 維京時代, start: 793, end: 1066, note: 北歐人還信奉這些神的年代；這套信仰是隨著基督教的影響才慢慢改變的。, src: [{cite: World History Encyclopedia「Vikings」（Joshua J. Mark）, url: 'https://www.worldhistory.org/Vikings/'}, {cite: World History Encyclopedia「Norse Mythology」（Mark Cartwright）, url: 'https://www.worldhistory.org/Norse_Mythology/'}]}
- {system: norse, label: 冰島改信基督教, start: 1000, end: 1000, note: 後來寫下《散文埃達》的斯諾里是冰島的基督徒，他是站在基督教的立場整理這些故事的。, src: [{cite: 《尼雅爾薩迦》第 105 章（冰島議會通過全民信基督教）註解「Iceland Accepts Christianity」, url: 'https://sites.pitt.edu/~dash/njal100.html'}, {cite: World History Encyclopedia「Christianization of Iceland」, url: 'https://www.worldhistory.org/article/2670/christianization-of-iceland/'}]}
- {system: norse, label: 斯諾里寫《散文埃達》, start: 1220, end: 1220, note: 一本把北歐神話從頭到尾講清楚的整理本；很多完整的情節只見於這本書。, src: [{cite: World History Encyclopedia「Edda」, url: 'https://www.worldhistory.org/Edda/'}, {cite: World History Encyclopedia「Norse Mythology」, url: 'https://www.worldhistory.org/Norse_Mythology/'}]}
- {system: norse, label: 《詩體埃達》編成, start: 1270, end: 1270, note: 一部古詩集，作者不明；詩很短、很跳，常常只用幾行帶過一件大事。, src: [{cite: World History Encyclopedia「Edda」, url: 'https://www.worldhistory.org/Edda/'}, {cite: World History Encyclopedia「Norse Mythology」, url: 'https://www.worldhistory.org/Norse_Mythology/'}]}

# ── 中華（system: chinese）：沒有一本專講神話的書，故事散在不同時代的古書裡 ──
- {system: chinese, label: 屈原與《楚辭》, start: -339, end: -278, note: 屈原的作品收在《楚辭》裡；本站的女媧、鯀、后羿等卡引用了其中的〈天問〉，扶桑、羲和等卡也引用《楚辭》。, src: [{cite: 大英百科「Qu Yuan」（約前 339 生，前 278 卒）, url: 'https://www.britannica.com/biography/Qu-Yuan'}]}
- {system: chinese, label: 《山海經》, start: -300, end: 100, note: 一部記載山川、異獸與神怪的古書，本站的西王母、夸父、精衛等卡都引用它。, src: [{cite: 大英百科「Fenghuang」（《山海經》年代：前 3 世紀～西元 1 世紀）, url: 'https://www.britannica.com/topic/fenghuang'}]}
- {system: chinese, label: 《淮南子》, start: -200, end: -101, note: 西漢淮南王劉安門下所編；女媧補天、嫦娥奔月、羿射十日等故事，本站引用的是這本書的記載。, src: [{cite: 大英百科「Huainanzi」（前 2 世紀，劉安主持編寫）, url: 'https://www.britannica.com/topic/Huainanzi'}]}
- {system: chinese, label: 司馬遷與《史記》, start: -145, end: -87, note: 這段是司馬遷的生卒年（約前 145～前 87），大英百科沒寫《史記》完成的年份；《史記》把黃帝、堯舜禹寫成歷史人物，本站這些卡都引用它。, src: [{cite: 大英百科「Sima Qian」（約前 145 生，約前 87 卒）, url: 'https://www.britannica.com/biography/Sima-Qian'}]}
- {system: chinese, label: 徐整寫下盤古, start: 220, end: 280, note: 三國時代的徐整在《三五曆紀》裡寫下盤古開天；盤古排在神話最前面，卻是這些故事裡最晚才寫進書的。, src: [{cite: 徐整《三五曆紀》，見歐陽詢《藝文類聚》卷 1〈天部上〉, url: 'https://zh.wikisource.org/wiki/%E8%97%9D%E6%96%87%E9%A1%9E%E8%81%9A/%E5%8D%B7001'}, {cite: 大英百科「Pan Gu」（創世神話約出現於 3 到 6 世紀）, url: 'https://www.britannica.com/topic/Pan-Gu'}]}
